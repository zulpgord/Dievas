        L('<p>Quando la <b>presa</b> scende a 3 o meno, l’app te lo dice. Compi il rito: la creatura sale nel Paradiso col suo diario intatto. Non serve che tu abbia smesso di sentirla — serve che abbia smesso di decidere.</p></div></div>','<p>When the <b>grip</b> drops to 3 or less, the app tells you. Perform the rite: the creature rises into Paradise with its diary intact. You don’t need to have stopped feeling it — it needs to have stopped deciding.</p></div></div>')+
    '</div>'+

    L('<div class="rubric"><h2>Il ritmo</h2></div>','<div class="rubric"><h2>The pace</h2></div>')+
    '<table class="rhythm"><tbody>'+
      L('<tr><td>Ogni sera</td><td>Voce rapida: due tocchi per ogni creatura che si è fatta viva. Se non si è vista, non segnare niente.</td></tr>','<tr><td>Every evening</td><td>Quick entry: two taps for each creature that showed up. If it didn’t appear, record nothing.</td></tr>')+
      L('<tr><td>1–2 volte<br>a settimana</td><td>Una voce lunga, sulla creatura che ha fatto più rumore.</td></tr>','<tr><td>1–2 times<br>a week</td><td>One long entry, on whichever creature made the most noise.</td></tr>')+
      L('<tr><td>Una volta<br>a settimana</td><td>Cinque minuti nel Registro: presagi e terreno.</td></tr>','<tr><td>Once<br>a week</td><td>Five minutes in the Ledger: omens and ground.</td></tr>')+
      L('<tr><td>Ogni due mesi</td><td>La relazione di otto settimane. E un backup del tomo.</td></tr>','<tr><td>Every two months</td><td>The eight-week report. And a backup of the tome.</td></tr>')+
      L('<tr><td>Quando serve</td><td>Il rito, se la presa è scesa. Una nuova evocazione, se compare una bestia nuova.</td></tr>','<tr><td>As needed</td><td>The rite, if the grip has dropped. A new summoning, if a new beast appears.</td></tr>')+
    '</tbody></table>'+

    L('<div class="rubric"><h2>A che serve il diario</h2></div>','<div class="rubric"><h2>What the diary is for</h2></div>')+
    L('<p class="prose">A tre cose, in ordine di importanza. <b>Vedere l’evitamento</b>: nel momento non ti accorgi di stare rinunciando a qualcosa, a distanza di settimane invece si conta. <b>Rendere la bestia una cosa esterna</b>, con un nome e una faccia, invece di uno stato d’animo che sei tu. <b>Accorgerti dei cambiamenti lenti</b>: nessuno ricorda com’era due mesi fa, i numeri sì.</p>','<p class="prose">Three things, in order of importance. <b>Seeing the avoidance</b>: in the moment you don’t notice you’re giving something up, but weeks later it adds up. <b>Making the beast something outside you</b>, with a name and a face, instead of a mood that <i>is</i> you. <b>Noticing slow change</b>: nobody remembers what two months ago felt like — the numbers do.</p>')+
    L('<p class="note">Quello che il diario non fa: farla passare mentre la scrivi. Se ti accorgi di scrivere <i>durante</i> l’ansia per calmarti, stai usando l’app come rassicurazione — chiudila e scrivi stasera.</p>','<p class="note">What the diary doesn’t do: make it pass while you write. If you catch yourself writing <i>during</i> the anxiety in order to calm down, you’re using the app as reassurance — close it and write tonight.</p>')+

    L('<div class="rubric"><h2>Che cosa non è</h2></div>','<div class="rubric"><h2>What it isn\u2019t</h2></div>')+
    L('<p class="prose">Non è una terapia e non fa diagnosi. Usa tecniche che vengono dalla terapia cognitivo-comportamentale — guardare l\u2019evitamento, esporsi a piccoli passi, rimandare il rimuginio — ma da sola non sostituisce un professionista. Se l\u2019ansia ti toglie il sonno, il lavoro o le persone da settimane, parlane col medico o con uno psicologo: il tomo e la relazione di otto settimane sono un ottimo punto da cui partire.</p>','<p class="prose">It isn\u2019t therapy and it doesn\u2019t diagnose. It uses techniques from cognitive behavioural therapy — watching avoidance, small-step exposure, postponing worry — but on its own it doesn\u2019t replace a professional. If anxiety has been taking your sleep, your work or your people for weeks, talk to your doctor or a psychologist: the tome and the eight-week report are a good place to start.</p>')+
    L('<div class="btnrow"><button class="btn" id="mn-sos">Se stai male adesso</button></div>','<div class="btnrow"><button class="btn" id="mn-sos">If you feel bad right now</button></div>')+
    L('<div class="rubric"><h2>Le tre ante</h2></div>','<div class="rubric"><h2>The three panels</h2></div>')+
    L('<p class="prose"><b>Inferno</b> (destra): la mappa delle creature vive. Pizzica per ingrandire, trascina una bestia per spostarla, toccala per aprirla.<br>','<p class="prose"><b>Inferno</b> (right): the map of living creatures. Pinch to zoom, drag a beast to move it, tap it to open it.<br>')+
    L('<b>Registro</b> (centro): i conti del custode, l’elenco completo, la relazione, i backup.<br>','<b>Ledger</b> (centre): the keeper’s accounts, the full list, the report, the backups.<br>')+
    L('<b>Paradiso</b> (sinistra): chi è stato liberato, che resta leggibile per sempre.</p>','<b>Paradise</b> (left): those released, who stay readable for ever.</p>')+
    L('<div class="btnrow"><button class="btn" id="mn-intro">Rivedere il tutorial</button></div>','<div class="btnrow"><button class="btn" id="mn-intro">Replay the tutorial</button></div>'),
    function(sh){
      sh.querySelector("#mn-intro").onclick=function(){ closeSheet(); showIntro(); };
      sh.querySelector("#mn-sos").onclick=openSOS;
    });
}

/* ===================== guida ===================== */
var INTRO_KEY="bestiario.intro.v1";
function introSeen(){ try{ return localStorage.getItem(INTRO_KEY)==="1"; }catch(e){ return true; } }
function markIntro(){ try{ localStorage.setItem(INTRO_KEY,"1"); }catch(e){} }
function showIntro(){
  var app=document.querySelector(".app"); if(!app) return;
  /* Stoppino: il custode del bestiario, un piccolo dievas con la fiammella in testa */
  var GUIDE={id:"guide", kind:"dievas", seed:1313, entries:[], intensity:4};
  var steps=[
    {t:L("Ciao, sono Stoppino","Hi, I’m Wick"), pose:"wave",
     d:L("Tengo accesa la candela di questo bestiario. Qui le <b>ansie</b> si chiamano <b>dievas</b> e le <b>paure</b> <b>demoni</b>. Io sono un dievas anch’io, ma di quelli addomesticati. Ti faccio vedere come funziona: ci vuole un minuto.","I keep this bestiary’s candle lit. Here <b>anxieties</b> are called <b>dievas</b> and <b>fears</b> are called <b>demons</b>. I’m a dievas myself, a tame one. Let me show you how it works: it takes a minute.")},
    {t:L("Dai un nome","Give it a name"), pose:"think",
     d:L("Finché è «l’ansia», sei tu. Quando ha un <b>nome</b>, una faccia e un territorio, diventa <b>una cosa che ogni tanto arriva</b>. Il nome disegna la bestia; e se scrivi <b>che cosa faresti se non ci fosse</b>, sai anche che cosa ti sta togliendo.","As long as it’s «the anxiety», it’s you. Once it has a <b>name</b>, a face and a territory, it becomes <b>a thing that turns up now and then</b>. The name draws the beast; and if you write <b>what you’d do if it weren’t there</b>, you also know what it’s taking from you.")},
    {t:L("Ogni sera, due tocchi","Every evening, two taps"), pose:"nod",
     d:L("Apri la <b>rassegna serale</b>: per ogni creatura che si è fatta viva, quanto forte l’hai sentita e la domanda che conta. Trenta secondi. Se vuoi, nel Registro metto un <b>promemoria nel calendario</b> che ti riporta qui ogni sera.","Open the <b>evening round</b>: for each creature that showed up, how strongly you felt it and the question that counts. Thirty seconds. If you like, in the Ledger I can put a <b>calendar reminder</b> that brings you back here every evening.")},
    {t:L("La domanda che conta","The question that counts"), pose:"lean",
     d:L("<b>Oggi ha deciso lei che cosa facevi?</b> Se l’hai fatto lo stesso, hai <b>tenuto il terreno</b>; se hai evitato, gliel’hai <b>ceduto</b>. Conta questo, non quanto forte la senti: da qui nasce la <b>presa</b>, che decide quanto è grande sulla mappa.","<b>Did it decide what you did today?</b> If you did it anyway, you <b>held the ground</b>; if you avoided it, you <b>gave it up</b>. That’s what counts, not how strongly you feel it: it’s where the <b>grip</b> comes from, which sets how big it looms on the map.")},
    {t:L("Un gradino alla volta","One rung at a time"), pose:"hop",
     d:L("Dopo qualche sera il bestiario si <b>rivela</b> un po’ alla volta. Arrivano le <b>sfide</b>: una cosa che eviti, fatta lo stesso. Prima scrivi <b>che cosa temi che succeda</b>, dopo controlli se è successo davvero. Quasi mai. Poi si sale di un gradino.","After a few evenings the bestiary <b>reveals itself</b> bit by bit. The <b>challenges</b> arrive: something you avoid, done anyway. First you write <b>what you fear will happen</b>, afterwards you check whether it really did. It almost never does. Then you climb a rung.")},
    {t:L("Di notte, la luna","At night, the moon"), pose:"sleep",
     d:L("Se ti prende alle tre di notte, tocca la <b>luna</b> in alto. Non ti chiedo niente: scrivi una riga, la <b>parcheggio</b> e te la ridò la sera dopo, a mente fredda. Rimandare il rimuginio funziona davvero.","If it grabs you at three in the morning, tap the <b>moon</b> at the top. I won’t ask you anything: write one line, I’ll <b>park</b> it and hand it back the next evening, with a cool head. Postponing worry really works.")},
    {t:L("Le tre ante","The three panels"), pose:"wave",
     d:L("A destra l’<b>Inferno</b>, dove vivono. Al centro il <b>Registro</b>: i conti, il <b>termometro</b> una volta al mese, i backup. A sinistra il <b>Paradiso</b>: quando una creatura non decide più, il <b>rito</b> la manda lassù, col suo diario intatto.","On the right the <b>Inferno</b>, where they live. In the centre the <b>Ledger</b>: the accounts, the monthly <b>thermometer</b>, the backups. On the left <b>Paradise</b>: when a creature no longer decides, the <b>rite</b> sends it up there, its diary intact.")},
    {t:L("Una cosa importante","One important thing"), pose:"think",
     d:L("Io tengo il conto, ma <b>non sono una terapia</b>. Se stai male davvero, dalla luna trovi anche i <b>numeri di emergenza e di ascolto</b>. E parlarne con una persona vera resta sempre la mossa migliore. Ora tocca a te.","I keep count, but <b>I’m not therapy</b>. If you really feel bad, the moon also leads to <b>emergency numbers and helplines</b>. And talking to a real person is always the better move. Now it’s your turn.")}
  ];
  var i=0, timer=null;
  var ov=document.createElement("div");
  ov.className="intro";
  ov.innerHTML='<div class="step">'+
      '<div class="guide"><div class="glow"></div><div class="body"><canvas></canvas></div></div>'+
      '<div class="bubble"><h2></h2><p></p></div>'+
    '</div>'+
    '<div class="dots"></div><div class="nav"></div>';
  app.appendChild(ov);
  var cv=ov.querySelector(".guide canvas"), guide=ov.querySelector(".guide"), bubble=ov.querySelector(".bubble");
  var dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=170*dpr; cv.height=170*dpr; cv.style.width="170px"; cv.style.height="170px";
  var cc=cv.getContext("2d"); cc.setTransform(dpr,0,0,dpr,0,0);
  cc.translate(85,80); drawGrotesque(cc, 50, GUIDE, null);

  /* parola per parola, come se parlasse */
  function speak(html){
    var p=bubble.querySelector("p"), n=0;
    p.innerHTML=html.replace(/(<[^>]+>)|([^<\s]+)/g, function(m, tag, word){
      if(tag) return tag;
      return '<span class="w" style="animation-delay:'+(reduceMotion?0:(n++)*45)+'ms">'+word+'</span>';
    });
    guide.classList.add("talk");
    clearTimeout(timer);
    timer=setTimeout(function(){ guide.classList.remove("talk"); }, reduceMotion?0:n*45+250);
  }
  function finishSpeaking(){
    bubble.querySelectorAll(".w").forEach(function(w){ w.style.animationDelay="0ms"; });
    clearTimeout(timer); guide.classList.remove("talk");
  }
  bubble.onclick=finishSpeaking;
  function draw(){
    var st=steps[i];
    guide.className="guide pose-"+st.pose;
    void guide.offsetWidth;
    bubble.classList.remove("in"); void bubble.offsetWidth; bubble.classList.add("in");
    bubble.querySelector("h2").innerHTML=st.t;
    speak(st.d);
    ov.querySelector(".dots").innerHTML=steps.map(function(x,j){ return '<i class="'+(j===i?"on":"")+'"></i>'; }).join("");
    ov.querySelector(".nav").innerHTML=(i>0?L('<button class="ghost" data-back>Indietro</button>','<button class="ghost" data-back>Back</button>'):L('<button class="ghost" data-skip>Salta</button>','<button class="ghost" data-skip>Skip</button>'))+
      '<button data-next>'+(i===steps.length-1?(living().length?L("Comincia","Begin"):L("Evoca la prima","Summon the first")):L("Avanti","Next"))+'</button>';
    var b=ov.querySelector("[data-back]"), sk=ov.querySelector("[data-skip]");
    if(b) b.onclick=function(){ i--; draw(); };
    if(sk) sk.onclick=close;
    ov.querySelector("[data-next]").onclick=function(){
      if(i===steps.length-1){
        close();
        if(!living().length){ view="inferno"; render(); setTimeout(function(){ openForm(null); }, 250); }
      }
      else { i++; draw(); }
    };
  }
  function close(){ clearTimeout(timer); markIntro(); ov.remove(); }
  draw();
}

/* ===================== download nel browser ===================== */
function downloadBlob(blob, filename){
  try{
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    a.href=url; a.download=filename; a.rel="noopener";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ try{ URL.revokeObjectURL(url); a.remove(); }catch(e){} }, 1500);
    return true;
  }catch(e){ return false; }
}

/* ===================== custodia ===================== */
function stateJSON(){ return JSON.stringify(S).replace(/</g,"\\u003c"); }
function buildDocument(){
  var style=el("app-style").textContent;
  var open="<scr"+"ipt", close="</scr"+"ipt>";
  var blocks="";
  ["app-lang","app-code-it","app-code-en","app-code"].forEach(function(id){
    var e=el(id);
    if(e) blocks+=open+' id="'+id+'">'+e.textContent+close;
  });
  return '<!doctype html><html lang="'+(window.__LANG==="en"?"en":"it")+'"><head><meta charset="utf-8">'+
    '<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">'+
    '<title>'+TITLE+'</title>'+FONTS+
    '<style id="app-style">'+style+'</style></head><body>'+SHELL+
    open+' id="app-state" type="application/json">'+stateJSON()+close+
    blocks+'</body></html>';
}
function sealVolume(){
  var doc=buildDocument();
  var ok=downloadBlob(new Blob([doc],{type:"text/html"}), "bestiario-"+todayISO()+".html");
  if(ok) markBackup();
  toast(ok
    ? L("Copia scaricata: è l'app intera con dentro le tue creature. Si apre anche senza rete.","Copy downloaded: it’s the whole app with your creatures inside. It opens offline too.")
    : L("Download non riuscito. Usa l'esportazione del backup.","Download failed. Use the backup export instead."));
}
function exportBackup(){
  var name="bestiario-"+todayISO()+".json", data=JSON.stringify(S,null,2);
  var blob=new Blob([data],{type:"application/json"});
  /* sul telefono: menu di condivisione, così il file finisce in File/iCloud/Drive */
  var file=null;
  try{ file=new File([blob], name, {type:"application/json"}); }catch(e){}
  if(file && navigator.canShare && navigator.share && /Android|iPhone|iPad|iPod/.test(navigator.userAgent) && navigator.canShare({files:[file]})){
    navigator.share({files:[file], title:TITLE}).then(function(){
      markBackup(); toast(L("Backup salvato.","Backup saved."));
    }).catch(function(err){
      if(err && err.name==="AbortError") return;
      if(downloadBlob(blob, name)){ markBackup(); toast(L("Backup scaricato.","Backup downloaded.")); } else showRaw(data);
    });
    return;
  }
  if(downloadBlob(blob, name)){ markBackup(); toast(L("Backup scaricato.","Backup downloaded.")); }
  else showRaw(data);
}

/* ===================== promemoria serale (calendario) ===================== */
function appURL(){ return /^https?:$/.test(location.protocol) ? location.origin+location.pathname : ""; }
function icsStamp(d){ return d.toISOString().replace(/[-:]/g,"").replace(/\.\d+/,""); }
function openReminder(){
  sheet(L('<h2>Promemoria serale</h2>','<h2>Evening reminder</h2>'),
    L('<p class="note">Il bestiario funziona se lo apri ogni sera. Senza un server non può mandarti notifiche da solo, quindi il promemoria lo mette il tuo calendario: un evento ogni giorno all\u2019ora che scegli, con il link per aprire subito la rassegna. Resta tutto sul tuo telefono.</p>','<p class="note">The bestiary works if you open it every evening. Without a server it can\u2019t send notifications by itself, so your calendar does the reminding: an event every day at the time you choose, with a link that opens the round straight away. Everything stays on your phone.</p>')+
    L('<div class="field"><div class="lbl">A che ora</div>','<div class="field"><div class="lbl">At what time</div>')+'<input type="time" id="rm-time" value="21:30"></div>'+
    '<div class="btnrow"><button class="btn primary" id="rm-go">'+L("Aggiungere al calendario","Add to calendar")+'</button></div>'+
    L('<p class="note">Si scarica un file .ics: aprilo e conferma. Su iPhone tocca «Aggiungi tutto».</p>','<p class="note">An .ics file downloads: open it and confirm. On iPhone tap “Add All”.</p>'),
    function(sh){
      sh.querySelector("#rm-go").onclick=function(){
        var t=(sh.querySelector("#rm-time").value||"21:30").split(":");
        var d=new Date(); d.setHours(parseInt(t[0],10)||21, parseInt(t[1],10)||0, 0, 0);
        if(d<new Date()) d=new Date(d.getTime()+86400000);
        var pad=function(n){ return String(n).padStart(2,"0"); };
        var start=d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+"T"+pad(d.getHours())+pad(d.getMinutes())+"00";
        var url=appURL(), link=url? url+"?rassegna=1" : "";
        var title=L("Rassegna serale \u2014 Bestiario","Evening round \u2014 Bestiary");
        var desc=L("Due tocchi per ogni creatura che si è fatta viva oggi.","Two taps for each creature that showed up today.")+(link?"\\n"+link:"");
        var ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Bestiario dell'Abisso//IT","CALSCALE:GREGORIAN","BEGIN:VEVENT",
          "UID:"+uid()+"@bestiario","DTSTAMP:"+icsStamp(new Date()),"DTSTART:"+start,"DURATION:PT5M","RRULE:FREQ=DAILY",
          "SUMMARY:"+title,"DESCRIPTION:"+desc].concat(link?["URL:"+link]:[]).concat([
          "BEGIN:VALARM","ACTION:DISPLAY","TRIGGER:PT0M","DESCRIPTION:"+title,"END:VALARM","END:VEVENT","END:VCALENDAR"]).join("\r\n");
        if(downloadBlob(new Blob([ics],{type:"text/calendar"}), "bestiario-promemoria.ics")){
          closeSheet(); toast(L("File scaricato: aprilo per aggiungere il promemoria.","File downloaded: open it to add the reminder."));
        } else toast(L("Download non riuscito.","Download failed."));
      };
    });
}

/* ===================== promemoria di backup ===================== */
var BK_KEY="bestiario.backup.v1", BK_DAYS=7, BK_SNOOZE=3;
function bkState(){
  var o=null; try{ o=JSON.parse(localStorage.getItem(BK_KEY)||"null"); }catch(e){}
  if(!o||typeof o!=="object") o={};
  if(!o.since){ o.since=new Date().toISOString(); bkWrite(o); }
  return o;
}
function bkWrite(o){ try{ localStorage.setItem(BK_KEY, JSON.stringify(o)); }catch(e){} }
function markBackup(){ var o=bkState(); o.last=new Date().toISOString(); o.snooze=null; bkWrite(o); hideBackupBar(); }
function backupDue(){
  if(!S.creatures.length) return false;
  var o=bkState(), now=Date.now(), DAY=86400000;
  if(o.last && new Date(S.updated||0)<=new Date(o.last)) return false;
  if(o.snooze && now<new Date(o.snooze).getTime()) return false;
  return now-new Date(o.last||o.since).getTime() > BK_DAYS*DAY;
}
function hideBackupBar(){ var b=document.querySelector(".bkbar"); if(b) b.remove(); }
function showBackupBar(){
  hideBackupBar();
  if(view==="registro"||!backupDue()) return;
  var stage=el("stage"); if(!stage) return;
  var o=bkState();
  var bar=h('<div class="bkbar" role="status"><p>'+
    (o.last ? L("Ultima copia di sicurezza: ","Last safety copy: ")+esc(fmtDate(o.last))+"."
            : L("Non hai ancora una copia di sicurezza.","You don&rsquo;t have a safety copy yet."))+
    '</p><button id="bk-later">'+L("Più tardi","Later")+'</button><button class="go" id="bk-go">'+L("Salva copia","Save copy")+'</button></div>');
  stage.appendChild(bar);
  el("bk-later").onclick=function(){ o.snooze=new Date(Date.now()+BK_SNOOZE*86400000).toISOString(); bkWrite(o); hideBackupBar(); };
  el("bk-go").onclick=exportBackup;
}
/* chiede al browser di non cancellare i dati da solo quando lo spazio scarseggia */
var persistAsked=false;
function askPersist(){
  if(persistAsked||!S.creatures.length) return; persistAsked=true;
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persisted().then(function(p){ if(!p) navigator.storage.persist(); }).catch(function(){}); }catch(e){}
}
function showRaw(data){
  sheet('<h2>Backup</h2>',
    L('<p class="note">Il download non è disponibile qui. Copia questo testo e conservalo.</p>','<p class="note">Downloading isn’t available here. Copy this text and keep it somewhere.</p>')+
    '<textarea id="bk" rows="12" readonly style="font-size:12px">'+esc(data)+'</textarea>'+
    L('<div class="btnrow"><button class="btn primary" id="bk-copy">Copiare tutto</button></div>','<div class="btnrow"><button class="btn primary" id="bk-copy">Copy everything</button></div>'),
    function(sh){
      sh.querySelector("#bk-copy").onclick=function(){
        var ta=sh.querySelector("#bk"); ta.select();
        try{ document.execCommand("copy"); toast(L("Copiato.","Copied.")); }catch(e){ toast(L("Copia manualmente.","Copy it manually.")); }
      };
    });
}
function importBackup(){
  var inp=document.createElement("input");
  inp.type="file"; inp.accept="application/json,.json";
  inp.onchange=function(){
    var f=inp.files&&inp.files[0]; if(!f) return;
    var fr=new FileReader();
    fr.onload=function(){
      try{
        var d=JSON.parse(fr.result);
        if(!d||!Array.isArray(d.creatures)) throw new Error("formato");
        confirmSheet(L("Importare ","Import ")+d.creatures.length+L(" creature?"," creatures?"),L("I dati attuali di questo dispositivo verranno sostituiti.","The current data on this device will be replaced."),L("Importa","Import"),function(){
          S={v:1,creatures:d.creatures,parked:d.parked||[],checks:d.checks||[],updated:d.updated||null};
          clearSprites(); save(); closeSheet(); render(); toast(L("Bestiario importato.","Bestiary imported."));
        });
      }catch(e){ toast(L("File non valido.","Invalid file.")); }
    };
    fr.readAsText(f);
  };
  inp.click();
}

/* ===================== avvio ===================== */
/* altezza della tastiera su iOS: la finestra visibile si accorcia, il layout no */
function watchKeyboard(){
  var vv=window.visualViewport;
  if(!vv) return;
  function upd(){
    var kb=Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
    if(kb<80) kb=0;
    document.documentElement.style.setProperty("--kb", kb+"px");
    document.body.classList.toggle("kbopen", kb>0);
  }
  vv.addEventListener("resize", upd);
  vv.addEventListener("scroll", upd);
  upd();
}
document.addEventListener("focusin", function(e){
  var t=e.target;
  if(!t||!/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
  setTimeout(function(){
    try{ t.scrollIntoView({block:"center", behavior:"smooth"}); }catch(err){}
  }, 340);
});
function refit(){
  if(!pcv||view==="registro") return;
  var s=setupCanvas(pcv); pctx=s.ctx; bake=null; redraw();
}
window.addEventListener("resize", refit);
window.addEventListener("orientationchange", function(){ setTimeout(refit,250); });
if(window.visualViewport) window.visualViewport.addEventListener("resize", refit);
watchKeyboard();
document.addEventListener("keydown", function(e){ if(e.key==="Escape") closeSheet(); });

try{ document.title=TITLE; }catch(e){}
loadState();
askPersist();
render();
if(declutter()) save();
if(!introSeen()) setTimeout(showIntro, 350);
else if(/[?&]rassegna\b/.test(location.search) && living().length) setTimeout(openRassegna, 400);
if("serviceWorker" in navigator && /^https?:$/.test(location.protocol))
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){ bake=null; redraw(); });
})();
</script>
