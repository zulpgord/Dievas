<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#26190D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bestiario">
<meta name="description" content="Bestiario dell'Abisso - trittico personale per dare forma alle ansie e alle paure e seguirle nel tempo.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%95%AF%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Bestiario dell'Abisso</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Grenze+Gotisch:wght@400;600;800&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style id="app-style">
/* Trittico dipinto: un solo mondo visivo, tutti i colori dichiarati esplicitamente. */
:root{
  color-scheme: dark;
  --panel:#E4D3AA; --panel2:#D8C398; --panel3:#C9B183;
  --wood:#3B2917; --wood2:#26190D; --wood3:#54402A;
  --ink:#2C1F12; --ink2:#5A4630; --ink3:#8A755A;
  --rubric:#9E2B15; --ember:#C4551D; --gold:#C39B3A;
  --verd:#5E7A54; --lapis:#3D5D84; --bone:#EFE4C8;
  --hell:#140C07; --sky:#22282A;
  --ok:#5E7A54; --warn:#C39B3A; --bad:#9E2B15;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
}
*{box-sizing:border-box}
html{height:100%}
/* iOS: la pagina non scorre mai, scorre solo il contenuto interno */
body{margin:0;padding:0;position:fixed;inset:0;width:100%;height:100%;overflow:hidden;
  -webkit-tap-highlight-color:transparent}
#root{height:100%}
body{
  background:var(--wood2); color:var(--ink);
  font-family:"EB Garamond",Georgia,"Times New Roman",serif;
  font-size:17px; line-height:1.5; -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
  -webkit-text-size-adjust:100%;
}
button,.hinge,.realm,.hbtn{touch-action:manipulation}
.panelhead,.hinges,.hinge,.lbl,.tally span,.stats3 span{-webkit-user-select:none;user-select:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
h1,h2{font-family:"Grenze Gotisch",Georgia,serif;letter-spacing:.01em}
.frak{font-family:"UnifrakturMaguntia","Grenze Gotisch",serif;font-weight:400}
.lbl{font-size:11px;letter-spacing:.19em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.num{font-variant-numeric:tabular-nums}

#root{height:100%}
.app{
  position:relative;height:100%;max-width:540px;margin:0 auto;overflow:hidden;
  display:flex;flex-direction:column;
  background:var(--wood2);
  box-shadow:0 0 0 1px #000, 0 0 80px rgba(0,0,0,.8);
}

/* ---------- cornice del trittico ---------- */
.panelhead{
  position:relative;z-index:5;display:flex;align-items:flex-end;gap:12px;
  padding:calc(10px + var(--sat)) calc(15px + var(--sar)) 10px calc(15px + var(--sal));
  min-height:calc(58px + var(--sat));
  background:linear-gradient(to bottom,var(--wood) 0%,var(--wood2) 100%);
  border-bottom:1px solid #120B05;
  box-shadow:0 2px 10px rgba(0,0,0,.5);
}
.panelhead h1{font-size:22px;line-height:1;color:var(--panel);flex:1}
.panelhead h1 small{display:block;font-family:"EB Garamond",serif;font-size:11.5px;letter-spacing:.16em;
  text-transform:uppercase;color:#9A855F;margin-top:5px;font-weight:500}
.hbtn{
  min-width:46px;height:44px;padding:0 12px;border:1px solid #16100A;border-radius:2px;
  background:linear-gradient(to bottom,var(--wood3),var(--wood));color:var(--panel2);
  display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(224,205,165,.12);
  font-size:19px;line-height:1;
}
.hbtn:hover{color:var(--gold)}
.hbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}

.stage{position:relative;flex:1;min-height:0}
.stage canvas.panel{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ---------- cerniere / tab ---------- */
.hinges{
  position:relative;z-index:5;display:flex;gap:2px;
  padding:6px calc(6px + var(--sar)) calc(8px + var(--sab)) calc(6px + var(--sal));
  background:linear-gradient(to top,var(--wood2),var(--wood));
  border-top:1px solid #120B05;
}
.hinge{
  flex:1;padding:11px 4px 10px;min-height:52px;border:1px solid #16100A;border-radius:2px;
  background:linear-gradient(to bottom,#2E2013,#1D1409);color:#8B7551;
  font-family:"Grenze Gotisch",serif;font-size:15px;letter-spacing:.05em;text-align:center;
}
.hinge b{display:block;font-weight:400}
.hinge i{display:block;font-style:normal;font-family:"EB Garamond",serif;font-size:9.5px;
  letter-spacing:.16em;text-transform:uppercase;color:#6B5A3E;margin-top:2px}
.hinge[aria-selected="true"]{
  background:linear-gradient(to bottom,#6A4E2C,#43301A);color:var(--panel);
  box-shadow:inset 0 1px 0 rgba(240,225,190,.18);
}
.hinge[aria-selected="true"] i{color:#C4A778}
.hinge[aria-selected="true"].par{background:linear-gradient(to bottom,#5B5A3A,#3A3A25);color:#F1E7C6}
.hinge[aria-selected="true"].inf{background:linear-gradient(to bottom,#6E3A1D,#3F2010);color:#F3DCB8}

/* ---------- pergamena ---------- */
.vellum{background-color:var(--panel);background-repeat:repeat;color:var(--ink)}
.scroll{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheetpage{padding:20px calc(18px + var(--sar)) calc(44px + var(--sab)) calc(18px + var(--sal));
  display:flex;flex-direction:column;gap:26px}

.rubric{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.rubric h2{font-size:22px;color:var(--rubric);line-height:1}
.rubric::after{content:"";flex:1;height:1px;background:linear-gradient(to right,rgba(158,43,21,.5),rgba(44,31,18,0))}
.drop{float:left;font-family:"UnifrakturMaguntia",serif;font-size:52px;line-height:.86;color:var(--rubric);
  margin:2px 8px 0 0}
.prose{font-size:16.5px;line-height:1.62}
.prose em{color:var(--ink2)}
.note{font-size:14.5px;color:var(--ink2);font-style:italic;line-height:1.5;margin:0}

.tally{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:rgba(44,31,18,.22);border:1px solid rgba(44,31,18,.28)}
.tally div{background:var(--panel);padding:10px 8px;text-align:center}
.tally b{display:block;font-family:"Grenze Gotisch",serif;font-size:25px;line-height:1.05;font-weight:400;font-variant-numeric:tabular-nums}
.tally span{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);white-space:nowrap}

.omens{display:flex;flex-direction:column;gap:9px}
.omen{display:flex;gap:9px;align-items:flex-start;font-size:16px;line-height:1.45}
.omen::before{content:"\261E";color:var(--rubric);font-size:17px;line-height:1.3;flex:none}

.cal{overflow-x:auto;padding-bottom:6px}
.calgrid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);gap:2px;width:max-content}
.cal i{width:11px;height:11px;display:block;border:1px solid rgba(44,31,18,.14);border-radius:1px}
.callegend{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11px;color:var(--ink3)}
.callegend i{width:11px;height:11px;border:1px solid rgba(44,31,18,.14);display:block}

.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:15px}
.bar .track{grid-column:1/-1;height:9px;background:rgba(44,31,18,.12);border:1px solid rgba(44,31,18,.2);position:relative}
.bar .fill{position:absolute;left:0;top:0;bottom:0}
.bar .n{color:var(--ink2);font-variant-numeric:tabular-nums;font-size:14px}

.rites{display:flex;flex-direction:column;gap:12px}
.rite-row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline}
.rite-row .txt{font-size:16px}
.rite-row .sc{font-size:13px;color:var(--ink2);white-space:nowrap}
.rite-row .track{grid-column:1/-1;height:7px;background:rgba(44,31,18,.12);position:relative;border:1px solid rgba(44,31,18,.2)}
.rite-row .fill{position:absolute;left:0;top:0;bottom:0}

.cloud{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;line-height:1.25}
.cloud span{color:var(--ink);font-family:"Grenze Gotisch",serif;font-weight:400}
.cloud span small{font-size:10px;color:var(--ink3);font-family:"EB Garamond",serif;vertical-align:super}

.trend{width:100%;height:88px;display:block}
.trend .ln{fill:none;stroke:var(--rubric);stroke-width:1.6;stroke-linejoin:round}
.trend .ar{stroke:none}
.trend .gd{stroke:rgba(44,31,18,.2);stroke-width:1}
.trend text{font-size:9px;fill:var(--ink3);font-family:"EB Garamond",serif}

/* ---------- registro: elenco creature ---------- */
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools input[type=text]{flex:1;min-width:130px}
input[type=text],input[type=date],textarea,select{
  width:100%;background:rgba(255,250,235,.5);border:1px solid rgba(44,31,18,.32);border-radius:2px;
  padding:9px 10px;color:var(--ink);font-size:16px;
}
textarea{resize:vertical;min-height:74px;line-height:1.5}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--rubric);background:rgba(255,252,242,.75)}
select{appearance:none;padding-right:26px;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);
  background-position:calc(100% - 15px) 18px,calc(100% - 10px) 18px;background-size:5px 5px;background-repeat:no-repeat}

.roster{display:flex;flex-direction:column;gap:0;border:1px solid rgba(44,31,18,.28)}
.roster-row{display:flex;align-items:center;gap:11px;padding:9px 10px;border-bottom:1px solid rgba(44,31,18,.16);background:rgba(255,250,235,.22)}
.roster-row:last-child{border-bottom:none}
.roster-row canvas{width:46px;height:46px;flex:none}
.roster-row .who{flex:1;min-width:0}
.roster-row .who b{display:block;font-family:"Grenze Gotisch",serif;font-weight:400;font-size:18.5px;line-height:1.15}
.roster-row .who span{font-size:12.5px;color:var(--ink2);display:block;line-height:1.3}
.roster-row .pw{font-family:"Grenze Gotisch",serif;font-size:21px;width:26px;text-align:right;font-variant-numeric:tabular-nums}
.acts{display:flex;gap:3px}
.acts button{width:30px;height:30px;border:1px solid rgba(44,31,18,.28);border-radius:2px;
  display:grid;place-items:center;font-size:14px;color:var(--ink2);background:rgba(255,250,235,.4)}
.acts button:hover{color:var(--rubric);border-color:var(--rubric)}

.chron{display:flex;flex-direction:column}
.chron .mo{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--rubric);margin:14px 0 7px;font-weight:600}
.chron button{display:flex;gap:10px;align-items:baseline;text-align:left;padding:7px 0;border-bottom:1px dotted rgba(44,31,18,.25);width:100%}
.chron .d{font-size:12px;color:var(--ink3);width:44px;flex:none;font-variant-numeric:tabular-nums}
.chron .b{flex:1;min-width:0;font-size:15.5px}
.chron .b b{font-family:"Grenze Gotisch",serif;font-weight:400;font-size:16.5px}
.chron .b i{display:block;font-style:normal;color:var(--ink2);font-size:14px;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.chron .p{font-size:13px;color:var(--ink3);font-variant-numeric:tabular-nums}

/* ---------- fogli (sheet) ---------- */
.scrim{position:absolute;inset:0;z-index:8;background:rgba(10,6,3,.72);animation:fade .2s ease}
@keyframes fade{from{opacity:0}}
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:9;max-height:93%;
  display:flex;flex-direction:column;color:var(--ink);
  background-color:var(--panel);
  border-top:3px solid var(--wood3);border-radius:3px 3px 0 0;
  box-shadow:0 -22px 60px rgba(0,0,0,.65);
  animation:rise .28s cubic-bezier(.2,.8,.25,1);
}
@keyframes rise{from{transform:translateY(16px);opacity:0}}
.sheet-head{display:flex;align-items:flex-start;gap:12px;padding:15px 17px 12px;
  border-bottom:1px solid rgba(44,31,18,.28);background:rgba(200,175,130,.25)}
.sheet-head h2{font-size:25px;line-height:1.1;flex:1}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:16px calc(17px + var(--sar)) calc(28px + var(--sab)) calc(17px + var(--sal));
  display:flex;flex-direction:column;gap:17px}
.sheet-body>*{flex:0 0 auto}
.sheetpage>*{flex:0 0 auto}
.xbtn{width:34px;height:34px;border:1px solid rgba(44,31,18,.3);border-radius:2px;display:grid;place-items:center;color:var(--ink2)}
.xbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round}

.field{display:flex;flex-direction:column;gap:5px}
.field .hint{font-size:13px;color:var(--ink3);font-style:italic}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:11px 8px;border:1px solid rgba(44,31,18,.3);border-radius:2px;
  background:rgba(255,250,235,.3);color:var(--ink2);font-family:"Grenze Gotisch",serif;font-size:17px}
.seg button small{display:block;font-family:"EB Garamond",serif;font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink3);margin-top:2px}
.seg button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink2);background:rgba(255,252,242,.8);box-shadow:inset 0 0 0 1px rgba(44,31,18,.16)}
.seg button.k-dievas[aria-pressed="true"]{border-color:var(--verd);box-shadow:inset 0 0 22px rgba(94,122,84,.18)}
.seg button.k-demone[aria-pressed="true"]{border-color:var(--rubric);box-shadow:inset 0 0 22px rgba(158,43,21,.15)}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}

.slider{display:flex;align-items:center;gap:12px}
input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:24px;background:none}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:linear-gradient(90deg,var(--verd),var(--gold),var(--rubric));border:none}
input[type=range]::-moz-range-track{height:3px;background:linear-gradient(90deg,var(--verd),var(--gold),var(--rubric))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:19px;height:19px;margin-top:-8px;border-radius:50%;
  background:var(--panel);border:2px solid var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.4)}
input[type=range]::-moz-range-thumb{width:17px;height:17px;border-radius:50%;background:var(--panel);border:2px solid var(--ink)}
.slider .val{font-family:"Grenze Gotisch",serif;font-size:23px;width:32px;text-align:right;font-variant-numeric:tabular-nums}

.tenner{display:flex;gap:4px}
.tenner button{flex:1;padding:12px 0;border:1px solid rgba(44,31,18,.3);border-radius:2px;
  background:rgba(255,250,235,.35);font-family:"Grenze Gotisch",serif;font-size:17px;font-variant-numeric:tabular-nums}
.tenner button:hover{background:var(--gold);color:var(--wood2)}

.btn{padding:12px 15px;border:1px solid rgba(44,31,18,.4);border-radius:2px;background:rgba(255,250,235,.45);
  font-family:"Grenze Gotisch",serif;font-size:18px;text-align:center;color:var(--ink)}
.btn:hover{background:rgba(255,252,242,.85)}
.btn.primary{background:linear-gradient(to bottom,#8E3418,#6E2611);color:#F3E2BE;border-color:#4E1B0C}
.btn.primary:hover{background:linear-gradient(to bottom,#A03B1B,#7C2A13)}
.btn.gold{background:linear-gradient(to bottom,#C9A648,#9C7C2C);color:#241800;border-color:#6E5619}
.btn.ghost{background:none;color:var(--ink2)}
.btn.danger{background:none;color:var(--rubric);border-color:rgba(158,43,21,.5)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btnrow{display:flex;gap:9px}
.btnrow>*{flex:1}

.kindtag{display:inline-flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.17em;text-transform:uppercase;font-weight:600}
.kindtag i{width:7px;height:7px;border-radius:50%;background:currentColor;font-style:normal}
.k-verd{color:var(--verd)} .k-rub{color:var(--rubric)} .k-gold{color:#8A6A16}
.epithet{font-style:italic;color:var(--ink2);font-size:16px;margin:0}

.portrait{width:100%;max-width:230px;aspect-ratio:1;display:block;margin:0 auto}
.seg.ground button[aria-pressed="true"][data-g="1"]{border-color:var(--verd);color:#3F5A38;box-shadow:inset 0 0 22px rgba(94,122,84,.2)}
.seg.ground button[aria-pressed="true"][data-g="0"]{border-color:var(--gold);box-shadow:inset 0 0 22px rgba(195,155,58,.2)}
.seg.ground button[aria-pressed="true"][data-g="-1"]{border-color:var(--rubric);color:#8C2A15;box-shadow:inset 0 0 22px rgba(158,43,21,.16)}
.seg.ground button{font-size:15px;line-height:1.15}
.ledger{display:flex;gap:3px;flex-wrap:wrap;align-items:center}
.ledger i{width:13px;height:13px;display:block;border:1px solid rgba(44,31,18,.28);font-style:normal}
.ledger .lg{background:var(--verd)} .ledger .lh{background:var(--gold)} .ledger .ll{background:var(--rubric)}
.ledger em{font-style:normal;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);margin-left:6px}
.gbars{display:flex;gap:4px;align-items:stretch;height:104px}
.gcol{flex:1;display:flex;flex-direction:column;min-width:0}
.gcol .half{flex:1;display:flex}
.gcol .half.top{align-items:flex-end}
.gcol .half.bot{align-items:flex-start}
.gcol .half span{display:block;width:100%;border-radius:1px}
.gcol .up{background:linear-gradient(to top,#4E6A45,#7E9A72)}
.gcol .dn{background:linear-gradient(to bottom,#9E2B15,#C4551D)}
.gzero{height:1px;background:rgba(44,31,18,.4)}
.gline{margin-top:8px;font-size:14.5px;display:flex;gap:8px;align-items:baseline}
.gline .tag{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;padding:2px 6px;border:1px solid currentColor;flex:none;font-weight:600}
.gline.g1{color:var(--verd)} .gline.g0{color:#8A6A16} .gline.gm1{color:var(--rubric)}
.gline span:last-child{color:var(--ink)}
.warnbox{border-left:3px solid var(--rubric);padding:8px 0 8px 11px;font-size:14.5px;color:var(--ink2);font-style:italic}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(44,31,18,.24);border:1px solid rgba(44,31,18,.3)}
.stats3 div{background:rgba(255,250,235,.4);padding:10px;display:flex;flex-direction:column;gap:2px}
.stats3 b{font-family:"Grenze Gotisch",serif;font-size:21px;font-weight:400;line-height:1;font-variant-numeric:tabular-nums}
.stats3 span{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:15.5px}
.dl dt{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);padding-top:4px;font-weight:600}
.dl dd{margin:0;white-space:pre-wrap}

.entries{display:flex;flex-direction:column;border-left:1px solid rgba(44,31,18,.3);margin-left:5px}
.entry{position:relative;padding:0 0 18px 18px}
.entry:last-child{padding-bottom:2px}
.entry::before{content:"";position:absolute;left:-4.5px;top:7px;width:8px;height:8px;border-radius:50%;
  background:var(--panel);border:1px solid var(--ink2)}
.entry.hi::before{background:var(--rubric);border-color:var(--rubric)}
.entry.lo::before{background:var(--verd);border-color:var(--verd)}
.entry-head{display:flex;align-items:baseline;gap:10px;margin-bottom:3px}
.entry-head time{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.entry-head .pw{font-size:11.5px;color:var(--ink3);margin-left:auto;font-variant-numeric:tabular-nums}
.entry p{margin:0 0 6px;font-size:16px;white-space:pre-wrap}
.cbt{border-left:2px solid rgba(158,43,21,.35);padding-left:10px;margin:8px 0 0;display:flex;flex-direction:column;gap:6px}
.cbt div{font-size:15px}
.cbt b{display:block;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--rubric);font-weight:600}
.ritual{margin-top:8px;font-size:15px;display:flex;gap:8px;align-items:baseline}
.ritual .out{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;padding:2px 6px;border:1px solid currentColor;flex:none;font-weight:600}
.out.o1{color:var(--ok)} .out.o2{color:#8A6A16} .out.o3{color:var(--ink3)}

.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:88px;z-index:30;
  background:var(--wood);border:1px solid #16100A;padding:9px 15px;color:var(--panel);
  font-size:14.5px;box-shadow:0 8px 26px rgba(0,0,0,.6);animation:fade .2s;max-width:88%;text-align:center}
.menu{display:flex;flex-direction:column;border:1px solid rgba(44,31,18,.3)}
.menu button{padding:12px 13px;text-align:left;border-bottom:1px solid rgba(44,31,18,.18);background:rgba(255,250,235,.3);font-size:16.5px}
.menu button:last-child{border-bottom:none}
.menu button small{display:block;font-size:13px;color:var(--ink2);font-style:italic}

.rite{position:absolute;inset:0;z-index:20;background:rgba(8,5,3,.94);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;padding:28px;text-align:center}
.rite canvas{position:absolute;inset:0;width:100%;height:100%}
.rite p{position:relative;font-family:"UnifrakturMaguntia",serif;font-size:30px;line-height:1.25;margin:0;color:#F0DFB4}
.rite small{position:relative;color:#B8A272;font-style:italic;font-size:16px}

.empty{position:absolute;left:0;right:0;bottom:22%;text-align:center;padding:0 32px;pointer-events:none;
  display:flex;flex-direction:column;align-items:center}
.empty p{margin:0;font-style:italic;font-size:16.5px;line-height:1.6;color:#C6AF83;text-shadow:0 2px 8px rgba(0,0,0,.9)}
.empty .lbl{color:#9A855F;margin-bottom:8px}

/* ===================== utilità ===================== */
function el(id){ return document.getElementById(id); }
function h(html){ var d=document.createElement("div"); d.innerHTML=html; return d.firstElementChild; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function uid(){ return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function todayISO(){ var d=new Date(), o=d.getTimezoneOffset();
  return new Date(d.getTime()-o*60000).toISOString().slice(0,10); }
function dISO(d){ var o=d.getTimezoneOffset(); return new Date(d.getTime()-o*60000).toISOString().slice(0,10); }
function fmtDate(iso){ if(!iso) return "";
  var p=String(iso).slice(0,10).split("-");
  return p[2].replace(/^0/,"")+" "+MESI3[parseInt(p[1],10)-1]+" "+p[0]; }
function fmtLong(iso){ if(!iso) return "";
  var p=String(iso).slice(0,10).split("-");
  return p[2].replace(/^0/,"")+" "+MESI[parseInt(p[1],10)-1]+" "+p[0]; }
function daysBetween(a,b){ return Math.max(0, Math.round((new Date(b)-new Date(a))/86400000)); }
function seedOf(str){ var x=2166136261>>>0; for(var i=0;i<str.length;i++){ x^=str.charCodeAt(i); x=Math.imul(x,16777619)>>>0; } return x>>>0; }
function rng(seed){ var s=seed>>>0; return function(){ s|=0; s=s+0x6D2B79F5|0;
  var t=Math.imul(s^s>>>15,1|s); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function regionOf(k){ for(var i=0;i<REGIONS.length;i++) if(REGIONS[i].k===k) return REGIONS[i]; return REGIONS[0]; }
var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ===================== stato ===================== */
var S = {v:1, creatures:[], updated:null};
var view = "inferno";
var rosterQ = "", rosterSort = "potenza", rosterFilter = "vive";

function loadState(){
  var embedded=null, local=null;
  try{ var raw=el("app-state"); if(raw) embedded=JSON.parse(raw.textContent||"{}"); }catch(e){}
  try{ var ls=localStorage.getItem(KEY); if(ls) local=JSON.parse(ls); }catch(e){}
  var pick=null;
  if(embedded&&embedded.creatures&&embedded.creatures.length&&local&&local.creatures&&local.creatures.length){
    pick=(new Date(local.updated||0)>=new Date(embedded.updated||0))?local:embedded;
  } else if(local&&local.creatures&&local.creatures.length) pick=local;
  else if(embedded&&embedded.creatures&&embedded.creatures.length) pick=embedded;
  else pick=local||embedded;
  if(pick&&pick.creatures) S={v:1, creatures:pick.creatures, updated:pick.updated||null};
}
function save(){
  S.updated=new Date().toISOString();
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast("Salvataggio non riuscito: memoria del browser piena o bloccata."); }
}
function byId(id){ for(var i=0;i<S.creatures.length;i++) if(S.creatures[i].id===id) return S.creatures[i]; return null; }
function living(){ return S.creatures.filter(function(c){ return !c.freed; }); }
function freedOnes(){ return S.creatures.filter(function(c){ return !!c.freed; }); }
function lastIntensity(c){ return (c.entries&&c.entries.length)? c.entries[c.entries.length-1].intensity : c.intensity; }
function trendOf(c){
  var e=(c.entries||[]).map(function(x){ return x.intensity; });
  if(e.length<2) return 0;
  var n=Math.min(3,Math.floor(e.length/2))||1;
  var f=e.slice(0,n).reduce(function(a,b){return a+b;},0)/n;
  var l=e.slice(-n).reduce(function(a,b){return a+b;},0)/n;
  return l-f;
}
function gOf(e){ return (e&&(e.ground===-1||e.ground===0||e.ground===1))?e.ground:null; }
function groundEntries(c){ return (c.entries||[]).filter(function(e){ return gOf(e)!==null; }); }
function gripOf(c){
  var e=groundEntries(c).slice(-10);
  if(!e.length) return null;
  var avg=e.reduce(function(a,b){ return a+b.ground; },0)/e.length;
  return clamp(Math.round(5.5-4.5*avg),1,10);
}
function gripOrPower(c){ var g=gripOf(c); return g==null? lastIntensity(c) : g; }
function todayEntry(c){
  var t=todayISO(), es=c.entries||[];
  for(var i=es.length-1;i>=0;i--) if(String(es[i].date).slice(0,10)===t) return es[i];
  return null;
}
function groundTally(days){
  var r={won:0,lost:0,half:0};
  S.creatures.forEach(function(c){ (c.entries||[]).forEach(function(e){
    if(gOf(e)===null) return;
    if(daysBetween(e.date,todayISO())>days) return;
    if(e.ground>0) r.won++; else if(e.ground<0) r.lost++; else r.half++;
  }); });
  return r;
}
function weeklyGround(){
  var out=[], now=new Date();
  for(var wk=9;wk>=0;wk--){
    var end=new Date(now.getTime()-wk*7*86400000), start=new Date(end.getTime()-6*86400000);
    var won=0, lost=0;
    S.creatures.forEach(function(c){ (c.entries||[]).forEach(function(e){
      if(gOf(e)===null) return;
      var d=new Date(String(e.date).slice(0,10)+"T12:00:00");
      if(d>=start&&d<=end){ if(e.ground>0) won++; else if(e.ground<0) lost++; }
    }); });
    out.push({won:won,lost:lost,label:MESI3[end.getMonth()]+" "+end.getDate()});
  }
  return out;
}
function sameThought(c, thought, days){
  if(!thought||thought.trim().length<8) return 0;
  var k=thought.trim().toLowerCase().slice(0,30), n=0;
  (c.entries||[]).forEach(function(e){
    if(daysBetween(e.date,todayISO())>days) return;
    var t=e.cbt&&e.cbt.thought?e.cbt.thought.trim().toLowerCase().slice(0,30):"";
    if(t===k) n++;
  });
  return n;
}
function topRumination(){
  var best=null;
  S.creatures.forEach(function(c){
    var m={};
    (c.entries||[]).forEach(function(e){
      if(daysBetween(e.date,todayISO())>21) return;
      var t=e.cbt&&e.cbt.thought?e.cbt.thought.trim():"";
      if(t.length<8) return;
      var k=t.toLowerCase().slice(0,30);
      if(!m[k]) m[k]={t:t,n:0};
      m[k].n++;
    });
    Object.keys(m).forEach(function(k){ if(m[k].n>=4&&(!best||m[k].n>best.n)) best={t:m[k].t,n:m[k].n,c:c}; });
  });
  return best;
}
function allEntries(){
  var out=[];
  S.creatures.forEach(function(c){ (c.entries||[]).forEach(function(e){ out.push({e:e,c:c}); }); });
  out.sort(function(a,b){ return a.e.date<b.e.date?1:(a.e.date>b.e.date?-1:0); });
  return out;
}

/* ===================== texture ===================== */
var tiles={};
function parchmentTile(kind){
  if(tiles[kind]) return tiles[kind];
  var n=200, cv=document.createElement("canvas"); cv.width=n; cv.height=n;
  var c=cv.getContext("2d"), R=rng(kind==="wood"?881:552);
  var base = kind==="wood" ? "#3B2917" : "#E4D3AA";
  c.fillStyle=base; c.fillRect(0,0,n,n);
  var i;
  for(i=0;i<2600;i++){
    var v=R();
    c.fillStyle = kind==="wood"
      ? "rgba("+(v<.5?"20,12,6":"96,72,44")+","+(0.05+R()*0.12).toFixed(3)+")"
      : "rgba("+(v<.5?"120,96,58":"255,250,232")+","+(0.05+R()*0.16).toFixed(3)+")";
    c.fillRect(R()*n, R()*n, 1+ (R()<.15?1:0), 1);
  }
  for(i=0;i<12;i++){
    var y=R()*n;
    c.strokeStyle = kind==="wood" ? "rgba(20,12,6,.16)" : "rgba(140,112,68,.07)";
    c.lineWidth=0.6+R()*1.4;
    c.beginPath(); c.moveTo(0,y);
    for(var x=0;x<=n;x+=10) c.lineTo(x, y+Math.sin(x*0.05+i)*(kind==="wood"?2:5));
    c.stroke();
  }
  for(i=0;i<7;i++){
    var sx=R()*n, sy=R()*n, sr=12+R()*40;
    var g=c.createRadialGradient(sx,sy,0,sx,sy,sr);
    g.addColorStop(0, kind==="wood"?"rgba(18,10,4,.18)":"rgba(158,120,64,.10)");
    g.addColorStop(1,"rgba(0,0,0,0)");
    c.fillStyle=g; c.beginPath(); c.arc(sx,sy,sr,0,6.283); c.fill();
  }
  tiles[kind]=cv.toDataURL("image/png");
  return tiles[kind];
}
function applyTextures(){
  var url=parchmentTile("vellum");
  document.querySelectorAll(".vellum,.sheet,.tally div,.roster-row").forEach(function(n){
    n.style.backgroundImage="url("+url+")";
  });
  document.querySelectorAll(".panelhead,.hinges").forEach(function(n){
    n.style.backgroundImage="url("+parchmentTile("wood")+")";
    n.style.backgroundBlendMode="multiply";
  });
}

/* ===================== grotteschi ===================== */
var PAL = {
  dievas:{ wash:["#6E8A62","#4A6D8C","#8FA07E","#5E7A54"], accent:"#3D5D84" },
  demone:{ wash:["#A8431F","#C4551D","#8A5A22","#7A3418"], accent:"#9E2B15" }
};
function genome(cr){
  var R=rng(cr.seed);
  return {
    body:Math.floor(R()*6), head:Math.floor(R()*6), legs:Math.floor(R()*5),
    arms:Math.floor(R()*6), tail:Math.floor(R()*4), obj:Math.floor(R()*7),
    eyes:(function(){ var e=1; if(R()<0.34) e=2; if(R()<0.10) e=3; return e; })(), tilt:(R()-0.5)*0.24,
    wash:Math.floor(R()*4), flip:R()<0.5, jit:R()*1000
  };
}
/* traccia a mano libera: tremolio deterministico + curva morbida */
function jit(pts,R,amp){
  return pts.map(function(p){ return [p[0]+(R()-.5)*amp*2, p[1]+(R()-.5)*amp*2]; });
}
function smoothPath(c, pts, close){
  var n=pts.length;
  c.beginPath();
  if(n<3){ c.moveTo(pts[0][0],pts[0][1]); for(var k=1;k<n;k++) c.lineTo(pts[k][0],pts[k][1]); return; }
  function mid(a,b){ return [(a[0]+b[0])/2,(a[1]+b[1])/2]; }
  var start = close ? mid(pts[n-1],pts[0]) : pts[0];
  c.moveTo(start[0],start[1]);
  var last = close ? n : n-1;
  for(var i=0;i<last;i++){
    var cur=pts[i%n], nxt=pts[(i+1)%n], m=mid(cur,nxt);
    c.quadraticCurveTo(cur[0],cur[1],m[0],m[1]);
  }
  if(!close) c.lineTo(pts[n-1][0],pts[n-1][1]); else c.closePath();
}
function ellipsePts(cx,cy,rx,ry,n,phase){
  var pts=[];
  for(var i=0;i<=n;i++){ var a=phase+i/n*6.283; pts.push([cx+Math.cos(a)*rx, cy+Math.sin(a)*ry]); }
  return pts;
}
function paint(c, pts, R, fill, ink, amp, lw, bone){
  /* preparazione chiara, velatura fuori registro, poi tratto */
  var jp=jit(pts,R,amp);
  smoothPath(c,jp,true); c.fillStyle=bone||"#EBE1C4"; c.fill();
  c.save();
  c.translate((R()-.5)*amp*0.9,(R()-.5)*amp*0.9);
  smoothPath(c,jp,true); c.globalAlpha=.82; c.fillStyle=fill; c.fill();
  c.restore();
  smoothPath(c,jp,true); c.strokeStyle=ink; c.lineWidth=lw; c.stroke();
}
function hatch(c, x, y, w2, hgt, R, ink, n, lw){
  c.save(); c.strokeStyle=ink; c.lineWidth=lw||0.7; c.globalAlpha=.34;
  for(var i=0;i<n;i++){
    var t=i/(n-1||1), yy=y+t*hgt, bow=Math.sin(t*3.14)*w2*0.25;
    c.beginPath();
    c.moveTo(x, yy);
    c.quadraticCurveTo(x+w2*0.5, yy+bow*0.4, x+w2*(0.6+0.4*Math.sin(t*3.14)), yy+bow*0.2);
    c.stroke();
  }
  c.restore();
}

/* disegna il grottesco entro un riquadro centrato in (0,0), unita = u */
function drawGrotesque(c, u, cr, variant){
  var g=genome(cr), R=rng(cr.seed^0x9e37);
  var pal=PAL[cr.kind==="dievas"?"dievas":"demone"];
  var wash=pal.wash[g.wash], wash2=pal.wash[(g.wash+2)%4], wash3=pal.wash[(g.wash+1)%4];
  var ink="#241809", bone="#EDE1C2";
  if(variant==="pale"){ wash="#CFC6A6"; wash2="#DCD3B4"; wash3="#D3CAAA"; ink="#5C4E36"; bone="#F5EEDA"; }
  var amp=u*0.05, lw=Math.max(0.8,u*0.021);
  var legs=g.legs%4, armk=g.arms%6, obj=g.obj%7;

  /* ombra a terra */
  c.save();
  c.globalAlpha = variant==="pale" ? 0.10 : 0.20;
  c.beginPath(); c.ellipse(0, u*1.12, u*0.46, u*0.09, 0, 0, 6.283);
  c.fillStyle="#0A0603"; c.fill();
  c.restore();

  c.save();
  c.rotate(g.tilt);
  if(g.flip) c.scale(-1,1);

  /* ---------- ali, dietro ---------- */
  if(armk===0){
    [-1,1].forEach(function(sg){
      var pts=[[0,-u*0.15],[sg*u*0.72,-u*0.62],[sg*u*1.02,-u*0.22],[sg*u*0.86,u*0.14],[sg*u*0.52,u*0.02],[0,u*0.14]];
      paint(c,pts,R, variant==="pale"?"#CFC6A6":"#5B4128", ink, amp*0.8, lw*0.85, bone);
      for(var f=1;f<4;f++){
        c.beginPath(); c.moveTo(0,-u*0.08);
        c.quadraticCurveTo(sg*u*0.5,-u*(0.42-f*0.12), sg*u*(0.5+f*0.17), -u*(0.5-f*0.22));
        c.strokeStyle=ink; c.lineWidth=lw*0.6; c.globalAlpha=.7; c.stroke(); c.globalAlpha=1;
      }
    });
  } else if(armk===1){
    [-1,1].forEach(function(sg){
      for(var f=0;f<5;f++){
        var L=u*(0.52+f*0.12);
        c.save(); c.rotate(sg*(0.42+f*0.15));
        var pts=[[0,-u*0.12],[sg*L*0.55,-u*0.3],[sg*L,-u*0.06],[sg*L*0.5,u*0.04]];
        paint(c,pts,R, f%2? wash3 : bone, ink, amp*0.5, lw*0.55, bone);
        c.restore();
      }
    });
  }

  /* ---------- coda, dietro ---------- */
  if(g.tail===0){
    var t1=[[u*0.1,u*0.4],[u*0.72,u*0.6],[u*0.56,u*0.8],[u*0.9,u*0.95],[u*0.22,u*0.66]];
    paint(c,t1,R, wash3, ink, amp*0.7, lw*0.75, bone);
  } else if(g.tail===1){
    c.beginPath(); c.moveTo(u*0.2,u*0.42);
    c.bezierCurveTo(u*0.95,u*0.6, u*1.0,u*0.0, u*0.55,u*0.16);
    c.strokeStyle=ink; c.lineWidth=lw*1.1; c.stroke();
    c.beginPath(); c.arc(u*0.62,u*0.2,u*0.05,0,6.283);
    c.fillStyle=wash3; c.fill(); c.strokeStyle=ink; c.lineWidth=lw*0.6; c.stroke();
  } else if(g.tail===2){
    var t2=[[u*0.14,u*0.42],[u*0.58,u*0.55],[u*0.86,u*0.28],[u*0.5,u*0.3]];
    paint(c,t2,R, variant==="pale"?"#CFC6A6":"#5E7A54", ink, amp*0.6, lw*0.7, bone);
  }

  /* ---------- corpo ---------- */
  var bodyPts;

    [-1,1].forEach(function(sg){
      c.beginPath(); c.moveTo(hx+sg*u*0.16,hy-u*0.3);

  } else if(g.head===3){

    c.beginPath(); c.moveTo(hx-u*0.1,hy+u*0.1); c.quadraticCurveTo(hx+u*0.16,hy+u*0.18,hx+u*0.38,hy+u*0.02);

  /* ---------- oggetto ---------- */
  if(obj===0){
    c.save(); c.rotate(-0.55);
    c.beginPath(); c.moveTo(-u*0.7,-u*0.06); c.lineTo(u*0.72,u*0.14);
    c.strokeStyle=ink; c.lineWidth=lw*0.85; c.stroke();
    c.beginPath(); c.moveTo(u*0.72,u*0.14); c.lineTo(u*0.56,u*0.03); c.lineTo(u*0.58,u*0.24); c.closePath();

    [0,1,2].forEach(function(f){
      c.beginPath(); c.moveTo(-u*(0.7-f*0.08),-u*0.06);

  } else if(obj===1){
    c.beginPath(); c.moveTo(u*0.26,u*0.06); c.lineTo(u*0.5,u*0.56);

  } else if(obj===3){
    c.save(); c.translate(u*0.06,-u*0.06); c.rotate(1.0);

    c.restore();
  } else if(obj===4){
    c.save(); c.translate(-u*0.5,u*0.3);
    paint(c,[[-u*0.15,u*0.14],[-u*0.09,-u*0.12],[u*0.09,-u*0.12],[u*0.15,u*0.14]],R,
      variant==="pale"?"#D8CFB0":"#B08A32", ink, amp*0.4, lw*0.65, bone);
    c.beginPath(); c.arc(0,u*0.18,u*0.032,0,6.283); c.fillStyle=ink; c.fill();
    c.beginPath(); c.moveTo(0,-u*0.12); c.lineTo(u*0.16,-u*0.34);
    c.strokeStyle=ink; c.lineWidth=lw*0.55; c.stroke();
    c.restore();
  } else if(obj===5){
    c.save(); c.translate(hx, hy-u*0.3);
    paint(c,[[0,-u*0.4],[u*0.13,-u*0.1],[u*0.05,u*0.05],[-u*0.11,-u*0.05],[-u*0.05,-u*0.22]],R,
      variant==="pale"?"#E3DABA":"#D6721E", "#8A3A10", amp*0.45, lw*0.6, bone);

  /* ---------- piccolo parassita ---------- */
  if(g.jit>640){

    paint(c, ellipsePts(u*0.02,-u*0.13,u*0.055,u*0.055,8,0), R, wash2, ink, amp*0.25, lw*0.55, bone);

/* cache degli sprite */
var sprites={};
function spriteFor(cr, px, variant){
  var key=cr.id+"|"+Math.round(px)+"|"+(variant||"n")+"|"+lastIntensity(cr);
  if(sprites[key]) return sprites[key];
  var dpr=Math.min(window.devicePixelRatio||1,2);
  var cv=document.createElement("canvas");
  cv.width=Math.round(px*dpr); cv.height=Math.round(px*dpr);
  var c=cv.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0);
  c.translate(px/2, px*0.44);
  drawGrotesque(c, px*0.33, cr, variant);
  sprites[key]=cv;
  return cv;
}
function clearSprites(){ sprites={}; }

/* ===================== pannello: Inferno ===================== */
var pcv=null, pctx=null, bake=null, raf=null, t0=Date.now(), hits=[];

function setupCanvas(cv){
  var dpr=Math.min(window.devicePixelRatio||1,2);
  var w=cv.clientWidth, hh=cv.clientHeight;
  cv.width=Math.max(1,Math.round(w*dpr)); cv.height=Math.max(1,Math.round(hh*dpr));
  var ctx=cv.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx:ctx,w:w,h:hh};
}
function spacedText(c, text, cx, cy, size, spacing, color, canvasW, weight){
  var maxW=canvasW-16;
  c.save();
  function measure(sz,sp){
    c.font=(weight||"600")+" "+sz+'px "EB Garamond", Georgia, serif';
    var t=0; for(var i=0;i<text.length;i++) t+=c.measureText(text.charAt(i)).width;
    return t+sp*(text.length-1);
  }
  var total=measure(size,spacing);
  if(total>maxW){
    var raw=measure(size,0);
    if(raw<=maxW){ spacing=(maxW-raw)/Math.max(1,text.length-1); total=maxW; }
    else { size=Math.max(7,size*maxW/raw); spacing=0; total=measure(size,0); }
  }
  c.font=(weight||"600")+" "+size+'px "EB Garamond", Georgia, serif';
  var x=clamp(cx,total/2+8,Math.max(total/2+8,canvasW-total/2-8))-total/2;
  c.textAlign="left"; c.fillStyle=color;
  for(var j=0;j<text.length;j++){ var ch=text.charAt(j); c.fillText(ch,x,cy); x+=c.measureText(ch).width+spacing; }
  c.restore();
}

function bakeInferno(w,hh){
  var dpr=Math.min(window.devicePixelRatio||1,2);
  var off=document.createElement("canvas");
  off.width=Math.round(w*dpr); off.height=Math.round(hh*dpr);
  var c=off.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0);
  var R=rng(4471);

  /* cielo notturno con incendio all'orizzonte */
  var sky=c.createLinearGradient(0,0,0,hh);
  sky.addColorStop(0,"#170D07"); sky.addColorStop(.18,"#2A1409");
  sky.addColorStop(.30,"#4A1E0A"); sky.addColorStop(.40,"#1E1108"); sky.addColorStop(1,"#0C0704");
  c.fillStyle=sky; c.fillRect(0,0,w,hh);

  var fire=c.createRadialGradient(w*.62,hh*.30,0,w*.62,hh*.30,w*.75);
  fire.addColorStop(0,"rgba(214,110,26,.42)"); fire.addColorStop(.4,"rgba(160,60,14,.18)");
  fire.addColorStop(1,"rgba(0,0,0,0)");
  c.fillStyle=fire; c.beginPath(); c.arc(w*.62,hh*.30,w*.75,0,6.283); c.fill();

  /* città in fiamme: sagome nere sull'orizzonte */
  var horizon=hh*0.315;
  c.fillStyle="#0B0603";
  for(var b=0;b<26;b++){
    var bw=6+R()*26, bh=10+R()*46, bx=R()*w;
    c.fillRect(bx, horizon-bh, bw, bh+6);
    if(R()<0.3){ /* torre */
      c.beginPath(); c.moveTo(bx+bw/2,horizon-bh-16); c.lineTo(bx,horizon-bh); c.lineTo(bx+bw,horizon-bh); c.closePath(); c.fill();
    }
  }
  /* fumi */
  for(var s=0;s<7;s++){
    var sx=R()*w, sr=20+R()*60;
    var sg=c.createRadialGradient(sx,horizon-40-R()*70,0,sx,horizon-40,sr);
    sg.addColorStop(0,"rgba(60,40,26,.5)"); sg.addColorStop(1,"rgba(0,0,0,0)");
    c.fillStyle=sg; c.beginPath(); c.arc(sx,horizon-50,sr,0,6.283); c.fill();
  }

  /* terra */
  var gr=c.createLinearGradient(0,horizon,0,hh);
  gr.addColorStop(0,"#2A1B0F"); gr.addColorStop(.5,"#1C1208"); gr.addColorStop(1,"#0E0805");
  c.fillStyle=gr; c.fillRect(0,horizon,w,hh-horizon);
  for(var t=0;t<180;t++){
    c.strokeStyle="rgba(206,170,110,"+(0.02+R()*0.05).toFixed(3)+")";
    var tx=R()*w, ty=horizon+R()*(hh-horizon);
    c.beginPath(); c.moveTo(tx,ty); c.lineTo(tx+4+R()*10,ty+1); c.stroke();
  }

  /* lago ghiacciato in basso */
  var lakeTop=hh*0.755;
  c.beginPath(); c.moveTo(0,lakeTop);
  for(var x=0;x<=w;x+=12) c.lineTo(x, lakeTop+Math.sin(x*0.012+1.1)*8+Math.sin(x*0.03)*3);
  c.lineTo(w,hh); c.lineTo(0,hh); c.closePath();
  var lg=c.createLinearGradient(0,lakeTop,0,hh);
  lg.addColorStop(0,"#25302F"); lg.addColorStop(1,"#0B1113");
  c.fillStyle=lg; c.fill();
  c.strokeStyle="rgba(180,196,190,.22)"; c.lineWidth=1; c.stroke();
  for(var cr2=0;cr2<9;cr2++){
    c.beginPath();
    var px=R()*w, py=lakeTop+20+R()*(hh-lakeTop-30);
    c.moveTo(px,py);
    for(var seg=0;seg<4;seg++){ px+=(R()-.5)*70; py+=(R()-.5)*22; c.lineTo(px,py); }
    c.strokeStyle="rgba(190,205,200,.13)"; c.stroke();
  }

  /* elementi delle regioni, a pennello */
  REGIONS.forEach(function(rg){
    var cx=rg.x*w, cy=rg.y*hh, rr=rg.r*Math.min(w,hh)*1.2;
    var Q=rng(seedOf(rg.k));
    c.save();
    c.lineWidth=1.1;
    var ochre="rgba(212,172,110,.5)", dark="rgba(10,6,3,.9)";
    if(rg.t==="peaks"){
      for(var p=0;p<5;p++){
        var px2=cx-rr*.8+p*(rr*1.6/4), ph=30+Q()*34;
        c.beginPath(); c.moveTo(px2-20,cy+rr*.3); c.lineTo(px2,cy+rr*.3-ph); c.lineTo(px2+20,cy+rr*.3);
        c.closePath(); c.fillStyle="rgba(46,32,18,.85)"; c.fill(); c.strokeStyle=ochre; c.stroke();
      }
      c.beginPath(); c.arc(cx+rr*.2, cy-rr*.35, 10, 0, 6.283);
      c.fillStyle="rgba(226,150,40,.5)"; c.fill();
    } else if(rg.t==="forest"){
      for(var f=0;f<12;f++){
        var fx=cx+(Q()-.5)*rr*1.7, fy=cy+(Q()-.5)*rr*1.1, fh=18+Q()*26;
        c.beginPath(); c.moveTo(fx,fy); c.lineTo(fx,fy-fh);
        c.strokeStyle=ochre; c.lineWidth=1.3; c.stroke();
        for(var br=0;br<3;br++){
          var t4=0.4+br*0.22;
          c.beginPath(); c.moveTo(fx,fy-fh*t4);
          c.lineTo(fx+(Q()<.5?-1:1)*(6+Q()*10), fy-fh*t4-6);
          c.lineWidth=0.8; c.stroke();
        }
      }
    } else if(rg.t==="swamp"){
      for(var s3=0;s3<5;s3++){
        var sx2=cx+(Q()-.5)*rr*1.4, sy2=cy+(Q()-.5)*rr*0.9;
        c.beginPath(); c.ellipse(sx2,sy2,14+Q()*26,5+Q()*8,Q()*.6,0,6.283);
        c.fillStyle="rgba(40,48,30,.55)"; c.fill();
        c.strokeStyle="rgba(150,170,120,.28)"; c.stroke();
      }
      for(var rd=0;rd<14;rd++){
        var rx=cx+(Q()-.5)*rr*1.6, ry=cy+(Q()-.5)*rr;
        c.beginPath(); c.moveTo(rx,ry); c.quadraticCurveTo(rx+3,ry-10,rx+7,ry-17);
        c.strokeStyle=ochre; c.lineWidth=0.9; c.stroke();
      }
      /* uovo rotto */
      c.beginPath(); c.ellipse(cx-rr*.1,cy+rr*.15,13,9,0.2,0,6.283);
      c.fillStyle="rgba(226,214,178,.35)"; c.fill(); c.strokeStyle=ochre; c.stroke();
    } else if(rg.t==="ruins"){
      for(var a2=0;a2<4;a2++){
        var ax=cx-rr*.7+a2*(rr*1.4/3), ah=24+Q()*30;
        c.beginPath();
        c.moveTo(ax,cy+rr*.25); c.lineTo(ax,cy+rr*.25-ah);
        c.quadraticCurveTo(ax+11,cy+rr*.25-ah-12, ax+22,cy+rr*.25-ah);
        c.lineTo(ax+22,cy+rr*.25);
        c.strokeStyle=ochre; c.lineWidth=1.2; c.stroke();
      }
      c.beginPath(); c.arc(cx+rr*.45,cy-rr*.1,5,0,6.283); c.fillStyle="rgba(226,214,178,.3)"; c.fill();
    } else if(rg.t==="dunes"){
      for(var d=0;d<6;d++){
        var dy=cy-rr*.4+d*(rr/4);
        c.beginPath();
        for(var dx=-rr;dx<=rr;dx+=10){
          var yy=dy+Math.sin((dx+d*36)*0.021)*(6+Q()*4);
          if(dx===-rr) c.moveTo(cx+dx,yy); else c.lineTo(cx+dx,yy);
        }
        c.strokeStyle="rgba(202,164,102,.28)"; c.lineWidth=0.9; c.stroke();
      }
      /* ossa */
      c.beginPath(); c.moveTo(cx-14,cy+rr*.4); c.lineTo(cx+14,cy+rr*.36);
      c.strokeStyle="rgba(230,220,190,.4)"; c.lineWidth=2; c.stroke();
    } else if(rg.t==="lake"){
      c.beginPath(); c.ellipse(cx,cy,rr*.62,rr*.3,0,0,6.283);
      c.fillStyle="rgba(6,10,12,.75)"; c.fill();
      c.strokeStyle="rgba(190,205,200,.25)"; c.stroke();
    }
    c.restore();
    spacedText(c, rg.name.toUpperCase(), cx, cy-rr*1.02, 10, 2.6, "rgba(214,178,116,.58)", w);
  });

  /* vignettatura da tavola dipinta */
  var vg=c.createRadialGradient(w*.5,hh*.44,Math.min(w,hh)*.3,w*.5,hh*.5,Math.max(w,hh)*.8);
  vg.addColorStop(0,"rgba(0,0,0,0)"); vg.addColorStop(1,"rgba(0,0,0,.75)");
  c.fillStyle=vg; c.fillRect(0,0,w,hh);
  return off;
}

function drawInferno(){
  if(!pcv) return;
  var w=pcv.clientWidth, hh=pcv.clientHeight, c=pctx, phase=(Date.now()-t0)/1000;
  if(!bake || bake.__w!==w || bake.__h!==hh || bake.__k!=="inf"){
    bake=bakeInferno(w,hh); bake.__w=w; bake.__h=hh; bake.__k="inf";
  }
  c.clearRect(0,0,w,hh);
  c.drawImage(bake,0,0,w,hh);

  hits=[];
  var scale=Math.min(w,hh)/380;
  living().forEach(function(cr,i){
    var x=cr.x*w, y=cr.y*hh;
    var inten=lastIntensity(cr);
    var grip=gripOf(cr);
    var shown=(grip==null? inten : grip);
    var px=(54+shown*5.4)*scale;
    var bob=reduceMotion?0:Math.sin(phase*0.9+i*1.3)*3;
    var sp=spriteFor(cr,px,null);
    c.drawImage(sp, x-px/2, y-px/2+bob, px, px);
    c.save();
    c.textAlign="center";
    c.font='400 15px "Grenze Gotisch", Georgia, serif';
    var tw=c.measureText(cr.name).width;
    var lx=clamp(x,tw/2+8,Math.max(tw/2+8,w-tw/2-8));
    var below=(y+px*0.46+30)<(hh-6);
    var ly=below? y+px*0.44+16+bob : y-px*0.46-14+bob;
    var plateW=Math.max(tw, 74)+18, plateH=32;
    var plateY=(below? ly-15 : ly-15);
    c.fillStyle="rgba(10,6,3,.48)";
    c.beginPath();
    if(c.roundRect) c.roundRect(lx-plateW/2, plateY, plateW, plateH, 3);
    else c.rect(lx-plateW/2, plateY, plateW, plateH);
    c.fill();
    c.fillStyle="rgba(242,228,192,.97)";
    c.fillText(cr.name,lx,ly);
    c.font='600 10.5px "EB Garamond", serif';
    c.fillStyle= grip==null
      ? "rgba(196,178,140,.9)"
      : (grip>=7 ? "rgba(226,120,70,1)" : (grip<=3 ? "rgba(150,196,140,.95)" : "rgba(214,178,116,.95)"));
    c.fillText((grip==null? "potenza "+inten : "presa "+grip), lx, ly+13);
    c.restore();
    hits.push({id:cr.id,x:x,y:y+bob,r:Math.max(px*0.45,26)});
  });
}

/* ===================== pannello: Paradiso ===================== */
function drawParadiso(){
  if(!pcv) return;
  var w=pcv.clientWidth, hh=pcv.clientHeight, c=pctx, phase=(Date.now()-t0)/1000;
  c.clearRect(0,0,w,hh);
  var g=c.createLinearGradient(0,0,0,hh);
  g.addColorStop(0,"#1C2422"); g.addColorStop(.55,"#151C1C"); g.addColorStop(1,"#090C0D");
  c.fillStyle=g; c.fillRect(0,0,w,hh);

  /* il tunnel di luce */
  var tx=w*0.5, ty=hh*0.19;
  for(var r=13;r>=1;r--){
    var rad=r*Math.min(w,hh)*0.062;
    var a=0.055+ (13-r)*0.02;
    c.beginPath(); c.ellipse(tx,ty+r*3.5,rad*1.02,rad*0.86,0,0,6.283);
    c.strokeStyle="rgba(246,238,214,"+a.toFixed(3)+")"; c.lineWidth=1.6; c.stroke();
  }
  var core=c.createRadialGradient(tx,ty,0,tx,ty,Math.min(w,hh)*0.2);
  core.addColorStop(0,"rgba(255,251,236,.96)"); core.addColorStop(.35,"rgba(248,236,200,.5)");
  core.addColorStop(1,"rgba(240,226,186,0)");
  c.fillStyle=core; c.beginPath(); c.arc(tx,ty,Math.min(w,hh)*0.2,0,6.283); c.fill();
  /* raggi */
  c.save(); c.translate(tx,ty); c.rotate(reduceMotion?0:phase*0.02);
  for(var ry=0;ry<16;ry++){
    c.rotate(6.283/16);
    var gg=c.createLinearGradient(0,0,0,-Math.min(w,hh)*0.55);
    gg.addColorStop(0,"rgba(255,248,224,.10)"); gg.addColorStop(1,"rgba(255,248,224,0)");
    c.fillStyle=gg;
    c.beginPath(); c.moveTo(0,0); c.lineTo(-9,-Math.min(w,hh)*0.55); c.lineTo(9,-Math.min(w,hh)*0.55); c.closePath(); c.fill();
  }
  c.restore();

  /* pulviscolo */
  var R=rng(3313);
  for(var d=0;d<90;d++){
    var dx2=R()*w, dy2=R()*hh;
    var tw2=reduceMotion?1:(0.5+0.5*Math.sin(phase*0.7+d));
    c.beginPath(); c.arc(dx2,dy2,0.6+R()*1.1,0,6.283);
    c.fillStyle="rgba(246,238,214,"+(0.06+R()*0.22*tw2).toFixed(3)+")"; c.fill();
  }

  hits=[];
  var list=freedOnes();
  var scale=Math.min(w,hh)/380;
  var n=list.length;
  list.forEach(function(cr,i){
    /* salita in spirale verso la luce */
    var t=n===1?0.55:(i/(n-1));
    var yy=hh*(0.86 - t*0.52);
    var amp=(1-t)*w*0.30;
    var xx=w*0.5 + Math.sin(i*1.9+1.2)*amp;
    var bob=reduceMotion?0:Math.sin(phase*0.6+i)*4;
    var px=(72+lastIntensity(cr)*1.8)*scale*(0.8+t*0.3);
    var sp=spriteFor(cr,px,"pale");
    c.save(); c.globalAlpha=0.55+t*0.42;
    c.drawImage(sp, xx-px/2, yy-px/2+bob, px, px);
    c.restore();
    c.save(); c.textAlign="center";
    c.shadowColor="rgba(0,0,0,.85)"; c.shadowBlur=9;
    c.font='400 15px "Grenze Gotisch", Georgia, serif';
    c.fillStyle="rgba(246,238,214,.92)";
    var nm=cr.freed.newName||cr.name;
    var nw=c.measureText(nm).width;
    var nx=clamp(xx,nw/2+8,Math.max(nw/2+8,w-nw/2-8));
    c.fillText(nm,nx,yy+px*0.46+15+bob);
    c.font='600 10px "EB Garamond", serif'; c.fillStyle="rgba(200,186,150,.85)";
    c.fillText(fmtDate(cr.freed.date).toUpperCase(), nx, yy+px*0.46+28+bob);
    c.restore();
    hits.push({id:cr.id,x:xx,y:yy+bob,r:Math.max(px*0.5,28)});
  });
}

function loop(){
  if(view==="inferno") drawInferno();
  else if(view==="paradiso") drawParadiso();
  if(!reduceMotion && view!=="registro") raf=requestAnimationFrame(loop);
}
function redraw(){ if(view==="inferno") drawInferno(); else if(view==="paradiso") drawParadiso(); }

/* ===================== interazione mappa ===================== */
var drag=null;
var panelRO=null;
function attachPanel(cv){
  pcv=cv;
  var s=setupCanvas(cv); pctx=s.ctx; bake=null;
  if(window.ResizeObserver){
    if(panelRO) panelRO.disconnect();
    panelRO=new ResizeObserver(function(){ refit(); });
    panelRO.observe(cv);
  }
  cv.addEventListener("pointerdown", function(e){
    var rect=cv.getBoundingClientRect(), px=e.clientX-rect.left, py=e.clientY-rect.top;
    for(var i=hits.length-1;i>=0;i--){
      var g=hits[i];
      if(Math.hypot(px-g.x,py-g.y)<=g.r){
        drag={id:g.id,x0:px,y0:py,moved:false};
        try{ cv.setPointerCapture(e.pointerId); }catch(err){}
        return;
      }
    }
  });
  cv.addEventListener("pointermove", function(e){
    if(!drag||view!=="inferno") return;
    var rect=cv.getBoundingClientRect(), px=e.clientX-rect.left, py=e.clientY-rect.top;
    if(Math.hypot(px-drag.x0,py-drag.y0)>7) drag.moved=true;
    if(drag.moved){
      var cr=byId(drag.id);
      if(cr){ cr.x=clamp(px/rect.width,.07,.93); cr.y=clamp(py/rect.height,.08,.92); redraw(); }
    }
  });
  cv.addEventListener("pointerup", function(e){
    if(!drag) return;
    var d=drag; drag=null;
    try{ cv.releasePointerCapture(e.pointerId); }catch(err){}
    if(d.moved) save(); else openCreature(d.id);
  });
  cv.addEventListener("pointercancel", function(){ drag=null; });
}

/* ===================== struttura ===================== */
function render(){
  var root=el("root");
  var titles={
    inferno:{t:"L'Inferno", s:living().length? living().length+" creature vive" : "nessuna creatura"},
    registro:{t:"Il Registro", s:"mano del custode"},
    paradiso:{t:"Il Paradiso", s:freedOnes().length? freedOnes().length+" liberate" : "nessuna liberata"}
  };
  var ti=titles[view];
  root.innerHTML=
    '<div class="app">'+
      '<div class="panelhead">'+
        '<h1 class="frak">'+ti.t+'<small>'+ti.s+'</small></h1>'+
        (view==="inferno"
          ? '<button class="hbtn" id="btn-evoca" aria-label="Evoca una creatura">+</button>' : "")+
      '</div>'+
      '<div class="stage" id="stage"></div>'+
      '<div class="hinges">'+
        '<button class="hinge par" id="h-par" aria-selected="'+(view==="paradiso")+'"><b>Paradiso</b><i>anta sinistra</i></button>'+
        '<button class="hinge" id="h-reg" aria-selected="'+(view==="registro")+'"><b>Registro</b><i>anta centrale</i></button>'+
        '<button class="hinge inf" id="h-inf" aria-selected="'+(view==="inferno")+'"><b>Inferno</b><i>anta destra</i></button>'+
      '</div>'+
    '</div>';
  el("h-par").onclick=function(){ go("paradiso"); };
  el("h-reg").onclick=function(){ go("registro"); };
  el("h-inf").onclick=function(){ go("inferno"); };
  if(el("btn-evoca")) el("btn-evoca").onclick=function(){ openForm(null); };

  var stage=el("stage");
  if(view==="registro"){
    stage.innerHTML='<div class="scroll vellum" id="reg"></div>';
    renderRegistro();
  } else {
    var count = view==="inferno" ? living().length : freedOnes().length;
    stage.innerHTML='<canvas class="panel" id="panel"></canvas>'+
      (count?"":'<div class="empty"><div class="lbl">'+(view==="inferno"?"Terra deserta":"Cielo vuoto")+'</div><p>'+
        (view==="inferno"
          ? "Nessuna creatura abita ancora l&rsquo;Inferno.<br>Dai un nome a ci&ograve; che ti stringe: prender&agrave; corpo."
          : "Chi viene liberato sale qui, verso la luce.")+'</p>'+
        (view==="inferno"?'<button class="btn primary" id="empty-evoca" style="margin-top:16px;pointer-events:auto">Evocare la prima</button>':"")+
        '</div>');
    attachPanel(el("panel"));
    if(el("empty-evoca")) el("empty-evoca").onclick=function(){ openForm(null); };
  }
  if(raf) cancelAnimationFrame(raf);
  if(view!=="registro"){ if(reduceMotion) redraw(); else loop(); }
  applyTextures();
}
function go(v){ if(view!==v){ view=v; render(); } }

/* ===================== fogli ===================== */
function closeSheet(){
  var app=document.querySelector(".app"); if(!app) return;
  var s=app.querySelector(".sheet"), sc=app.querySelector(".scrim");
  if(s) s.remove(); if(sc) sc.remove();
}
function sheet(titleHTML, bodyHTML, onMount){
  closeSheet();
  var app=document.querySelector(".app");
  var scrim=h('<div class="scrim"></div>'); scrim.onclick=closeSheet;
  var sh=h('<div class="sheet" role="dialog" aria-modal="true">'+
    '<div class="sheet-head">'+titleHTML+
      '<button class="xbtn" data-close aria-label="Chiudi"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>'+
    '</div><div class="sheet-body">'+bodyHTML+'</div></div>');
  sh.querySelector("[data-close]").onclick=closeSheet;
  app.appendChild(scrim); app.appendChild(sh);
  sh.style.backgroundImage="url("+parchmentTile("vellum")+")";
  if(onMount) onMount(sh);
  return sh;
}
function toast(msg){
  var app=document.querySelector(".app"); if(!app) return;
  var old=app.querySelector(".toast"); if(old) old.remove();
  var t=h('<div class="toast">'+esc(msg)+'</div>');
  app.appendChild(t);
  setTimeout(function(){ if(t.parentNode) t.remove(); },3200);
}
function confirmSheet(title, body, okLabel, onOk){
  sheet('<h2>'+esc(title)+'</h2>',
    '<p class="note">'+esc(body)+'</p>'+
    '<div class="btnrow"><button class="btn ghost" id="cf-no">Annulla</button>'+
    '<button class="btn danger" id="cf-yes">'+esc(okLabel)+'</button></div>',
    function(sh){
      sh.querySelector("#cf-no").onclick=closeSheet;
      sh.querySelector("#cf-yes").onclick=function(){ onOk(); };
    });
}

/* ===================== evocazione / modifica ===================== */
function placeIn(regionKey){
  var r=regionOf(regionKey), R=rng(seedOf(regionKey+Date.now()));
  var a=R()*6.283, d=Math.sqrt(R())*r.r*0.7;
  return {x:clamp(r.x+Math.cos(a)*d,.1,.9), y:clamp(r.y+Math.sin(a)*d*0.8,.12,.9)};
}
function openForm(id){
  var c=id?byId(id):null;
  var kind=c?c.kind:"dievas", reg=c?c.region:"rimugini", inten=c?c.intensity:5;
  var regOpts=REGIONS.map(function(r){
    return '<option value="'+r.k+'"'+(r.k===reg?" selected":"")+'>'+esc(r.name)+' — '+esc(r.hint)+'</option>';
  }).join("");
  sheet('<h2>'+(c?"Emendare la creatura":"Evocare una creatura")+'</h2>',
    '<div class="field"><div class="lbl">Natura</div>'+
      '<div class="seg" id="f-kind">'+
        '<button class="k-dievas" data-k="dievas" aria-pressed="'+(kind==="dievas")+'">Dievas<small>un’ansia</small></button>'+
        '<button class="k-demone" data-k="demone" aria-pressed="'+(kind==="demone")+'">Demone<small>una paura</small></button>'+
      '</div></div>'+
    '<div id="f-preview" style="display:flex;justify-content:center"></div>'+
    '<div class="field"><div class="lbl">Nome proprio</div>'+
      '<input type="text" id="f-name" maxlength="40" placeholder="Il Corvo delle Tre" value="'+esc(c?c.name:"")+'">'+
      '<div class="hint">Il nome genera la figura: cambiandolo, cambia la bestia.</div></div>'+
    '<div class="field"><div class="lbl">Aspetto</div>'+
      '<textarea id="f-epithet" rows="2" placeholder="Che forma ha? Come si muove?">'+esc(c?c.epithet:"")+'</textarea></div>'+
    '<div class="field"><div class="lbl">Dominio</div><select id="f-region">'+regOpts+'</select></div>'+
    '<div class="field"><div class="lbl">Potenza attuale</div>'+
      '<div class="slider"><input type="range" id="f-int" min="1" max="10" value="'+inten+'"><span class="val" id="f-intv">'+inten+'</span></div></div>'+
    '<div class="field"><div class="lbl">Ciò che la evoca</div>'+
      '<textarea id="f-trig" rows="2" placeholder="Situazioni, luoghi, momenti">'+esc(c?c.triggers:"")+'</textarea></div>'+
    '<div class="field"><div class="lbl">Come ti tocca il corpo</div>'+
      '<textarea id="f-sym" rows="2" placeholder="Respiro, stomaco, mani, sonno">'+esc(c?c.symptoms:"")+'</textarea></div>'+
    '<div class="btnrow"><button class="btn primary" id="f-save">'+(c?"Salva":"Evoca")+'</button></div>',
    function(sh){
      var k=kind;
      function preview(){
        var nm=sh.querySelector("#f-name").value.trim()||"anonima";
        var fake={id:"preview", kind:k, seed: c? c.seed : seedOf(nm), entries:[], intensity:5};
        var box=sh.querySelector("#f-preview");
        box.innerHTML="";
        var cv=document.createElement("canvas");

}

/* ===================== scheda creatura ===================== */
function sparkline(entries){
  if(entries.length<2) return "";
  var w=300,hh=76,pad=7,n=entries.length;
  var xs=function(i){ return pad+i*(w-pad*2)/(n-1); };
  var ys=function(v){ return hh-pad-(v-1)/9*(hh-pad*2); };
  var pts=entries.map(function(e,i){ return xs(i)+","+ys(e.intensity); }).join(" ");
  var area="M"+xs(0)+","+(hh-pad)+" L"+entries.map(function(e,i){ return xs(i)+","+ys(e.intensity); }).join(" L")+" L"+xs(n-1)+","+(hh-pad)+" Z";
  var dots=entries.map(function(e,i){ return '<circle cx="'+xs(i)+'" cy="'+ys(e.intensity)+'" r="'+(i===n-1?3.4:1.9)+'" fill="#9E2B15"/>'; }).join("");
  return '<svg class="trend" viewBox="0 0 '+w+' '+hh+'" preserveAspectRatio="none" aria-hidden="true">'+
    '<defs><linearGradient id="gA" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" stop-color="#9E2B15" stop-opacity=".26"/><stop offset="100%" stop-color="#9E2B15" stop-opacity="0"/>'+
    '</linearGradient></defs>'+
    '<line class="gd" x1="0" y1="'+ys(5.5)+'" x2="'+w+'" y2="'+ys(5.5)+'"/>'+
    '<path class="ar" d="'+area+'" fill="url(#gA)"/><polyline class="ln" points="'+pts+'"/>'+dots+'</svg>';
}
function entryHTML(e){
  var cls=e.intensity>=7?"hi":(e.intensity<=3?"lo":"");
  var cbt="";
  if(e.cbt&&(e.cbt.thought||e.cbt.pro||e.cbt.con||e.cbt.reframe)){
    cbt='<div class="cbt">'+
      (e.cbt.thought?'<div><b>Pensiero automatico</b>'+esc(e.cbt.thought)+'</div>':"")+
      (e.cbt.pro?'<div><b>Prove a favore</b>'+esc(e.cbt.pro)+'</div>':"")+
      (e.cbt.con?'<div><b>Prove contrarie</b>'+esc(e.cbt.con)+'</div>':"")+
      (e.cbt.reframe?'<div><b>Riformulazione</b>'+esc(e.cbt.reframe)+'</div>':"")+'</div>';
  }
  var rit="";
  if(e.ritual&&e.ritual.what){
    var oi=OUTCOMES.indexOf(e.ritual.outcome);
    rit='<div class="ritual">'+(e.ritual.outcome?'<span class="out o'+(oi>0?oi:3)+'">'+esc(e.ritual.outcome)+'</span>':"")+
      '<span>'+esc(e.ritual.what)+'</span></div>';
  }
  var gr="";
  if(gOf(e)!==null){
    var gc = e.ground>0?"g1":(e.ground<0?"gm1":"g0");
    gr='<div class="gline '+gc+'"><span class="tag">'+esc(groundLabel(e.ground))+'</span>'+
       (e.groundNote?'<span>'+esc(e.groundNote)+'</span>':'<span></span>')+'</div>';
  }
  return '<div class="entry '+cls+'"><div class="entry-head"><time>'+fmtDate(e.date)+'</time>'+
    '<span class="pw">potenza '+e.intensity+'</span></div>'+
    (e.text?'<p>'+esc(e.text)+'</p>':"")+gr+cbt+rit+'</div>';
}

/* ===================== voci ===================== */
function pushEntry(c, entry){
  c.entries=(c.entries||[]).concat([entry]);
  c.entries.sort(function(a,b){ return a.date<b.date?-1:(a.date>b.date?1:0); });
  c.intensity=lastIntensity(c);
  clearSprites(); save();
}
function saveQuick(id, pot, ground, reopen){
  var c=byId(id); if(!c) return;
  var e=todayEntry(c);
  if(e){
    e.intensity=pot; e.ground=ground;
    c.intensity=lastIntensity(c); clearSprites(); save();
    toast("Voce di oggi aggiornata.");
  } else {
    pushEntry(c,{id:uid(), date:todayISO(), intensity:pot, ground:ground, text:"", groundNote:"", quick:true,
      cbt:{thought:"",pro:"",con:"",reframe:""}, ritual:{what:"",outcome:""}});
    toast(ground>0 ? "Terreno tenuto. Segnato."
        : (ground<0 ? "Segnato: oggi ha deciso lei." : "Segnato: a metà."));
  }
  closeSheet(); render();
  if(reopen) openCreature(id);
}

      '<input type="text" id="rt-name" maxlength="40" placeholder="Come si chiama ora che non fa più male">'+
      '<div class="hint">Vuoto per tenere «'+esc(c.name)+'».</div></div>'+
    '<div class="field"><div class="lbl">Epitaffio</div>'+
      '<textarea id="rt-epi" rows="3" placeholder="Che cosa ti ha insegnato, o che cosa è cambiato"></textarea></div>'+

    '<div class="btnrow"><button class="btn gold" id="rt-go">Compiere il rito</button></div>',
    function(sh){
      sh.querySelector("#rt-go").onclick=function(){
        c.freed={date:sh.querySelector("#rt-date").value||todayISO(),
          newName:sh.querySelector("#rt-name").value.trim(),
          epitaph:sh.querySelector("#rt-epi").value.trim()};
        clearSprites(); save(); closeSheet();
        playRite(c,function(){ view="paradiso"; render();
          toast("«"+(c.freed.newName||c.name)+"» sale verso la luce."); });
      };
    });
}
function playRite(c, done){
  var app=document.querySelector(".app");
  var ov=h('<div class="rite"><canvas></canvas><p>'+esc(c.name)+'<br>si scioglie in luce</p>'+
    '<small>'+esc(c.freed.newName?"→ "+c.freed.newName:"sale nel Paradiso")+'</small></div>');
  app.appendChild(ov);
  var s=setupCanvas(ov.querySelector("canvas")), ctx=s.ctx, w=s.w, hh=s.h;
  var parts=[], R=rng(c.seed);
  for(var i=0;i<190;i++) parts.push({x:w/2+(R()-.5)*80, y:hh*.62+(R()-.5)*46,
    vx:(R()-.5)*.5, vy:-(0.5+R()*1.7), r:0.7+R()*2, a:0.35+R()*0.65, g:R()});
  var start=Date.now(), dur=reduceMotion?900:2600;
  (function frame(){
    var t=(Date.now()-start)/dur;
    ctx.clearRect(0,0,w,hh);
    parts.forEach(function(p){
      p.x+=p.vx; p.y+=p.vy; p.vy-=0.004;
      var al=p.a*Math.max(0,1-t);
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283);
      ctx.fillStyle="rgba("+(p.g<0.6?"246,232,190":(c.kind==="dievas"?"150,190,140":"214,110,26"))+","+al.toFixed(3)+")";
      ctx.fill();
    });
    if(t<1) requestAnimationFrame(frame); else { ov.remove(); done(); }
  })();
}

/* ===================== statistiche ===================== */
function dayMap(){
  var m={};
  S.creatures.forEach(function(c){ (c.entries||[]).forEach(function(e){
    var d=String(e.date).slice(0,10);
    if(!m[d]) m[d]={n:0,sum:0};
    m[d].n++; m[d].sum+=e.intensity;
  }); });
  return m;
}
function streakInfo(m){
  var cur=0, best=0, run=0, d=new Date(), i;
  for(i=0;i<400;i++){
    var k=dISO(new Date(d.getTime()-i*86400000));
    if(m[k]){ run++; if(i===cur) cur=run; } else { if(run>best) best=run; run=0; if(i===0) cur=0; }
  }
  if(run>best) best=run;
  var c2=0;
  for(i=0;i<400;i++){ if(m[dISO(new Date(Date.now()-i*86400000))]) c2++; else break; }
  return {current:c2, best:best};
}
function ritualStats(){
  var m={};
  S.creatures.forEach(function(c){ (c.entries||[]).forEach(function(e){
    var w=e.ritual&&e.ritual.what?e.ritual.what.trim():"";
    if(!w) return;
    var k=w.toLowerCase().slice(0,44);
    if(!m[k]) m[k]={label:w, n:0, score:0, good:0};
    m[k].n++;
    if(e.ritual.outcome===OUTCOMES[1]){ m[k].score+=1; m[k].good++; }
    else if(e.ritual.outcome===OUTCOMES[2]) m[k].score+=0.5;
  }); });
  return Object.keys(m).map(function(k){ return m[k]; })
    .sort(function(a,b){ return (b.score/b.n)-(a.score/a.n) || b.n-a.n; });
}
function triggerWords(){
  var freq={};
  function add(txt){
    if(!txt) return;
    String(txt).toLowerCase().replace(/[^a-zàèéìòù\s]/g," ").split(/\s+/).forEach(function(w){
      if(w.length<4) return;
      if(STOP.indexOf(w)>=0) return;
      freq[w]=(freq[w]||0)+1;
    });
  }
  S.creatures.forEach(function(c){
    add(c.triggers); add(c.symptoms);
    (c.entries||[]).forEach(function(e){ add(e.text); add(e.cbt&&e.cbt.thought); });
  });
  return Object.keys(freq).map(function(w){ return {w:w,n:freq[w]}; })
    .filter(function(x){ return x.n>1; })
    .sort(function(a,b){ return b.n-a.n; }).slice(0,16);
}
function weeklyTrend(){
  var out=[], now=new Date();
  for(var wk=11;wk>=0;wk--){
    var end=new Date(now.getTime()-wk*7*86400000);
    var start=new Date(end.getTime()-6*86400000);
    var s=0,n=0;
    S.creatures.forEach(function(c){ (c.entries||[]).forEach(function(e){
      var d=new Date(e.date+"T12:00:00");
      if(d>=start&&d<=end){ s+=e.intensity; n++; }
    }); });
    out.push({avg:n?s/n:null, n:n, label:MESI3[end.getMonth()]+" "+end.getDate()});
  }
  return out;
}
function omens(){
  var out=[], m=dayMap(), all=allEntries();
  if(all.length<3){
    out.push("Ancora pochi segni: con qualche voce in più il registro comincia a parlare.");
    return out;
  }
  var gt=groundTally(30);
  if(gt.won+gt.lost+gt.half>=4){
    out.push("Ultimi trenta giorni: terreno tenuto "+gt.won+" volte, ceduto "+gt.lost+
      (gt.half?" ("+gt.half+" a metà)":"")+". "+
      (gt.won>gt.lost ? "La presa sta calando: è il segno che conta."
       : (gt.lost>gt.won ? "Le stai lasciando strada più di quanta gliene togli."
          : "Siete in pareggio.")));
  } else {
    out.push("Registra il terreno per qualche giorno: è da lì che si capisce se una creatura sta perdendo forza davvero.");
  }
  var grippy=null;
  living().forEach(function(c){ var g=gripOf(c); if(g!=null&&(!grippy||g>grippy.g)) grippy={c:c,g:g}; });
  if(grippy&&grippy.g>=7) out.push("«"+grippy.c.name+"» è quella che decide di più: presa "+grippy.g+" su 10.");
  var rum=topRumination();
  if(rum) out.push("Hai interrogato "+rum.n+" volte lo stesso pensiero («"+rum.t.slice(0,44)+(rum.t.length>44?"…":"")+"»). A quel punto non è più esame di realtà: è rassicurazione.");
  if(all.length){
    var gap=daysBetween(all[0].e.date, todayISO());
    if(gap>=5) out.push("L’ultima voce risale a "+gap+" giorni fa: il bestiario è fermo.");
  }
  /* giorno della settimana peggiore */
  if(all.length>=8){
    var wd=[0,0,0,0,0,0,0], wn=[0,0,0,0,0,0,0];
    all.forEach(function(x){ var d=new Date(x.e.date+"T12:00:00").getDay(); wd[d]+=x.e.intensity; wn[d]++; });
    var bi=-1,bv=-1,tot=0,totn=0;
    for(var i=0;i<7;i++){ tot+=wd[i]; totn+=wn[i]; if(wn[i]>=2&&wd[i]/wn[i]>bv){ bv=wd[i]/wn[i]; bi=i; } }
    var avg=totn?tot/totn:0;
    if(bi>=0&&bv-avg>=1) out.push("Le creature sono più forti di "+GIORNI[bi]+": in media "+bv.toFixed(1)+" contro "+avg.toFixed(1)+" degli altri giorni.");
  }
  /* andamento 30 giorni */
  var now=Date.now(), a1=0,n1=0,a2=0,n2=0;
  all.forEach(function(x){
    var age=daysBetween(x.e.date, todayISO());
    if(age<=30){ a1+=x.e.intensity; n1++; } else if(age<=60){ a2+=x.e.intensity; n2++; }
  });
  if(n1>=3&&n2>=3){
    var d1=a1/n1, d2=a2/n2, diff=d1-d2;
    if(Math.abs(diff)>=0.6) out.push("Nell’ultimo mese la potenza media è "+(diff<0?"scesa":"salita")+" da "+d2.toFixed(1)+" a "+d1.toFixed(1)+".");
  }
  /* dominio che cresce */
  var byReg={};
  living().forEach(function(c){
    var r=c.region; if(!byReg[r]) byReg[r]={n:0,pw:0};
    byReg[r].n++; byReg[r].pw+=lastIntensity(c);
  });
  var top=null;
  Object.keys(byReg).forEach(function(k){ if(!top||byReg[k].pw>byReg[top].pw) top=k; });
  if(top&&byReg[top].n>=2) out.push("Il dominio più pesante è "+regionOf(top).name+": "+byReg[top].n+" creature per "+byReg[top].pw+" di potenza.");
  /* rituale migliore */
  var rs=ritualStats().filter(function(r){ return r.n>=3; });
  if(rs.length&&rs[0].score/rs[0].n>=0.6) out.push("Il rituale che regge meglio è «"+rs[0].label+"»: "+rs[0].good+" volte su "+rs[0].n+".");
  /* creatura dormiente */
  var sleepy=living().filter(function(c){
    var last=(c.entries&&c.entries.length)?c.entries[c.entries.length-1].date:c.born;
    return daysBetween(last,todayISO())>=21;
  });
  if(sleepy.length) out.push(sleepy.length===1
    ? "«"+sleepy[0].name+"» non si fa vedere da tre settimane: forse è pronta al rito."
    : sleepy.length+" creature non si fanno vedere da tre settimane: forse sono pronte al rito.");
  if(!out.length) out.push("Nessuno schema evidente, per ora. Va bene così.");
  return out;
}

function heatColor(avg){
  if(avg==null) return "rgba(44,31,18,.07)";
  var t=clamp((avg-1)/9,0,1);
  var r=Math.round(226-(226-158)*t), g=Math.round(206-(206-43)*t), b=Math.round(158-(158-21)*t);
  return "rgb("+r+","+g+","+b+")";
}

/* ===================== carta della creatura ===================== */
function makeCard(c){
  if(!c) return;
  var W=900, H=1320;
  var cv=document.createElement("canvas"); cv.width=W; cv.height=H;
  var x=cv.getContext("2d");
  /* fondo pergamena */
  var img=new Image();
  img.onload=function(){
    var pat=x.createPattern(img,"repeat");
    x.fillStyle=pat; x.fillRect(0,0,W,H);
    finish();
  };
  img.onerror=function(){ x.fillStyle="#E4D3AA"; x.fillRect(0,0,W,H); finish(); };
  img.src=parchmentTile("vellum");

  function finish(){
    var R=rng(c.seed^0x1234);
    /* bordo */
    x.strokeStyle="#3B2917"; x.lineWidth=6; x.strokeRect(26,26,W-52,H-52);
    x.lineWidth=1.5; x.strokeRect(42,42,W-84,H-84);
    /* angoli */
    [[42,42,1,1],[W-42,42,-1,1],[42,H-42,1,-1],[W-42,H-42,-1,-1]].forEach(function(cn){
      x.beginPath();
      x.moveTo(cn[0]+cn[2]*46,cn[1]);
      x.quadraticCurveTo(cn[0]+cn[2]*16,cn[1]+cn[3]*16, cn[0],cn[1]+cn[3]*46);
      x.strokeStyle="#9E2B15"; x.lineWidth=2.4; x.stroke();
    });
    /* titolo */
    x.textAlign="center";
    x.fillStyle="#9E2B15";
    x.font='600 26px "EB Garamond", Georgia, serif';
    var kind=c.freed?"LIBERATA":(c.kind==="dievas"?"DIEVAS · ANSIA":"DEMONE · PAURA");
    x.fillText(kind.split("").join(" "), W/2, 120);
    x.fillStyle="#2C1F12";
    x.font='400 68px "UnifrakturMaguntia", "Grenze Gotisch", serif';
    var nm=(c.freed&&c.freed.newName)?c.freed.newName:c.name;
    x.fillText(nm, W/2, 200);
    /* ritratto */
    x.save(); x.translate(W/2, 470);
    drawGrotesque(x, 205, c, c.freed?"pale":null);
    x.restore();
    /* dati */
    var y=780;
    x.textAlign="center"; x.fillStyle="#5A4630";
    x.font='italic 400 30px "EB Garamond", Georgia, serif';
    if(c.epithet) y=wrapText(x, c.epithet, W/2, y, W-200, 38);
    y+=26;
    x.strokeStyle="rgba(44,31,18,.35)"; x.lineWidth=1;
    x.beginPath(); x.moveTo(180,y); x.lineTo(W-180,y); x.stroke();
    y+=48;
    x.fillStyle="#2C1F12"; x.font='400 28px "EB Garamond", Georgia, serif';
    var rows=[
      ["Dominio", regionOf(c.region).name],
      ["Evocata", fmtLong(c.born)],
      [c.freed?"Liberata":"Potenza", c.freed?fmtLong(c.freed.date):String(lastIntensity(c))+" su 10"],
      ["Voci di diario", String((c.entries||[]).length)]
    ];
    rows.forEach(function(r){
      x.textAlign="right"; x.fillStyle="#8A755A";
      x.font='600 20px "EB Garamond", Georgia, serif';
      x.fillText(r[0].toUpperCase(), W/2-24, y);
      x.textAlign="left"; x.fillStyle="#2C1F12";
      x.font='400 28px "EB Garamond", Georgia, serif';
      x.fillText(r[1], W/2+24, y);
      y+=48;
    });
    if(c.freed&&c.freed.epitaph){
      y+=18; x.textAlign="center"; x.fillStyle="#8A6A16";
      x.font='italic 400 30px "EB Garamond", Georgia, serif';
      y=wrapText(x, "“"+c.freed.epitaph+"”", W/2, y, W-220, 40);
    }
    /* piè di pagina */
    x.textAlign="center"; x.fillStyle="#8A755A";
    x.font='600 19px "EB Garamond", Georgia, serif';
    x.fillText("B E S T I A R I O   D E L L ’ A B I S S O", W/2, H-80);
    showCard(cv, c);
  }
}
function wrapText(x, text, cx, y, maxW, lh){
  var words=String(text).split(/\s+/), line="", i;
  for(i=0;i<words.length;i++){
    var t=line?line+" "+words[i]:words[i];
    if(x.measureText(t).width>maxW && line){ x.fillText(line,cx,y); y+=lh; line=words[i]; }
    else line=t;
  }
  if(line){ x.fillText(line,cx,y); y+=lh; }
  return y;
}
function showCard(cv, c){
  var url=cv.toDataURL("image/png");
  sheet('<h2>Carta della creatura</h2>',
    '<img src="'+url+'" alt="Carta di '+esc(c.name)+'" style="width:100%;border:1px solid rgba(44,31,18,.35)">'+
    '<div class="btnrow"><button class="btn primary" id="cd-save">Salvare l’immagine</button></div>'+
    '<p class="note">Se il salvataggio non è disponibile, tieni premuto sull’immagine per salvarla.</p>',
    function(sh){
      sh.querySelector("#cd-save").onclick=function(){
        var name=(c.name||"creatura").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")+".png";
        cv.toBlob(function(blob){
          if(!blob){ toast("Immagine non generata."); return; }
          if(downloadBlob(blob, name)) toast("Carta scaricata.");
          else toast("Tieni premuto sull’immagine per salvarla.");
        },"image/png");
      };
    });
}


/* ===================== download nel browser ===================== */
function downloadBlob(blob, filename){
  try{
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    a.href=url; a.download=filename; a.rel="noopener";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ try{ URL.revokeObjectURL(url); a.remove(); }catch(e){} }, 1500);
    return true;
  }catch(e){ return false; }
}

/* ===================== custodia ===================== */
function stateJSON(){ return JSON.stringify(S).replace(/</g,"\\u003c"); }
function buildDocument(){
  var style=el("app-style").textContent, code=el("app-code").textContent;
  var open="<scr"+"ipt", close="</scr"+"ipt>";
  return '<!doctype html><html lang="it"><head><meta charset="utf-8">'+
    '<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">'+
    '<title>'+TITLE+'</title>'+FONTS+
    '<style id="app-style">'+style+'</style></head><body>'+SHELL+
    open+' id="app-state" type="application/json">'+stateJSON()+close+
    open+' id="app-code">'+code+close+'</body></html>';
}
function sealVolume(){
  var doc=buildDocument();
  var ok=downloadBlob(new Blob([doc],{type:"text/html"}), "bestiario-"+todayISO()+".html");
  toast(ok
    ? "Copia scaricata: e' l'app intera con dentro le tue creature. Si apre anche senza rete."
    : "Download non riuscito. Usa l'esportazione del backup.");
}
function exportBackup(){
  var name="bestiario-"+todayISO()+".json", data=JSON.stringify(S,null,2);
  if(downloadBlob(new Blob([data],{type:"application/json"}), name)) toast("Backup scaricato.");
  else showRaw(data);
}
function showRaw(data){
  sheet('<h2>Backup</h2>',
    '<p class="note">Il download non è disponibile qui. Copia questo testo e conservalo.</p>'+
    '<textarea id="bk" rows="12" readonly style="font-size:12px">'+esc(data)+'</textarea>'+
    '<div class="btnrow"><button class="btn primary" id="bk-copy">Copiare tutto</button></div>',
    function(sh){
      sh.querySelector("#bk-copy").onclick=function(){
        var ta=sh.querySelector("#bk"); ta.select();
        try{ document.execCommand("copy"); toast("Copiato."); }catch(e){ toast("Copia manualmente."); }
      };
    });
}
function importBackup(){
  var inp=document.createElement("input");
  inp.type="file"; inp.accept="application/json,.json";
  inp.onchange=function(){
    var f=inp.files&&inp.files[0]; if(!f) return;
    var fr=new FileReader();
    fr.onload=function(){
      try{
        var d=JSON.parse(fr.result);
        if(!d||!Array.isArray(d.creatures)) throw new Error("formato");
        confirmSheet("Importare "+d.creatures.length+" creature?","I dati attuali di questo dispositivo verranno sostituiti.","Importa",function(){
          S={v:1,creatures:d.creatures,updated:d.updated||null};
          clearSprites(); save(); closeSheet(); render(); toast("Bestiario importato.");
        });
      }catch(e){ toast("File non valido."); }
    };
    fr.readAsText(f);
  };
  inp.click();
}

/* ===================== avvio ===================== */
function refit(){
  if(!pcv||view==="registro") return;
  var s=setupCanvas(pcv); pctx=s.ctx; bake=null; redraw();
}
window.addEventListener("resize", refit);
window.addEventListener("orientationchange", function(){ setTimeout(refit,250); });
if(window.visualViewport){
  window.visualViewport.addEventListener("resize", refit);
  window.visualViewport.addEventListener("scroll", function(){ window.scrollTo(0,0); });
}
document.addEventListener("keydown", function(e){ if(e.key==="Escape") closeSheet(); });

loadState();
render();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){ bake=null; redraw(); });
})();
</script>
