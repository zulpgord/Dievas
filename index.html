}
function nightAnchors(parked){
  sheet('<div style="flex:1"><h2>'+(parked?"Parcheggiato":"Va bene")+'</h2></div>',
    (parked? '<p class="note">È al sicuro nel tomo. Domani sera lo trovi nel Registro, e allora potrai deciderne qualcosa.</p>'
           : '<p class="note">Niente da scrivere, va bene uguale.</p>')+
    '<div class="rubric"><h2>Tre cose che puoi fare adesso</h2></div>'+
    '<div class="anchor"><b>Respira più a lungo in uscita</b>Inspira contando quattro, espira contando sei o otto. Non serve calmarsi: serve solo dare al corpo qualcosa da fare mentre passa.</div>'+
    '<div class="anchor" style="margin-top:12px"><b>Nomina cinque cose che vedi</b>Ad alta voce o a mente, lentamente. Riporta l’attenzione dentro la stanza, dove il pericolo non c’è.</div>'+
    '<div class="anchor" style="margin-top:12px"><b>Se sei a letto da più di venti minuti, alzati</b>Luce bassa, una cosa noiosa, seduto. Torna a letto quando arriva il sonno: restare sveglio a letto insegna al cervello che il letto è il posto dove si combatte.</div>'+
    '<div class="btnrow" style="margin-top:16px"><button class="btn primary" id="nt-bed">Torno a letto</button></div>',
    function(sh){ sh.querySelector("#nt-bed").onclick=closeSheet; }, "night");
}

/* ===================== sfide ===================== */
function chalHTML(x, c){
  var late=!x.outcome && x.due<todayISO();
  var cls=x.outcome? (x.outcome==="non"?"chal miss":"chal done") : "chal";
  var out='<div class="'+cls+'">';
  out+='<span class="when'+(late?" late":"")+'">'+
    (x.outcome? "chiusa il "+fmtDate(x.closedAt||x.due)
      : (late? "scaduta il "+fmtDate(x.due) : "entro il "+fmtDate(x.due)))+'</span>';
  out+='<span class="what">'+esc(x.what)+'</span>';
  if(x.outcome){
    var lbl=x.outcome==="fatta"?"Fatta":(x.outcome==="parziale"?"A metà":"Non fatta");
    out+='<div class="verdict"><b>'+lbl+'</b>';
    if(typeof x.actual==="number"){
      var d=x.fear-x.actual;
      out+='<span>temevi '+x.fear+', è stata '+x.actual+'</span>';
      if(d>0) out+='<span class="gap">'+d+' in meno</span>';
    }
    out+='</div>';
    if(x.note) out+='<p class="note" style="margin:0">'+esc(x.note)+'</p>';
    out+='<div class="btnrow"><button class="btn ghost" data-chaldel="'+x.id+'" style="font-size:14px;padding:7px">Cancellare</button></div>';
  } else {
    out+='<div class="verdict"><span>temi che sia '+x.fear+' su 10</span></div>';
    out+='<div class="seg"><button data-chal="'+x.id+'" data-res="fatta">L’ho fatta</button>'+
      '<button data-chal="'+x.id+'" data-res="parziale">A metà</button>'+
      '<button data-chal="'+x.id+'" data-res="non">Non l’ho fatta</button></div>';
  }
  return out+'</div>';
}
function openChallenge(id){
  var c=byId(id); if(!c) return;
  /* suggerimenti dagli evitamenti già annotati */
  var sugg=[];
  (c.entries||[]).slice().reverse().forEach(function(e){
    if(gOf(e)!==null && e.ground<0 && e.groundNote && e.groundNote.length>3 && sugg.length<4 && sugg.indexOf(e.groundNote)<0)
      sugg.push(e.groundNote);
  });
  var when=new Date(Date.now()+2*86400000);
  sheet('<div style="flex:1"><span class="kindtag '+(c.kind==="dievas"?"k-verd":"k-rub")+'"><i></i>'+esc(c.name)+'</span>'+
        '<h2 style="margin-top:3px">Lanciare una sfida</h2></div>',
    '<p class="note">Una cosa che questa creatura ti fa evitare, e che decidi di fare lo stesso. Piccola abbastanza da farla davvero.</p>'+
    '<div class="field"><div class="lbl">Che cosa farai</div>'+
      '<textarea id="ch-what" rows="2" placeholder="Chiamare il commercialista senza scrivermi prima la scaletta"></textarea>'+
      (sugg.length? '<div class="hint">Dalle tue voci: '+sugg.map(function(t,i){

function playRite(c, done){
  var app=document.querySelector(".app");
  var ov=h('<div class="rite"><canvas></canvas><p>'+esc(c.name)+'<br>si scioglie in luce</p>'+
    '<small>'+esc(c.freed.newName?"→ "+c.freed.newName:"sale nel Paradiso")+'</small></div>');
  app.appendChild(ov);
  var s=setupCanvas(ov.querySelector("canvas")), ctx=s.ctx, w=s.w, hh=s.h;
  var parts=[], R=rng(c.seed);
  for(var i=0;i<190;i++) parts.push({x:w/2+(R()-.5)*80, y:hh*.62+(R()-.5)*46,
    vx:(R()-.5)*.5, vy:-(0.5+R()*1.7), r:0.7+R()*2, a:0.35+R()*0.65, g:R()});
  var start=Date.now(), dur=reduceMotion?900:2600;
  (function frame(){
    var t=(Date.now()-start)/dur;
    ctx.clearRect(0,0,w,hh);
    parts.forEach(function(p){
      p.x+=p.vx; p.y+=p.vy; p.vy-=0.004;
      var al=p.a*Math.max(0,1-t);
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283);
      ctx.fillStyle="rgba("+(p.g<0.6?"246,232,190":(c.kind==="dievas"?"150,190,140":"214,110,26"))+","+al.toFixed(3)+")";
      ctx.fill();
    });
    if(t<1) requestAnimationFrame(frame); else { ov.remove(); done(); }
  })();
}

/* ===================== statistiche ===================== */
function dayMap(){
  var m={};
  S.creatures.forEach(function(c){ (c.entries||[]).forEach(function(e){
    var d=String(e.date).slice(0,10);
    if(!m[d]) m[d]={n:0,sum:0};
    m[d].n++; m[d].sum+=e.intensity;
  }); });
  return m;
}
function streakInfo(m){
  var cur=0, best=0, run=0, d=new Date(), i;
  for(i=0;i<400;i++){
    var k=dISO(new Date(d.getTime()-i*86400000));
    if(m[k]){ run++; if(i===cur) cur=run; } else { if(run>best) best=run; run=0; if(i===0) cur=0; }
  }
  if(run>best) best=run;
  var c2=0;
  for(i=0;i<400;i++){ if(m[dISO(new Date(Date.now()-i*86400000))]) c2++; else break; }
  return {current:c2, best:best};
}
function ritualStats(){
  var m={};
  S.creatures.forEach(function(c){ (c.entries||[]).forEach(function(e){
    var w=e.ritual&&e.ritual.what?e.ritual.what.trim():"";
    if(!w) return;
    var k=w.toLowerCase().slice(0,44);
    if(!m[k]) m[k]={label:w, n:0, score:0, good:0};
    m[k].n++;
    if(e.ritual.outcome===OUTCOMES[1]){ m[k].score+=1; m[k].good++; }
    else if(e.ritual.outcome===OUTCOMES[2]) m[k].score+=0.5;
  }); });
  return Object.keys(m).map(function(k){ return m[k]; })
    .sort(function(a,b){ return (b.score/b.n)-(a.score/a.n) || b.n-a.n; });
}
function triggerWords(){
  var freq={};
  function add(txt){
    if(!txt) return;
    String(txt).toLowerCase().replace(/[^a-zàèéìòù\s]/g," ").split(/\s+/).forEach(function(w){
      if(w.length<4) return;
      if(STOP.indexOf(w)>=0) return;
      freq[w]=(freq[w]||0)+1;
    });
  }
  S.creatures.forEach(function(c){
    add(c.triggers); add(c.symptoms);
    (c.entries||[]).forEach(function(e){ add(e.text); add(e.cbt&&e.cbt.thought); });
  });
  return Object.keys(freq).map(function(w){ return {w:w,n:freq[w]}; })
    .filter(function(x){ return x.n>1; })
    .sort(function(a,b){ return b.n-a.n; }).slice(0,16);
}
function weeklyTrend(){
  var out=[], now=new Date();
  for(var wk=11;wk>=0;wk--){
    var end=new Date(now.getTime()-wk*7*86400000);
    var start=new Date(end.getTime()-6*86400000);
    var s=0,n=0;
    S.creatures.forEach(function(c){ (c.entries||[]).forEach(function(e){
      var d=new Date(e.date+"T12:00:00");
      if(d>=start&&d<=end){ s+=e.intensity; n++; }
    }); });
    out.push({avg:n?s/n:null, n:n, label:MESI3[end.getMonth()]+" "+end.getDate()});
  }
  return out;
}
function omens(){
  var out=[], m=dayMap(), all=allEntries();
  if(all.length<3){
    out.push("Ancora pochi segni: con qualche voce in più il registro comincia a parlare.");
    return out;
  }
  var gt=groundTally(30);
  if(gt.won+gt.lost+gt.half>=4){
    out.push("Ultimi trenta giorni: terreno tenuto "+gt.won+" volte, ceduto "+gt.lost+
      (gt.half?" ("+gt.half+" a metà)":"")+". "+
      (gt.won>gt.lost ? "La presa sta calando: è il segno che conta."
       : (gt.lost>gt.won ? "Le stai lasciando strada più di quanta gliene togli."
          : "Siete in pareggio.")));
  } else {
    out.push("Registra il terreno per qualche giorno: è da lì che si capisce se una creatura sta perdendo forza davvero.");
  }
  var grippy=null;
  living().forEach(function(c){ var g=gripOf(c); if(g!=null&&(!grippy||g>grippy.g)) grippy={c:c,g:g}; });
  if(grippy&&grippy.g>=7) out.push("«"+grippy.c.name+"» è quella che decide di più: presa "+grippy.g+" su 10.");
  var cst=chalStats();
  if(cst.n>=3&&cst.fear!=null){
    out.push("Hai chiuso "+cst.tot+(cst.tot===1?" sfida":" sfide")+": in media le temevi "+cst.fear.toFixed(1)+
      " e sono state "+cst.real.toFixed(1)+". "+(cst.fear-cst.real>=0.8
        ? "La paura è sistematicamente più grande della cosa." : "Il divario è piccolo: prova sfide un po\u2019 più grandi."));
  }
  var scount=stormCount(30);
  if(scount>=2) out.push(scount+" volte nell\u2019ultimo mese hai tenuto il terreno con la potenza a 7 o più. Sono quelle che insegnano qualcosa al sistema d\u2019allarme.");
  var lateCh=pendingChals().filter(function(o){ return o.x.due<todayISO(); });
  if(lateCh.length) out.push("La sfida «"+lateCh[0].x.what.slice(0,44)+(lateCh[0].x.what.length>44?"…":"")+"» è scaduta il "+fmtDate(lateCh[0].x.due)+". Rimpicciolirla è meglio che rimandarla.");
  var dorms=living().filter(isDormant);
  if(dorms.length) out.push(dorms.length===1
    ? "«"+dorms[0].name+"» dorme da "+dormantDays(dorms[0])+" giorni: o il rito, o un altro mese di prova."
    : dorms.length+" creature dormono da oltre due mesi: il Registro le tiene, ma forse è ora del rito.");
  var rum=topRumination();
  if(rum) out.push("Hai interrogato "+rum.n+" volte lo stesso pensiero («"+rum.t.slice(0,44)+(rum.t.length>44?"…":"")+"»). A quel punto non è più esame di realtà: è rassicurazione.");
  if(all.length){
    var gap=daysBetween(all[0].e.date, todayISO());
    if(gap>=5) out.push("L’ultima voce risale a "+gap+" giorni fa: il bestiario è fermo.");
  }
  /* giorno della settimana peggiore */
  if(all.length>=8){
    var wd=[0,0,0,0,0,0,0], wn=[0,0,0,0,0,0,0];
    all.forEach(function(x){ var d=new Date(x.e.date+"T12:00:00").getDay(); wd[d]+=x.e.intensity; wn[d]++; });
    var bi=-1,bv=-1,tot=0,totn=0;
    for(var i=0;i<7;i++){ tot+=wd[i]; totn+=wn[i]; if(wn[i]>=2&&wd[i]/wn[i]>bv){ bv=wd[i]/wn[i]; bi=i; } }
    var avg=totn?tot/totn:0;
    if(bi>=0&&bv-avg>=1) out.push("Le creature sono più forti di "+GIORNI[bi]+": in media "+bv.toFixed(1)+" contro "+avg.toFixed(1)+" degli altri giorni.");
  }
  /* andamento 30 giorni */
  var now=Date.now(), a1=0,n1=0,a2=0,n2=0;
  all.forEach(function(x){
    var age=daysBetween(x.e.date, todayISO());
    if(age<=30){ a1+=x.e.intensity; n1++; } else if(age<=60){ a2+=x.e.intensity; n2++; }
  });
  if(n1>=3&&n2>=3){
    var d1=a1/n1, d2=a2/n2, diff=d1-d2;
    if(Math.abs(diff)>=0.6) out.push("Nell’ultimo mese la potenza media è "+(diff<0?"scesa":"salita")+" da "+d2.toFixed(1)+" a "+d1.toFixed(1)+".");
  }
  /* dominio che cresce */
  var byReg={};
  living().forEach(function(c){
    var r=c.region; if(!byReg[r]) byReg[r]={n:0,pw:0};
    byReg[r].n++; byReg[r].pw+=lastIntensity(c);
  });
  var top=null;
  Object.keys(byReg).forEach(function(k){ if(!top||byReg[k].pw>byReg[top].pw) top=k; });
  if(top&&byReg[top].n>=2) out.push("Il dominio più pesante è "+regionOf(top).name+": "+byReg[top].n+" creature per "+byReg[top].pw+" di potenza.");
  /* rituale migliore */
  var rs=ritualStats().filter(function(r){ return r.n>=3; });
  if(rs.length&&rs[0].score/rs[0].n>=0.6) out.push("Il rituale che regge meglio è «"+rs[0].label+"»: "+rs[0].good+" volte su "+rs[0].n+".");
  /* creatura dormiente */
  var sleepy=living().filter(function(c){
    if(isDormant(c)) return false;
    var last=(c.entries&&c.entries.length)?c.entries[c.entries.length-1].date:c.born;
    return daysBetween(last,todayISO())>=21;
  });
  if(sleepy.length) out.push(sleepy.length===1
    ? "«"+sleepy[0].name+"» non si fa vedere da tre settimane: forse è pronta al rito."
    : sleepy.length+" creature non si fanno vedere da tre settimane: forse sono pronte al rito.");
  if(!out.length) out.push("Nessuno schema evidente, per ora. Va bene così.");
  return out;
}

/* ===================== registro ===================== */
function heatColor(avg){
  if(avg==null) return "rgba(44,31,18,.07)";
  var t=clamp((avg-1)/9,0,1);
  var r=Math.round(226-(226-158)*t), g=Math.round(206-(206-43)*t), b=Math.round(158-(158-21)*t);
  return "rgb("+r+","+g+","+b+")";
}
var ACC_KEY="bestiario.acc.v1";
var accOpen=null;
function accState(){
  if(accOpen) return accOpen;
  accOpen={comesiusa:0, presagi:1, parcheggiati:1, sfide:1, calendario:0, terreno:1, potenza:0,
           bilancia:0, costi:0, rituali:0, trigger:0, creature:1, relazione:0, cronaca:0, custodia:0};
  try{
    var raw=localStorage.getItem(ACC_KEY);
    if(raw){ var o=JSON.parse(raw); Object.keys(o).forEach(function(k){ accOpen[k]=o[k]?1:0; }); }
  }catch(e){}
  return accOpen;
}
function accSave(){ try{ localStorage.setItem(ACC_KEY, JSON.stringify(accState())); }catch(e){} }
function sec(id, title, helpKey, body){

  return '<details class="acc" data-acc="'+id+'"'+(open?" open":"")+'>'+
    '<summary><div class="rubric"><h2>'+title+'</h2>'+(helpKey?hq(helpKey):"")+
    '<span class="caret">\u25BE</span></div></summary>'+
    '<div class="body">'+body+'</div></details>';
}

function renderRegistro(){
  var m=dayMap(), st=streakInfo(m), all=allEntries(), gt30=groundTally(30);
  var totVoci=all.length;

  /* calendario: ultime 26 settimane */
  var cells=[], today=new Date();
  var startDay=new Date(today.getTime()-(25*7+today.getDay())*86400000);
  for(var i=0;i<26*7;i++){
    var d=new Date(startDay.getTime()+i*86400000);
    if(d>today){ cells.push(null); continue; }
    var k=dISO(d), rec=m[k];
    cells.push({k:k, avg:rec?rec.sum/rec.n:null, n:rec?rec.n:0});
  }
  var calHTML='<div class="calgrid">'+cells.map(function(c2){
    if(!c2) return '<i style="background:transparent;border-color:transparent"></i>';
    return '<i title="'+c2.k+(c2.n?" · "+c2.n+" voci":"")+'" style="background:'+heatColor(c2.avg)+'"></i>';
  }).join("")+'</div>';

  /* domini */
  var reg={}; REGIONS.forEach(function(r){ reg[r.k]={n:0,pw:0,free:0}; });
  S.creatures.forEach(function(c){
    var r=reg[c.region]||reg.rimugini;
    if(c.freed) r.free++; else { r.n++; r.pw+=lastIntensity(c); }
  });
  var maxPw=1; REGIONS.forEach(function(r){ if(reg[r.k].pw>maxPw) maxPw=reg[r.k].pw; });
  var barsHTML=REGIONS.map(function(r){
    var d=reg[r.k];
    return '<div class="bar"><span>'+esc(r.name)+'</span>'+
      '<span class="n">'+d.n+" vive"+(d.free?" · "+d.free+" in cielo":"")+'</span>'+
      '<span class="track"><span class="fill" style="width:'+Math.round(d.pw/maxPw*100)+'%;background:'+
        (d.pw?"linear-gradient(90deg,#9E2B15,#C4551D)":"transparent")+'"></span></span></div>';
  }).join("");

  /* rituali */
  var rs=ritualStats().slice(0,6);
  var ritesHTML=rs.length? rs.map(function(r){
    var eff=Math.round(r.score/r.n*100);
    return '<div class="rite-row"><span class="txt">'+esc(r.label)+'</span>'+
      '<span class="sc">'+eff+'% · '+r.n+(r.n===1?" volta":" volte")+'</span>'+
      '<span class="track"><span class="fill" style="width:'+eff+'%;background:'+
      (eff>=66?"#5E7A54":(eff>=33?"#C39B3A":"#9E2B15"))+'"></span></span></div>';
  }).join("") : '<p class="note">Nessun rituale ancora annotato. Scrivi che cosa hai provato: dopo qualche volta si vede che cosa regge.</p>';

  /* trigger */
  var tw=triggerWords();
  var maxw=tw.length?tw[0].n:1;
  var cloudHTML=tw.length? '<div class="cloud">'+tw.slice(0,14).map(function(x){
    var size=Math.round(15+13*Math.sqrt(x.n/maxw));
    return '<span style="font-size:'+size+'px">'+esc(x.w)+'<small>'+x.n+'</small></span>';
  }).join("")+'</div>' : '<p class="note">Servono più voci perché le parole comincino a ripetersi.</p>';

  /* andamento */
  var wt=weeklyTrend(), pts=[], W=300, H=88, pad=8;
  var vals=wt.map(function(x){ return x.avg; });
  var any=vals.some(function(v){ return v!=null; });
  var trendHTML="";
  if(any){
    var xs=function(i){ return pad+i*(W-pad*2)/(wt.length-1); };
    var ys=function(v){ return H-pad-(v-1)/9*(H-pad*2); };
    var last=null, segs=[];
    wt.forEach(function(x,i){ if(x.avg!=null){ segs.push(xs(i)+","+ys(x.avg)); last=i; } });
    trendHTML='<svg class="trend" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+
      '<line class="gd" x1="0" y1="'+ys(5.5)+'" x2="'+W+'" y2="'+ys(5.5)+'"/>'+
      '<polyline class="ln" points="'+segs.join(" ")+'"/>'+
      wt.map(function(x,i){ return x.avg==null?"":'<circle cx="'+xs(i)+'" cy="'+ys(x.avg)+'" r="2.4" fill="#9E2B15"/>'; }).join("")+
      '</svg><div class="callegend"><span>12 settimane fa</span><span style="margin-left:auto">oggi</span></div>';
  } else trendHTML='<p class="note">Compare quando ci sono voci in più settimane.</p>';

  /* terreno: settimane a barre divergenti */
  var wg=weeklyGround();
  var maxG=1; wg.forEach(function(x){ maxG=Math.max(maxG,x.won,x.lost); });
  var anyG=wg.some(function(x){ return x.won||x.lost; });
  var groundHTML = anyG
    ? '<div class="gbars">'+wg.map(function(x){
        return '<div class="gcol" title="'+esc(x.label)+': +'+x.won+' / -'+x.lost+'">'+

/* ===================== carta della creatura ===================== */
function makeCard(c){
  if(!c) return;
  var W=900, H=1320;
  var cv=document.createElement("canvas"); cv.width=W; cv.height=H;
  var x=cv.getContext("2d");
  /* fondo pergamena */
  var img=new Image();
  img.onload=function(){
    var pat=x.createPattern(img,"repeat");
    x.fillStyle=pat; x.fillRect(0,0,W,H);
    finish();
  };
  img.onerror=function(){ x.fillStyle="#E4D3AA"; x.fillRect(0,0,W,H); finish(); };
  img.src=parchmentTile("vellum");

  function finish(){
    var R=rng(c.seed^0x1234);
    /* bordo */
    x.strokeStyle="#3B2917"; x.lineWidth=6; x.strokeRect(26,26,W-52,H-52);
    x.lineWidth=1.5; x.strokeRect(42,42,W-84,H-84);
    /* angoli */
    [[42,42,1,1],[W-42,42,-1,1],[42,H-42,1,-1],[W-42,H-42,-1,-1]].forEach(function(cn){
      x.beginPath();
      x.moveTo(cn[0]+cn[2]*46,cn[1]);
      x.quadraticCurveTo(cn[0]+cn[2]*16,cn[1]+cn[3]*16, cn[0],cn[1]+cn[3]*46);
      x.strokeStyle="#9E2B15"; x.lineWidth=2.4; x.stroke();
    });
    /* titolo */
    x.textAlign="center";
    x.fillStyle="#9E2B15";
    x.font='600 26px "EB Garamond", Georgia, serif';
    var kind=c.freed?"LIBERATA":(c.kind==="dievas"?"DIEVAS · ANSIA":"DEMONE · PAURA");
    x.fillText(kind.split("").join(" "), W/2, 120);
    x.fillStyle="#2C1F12";
    x.font='400 68px "UnifrakturMaguntia", "Grenze Gotisch", serif';
    var nm=(c.freed&&c.freed.newName)?c.freed.newName:c.name;
    x.fillText(nm, W/2, 200);
    /* ritratto */
    x.save(); x.translate(W/2, 470);
    drawGrotesque(x, 205, c, c.freed?"pale":null);
    x.restore();
    /* dati */
    var y=780;
    x.textAlign="center"; x.fillStyle="#5A4630";
    x.font='italic 400 30px "EB Garamond", Georgia, serif';
    if(c.epithet) y=wrapText(x, c.epithet, W/2, y, W-200, 38);
    y+=26;
    x.strokeStyle="rgba(44,31,18,.35)"; x.lineWidth=1;
    x.beginPath(); x.moveTo(180,y); x.lineTo(W-180,y); x.stroke();
    y+=48;
    x.fillStyle="#2C1F12"; x.font='400 28px "EB Garamond", Georgia, serif';
    var rows=[
      ["Dominio", regionOf(c.region).name],
      ["Evocata", fmtLong(c.born)],
      [c.freed?"Liberata":"Potenza", c.freed?fmtLong(c.freed.date):String(lastIntensity(c))+" su 10"],
      ["Voci di diario", String((c.entries||[]).length)]
    ];
    rows.forEach(function(r){
      x.textAlign="right"; x.fillStyle="#8A755A";
      x.font='600 20px "EB Garamond", Georgia, serif';
      x.fillText(r[0].toUpperCase(), W/2-24, y);
      x.textAlign="left"; x.fillStyle="#2C1F12";
      x.font='400 28px "EB Garamond", Georgia, serif';
      x.fillText(r[1], W/2+24, y);
      y+=48;
    });
    if(c.freed&&c.freed.epitaph){
      y+=18; x.textAlign="center"; x.fillStyle="#8A6A16";
      x.font='italic 400 30px "EB Garamond", Georgia, serif';
      y=wrapText(x, "“"+c.freed.epitaph+"”", W/2, y, W-220, 40);
    }
    /* piè di pagina */
    x.textAlign="center"; x.fillStyle="#8A755A";
    x.font='600 19px "EB Garamond", Georgia, serif';
    x.fillText("B E S T I A R I O   D E L L ’ A B I S S O", W/2, H-80);
    showCard(cv, c);
  }
}
function wrapText(x, text, cx, y, maxW, lh){
  var words=String(text).split(/\s+/), line="", i;
  for(i=0;i<words.length;i++){
    var t=line?line+" "+words[i]:words[i];
    if(x.measureText(t).width>maxW && line){ x.fillText(line,cx,y); y+=lh; line=words[i]; }
    else line=t;
  }
  if(line){ x.fillText(line,cx,y); y+=lh; }
  return y;
}
function showCard(cv, c){
  var url=cv.toDataURL("image/png");
  sheet('<h2>Carta della creatura</h2>',
    '<img src="'+url+'" alt="Carta di '+esc(c.name)+'" style="width:100%;border:1px solid rgba(44,31,18,.35)">'+
    '<div class="btnrow"><button class="btn primary" id="cd-save">Salvare l’immagine</button></div>'+
    '<p class="note">Se il salvataggio non è disponibile, tieni premuto sull’immagine per salvarla.</p>',
    function(sh){
      sh.querySelector("#cd-save").onclick=function(){
        var name=(c.name||"creatura").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")+".png";
        cv.toBlob(function(blob){
          if(!blob){ toast("Immagine non generata."); return; }
          if(downloadBlob(blob, name)) toast("Carta scaricata.");
          else toast("Tieni premuto sull’immagine per salvarla.");
        },"image/png");
      };
    });
}

}

function reportData(){
  var days=56, since=new Date(Date.now()-days*86400000);
  var sinceISO=dISO(since);
  var rows=[], won=0, lost=0, half=0, sumInt=0, nInt=0;
  S.creatures.forEach(function(c){
    var es=(c.entries||[]).filter(function(e){ return String(e.date).slice(0,10)>=sinceISO; });
    if(!es.length && c.freed && String(c.freed.date).slice(0,10)<sinceISO) return;
    var w=0,l=0,h=0,si=0;
    es.forEach(function(e){
      si+=e.intensity; sumInt+=e.intensity; nInt++;
      if(gOf(e)===null) return;
      if(e.ground>0){ w++; won++; } else if(e.ground<0){ l++; lost++; } else { h++; half++; }
    });
    rows.push({c:c, n:es.length, won:w, lost:l, half:h,
      avg: es.length? si/es.length : null,
      grip: gripOf(c), last: es.length? es[es.length-1].date : null});
  });
  rows.sort(function(a,b){ return (b.grip||0)-(a.grip||0); });
  /* confronto fra i due mesi */
  var a1=0,n1=0,a2=0,n2=0,g1=0,gc1=0,g2=0,gc2=0;
  S.creatures.forEach(function(c){ (c.entries||[]).forEach(function(e){
    var age=daysBetween(e.date,todayISO());
    if(age<=28){ a1+=e.intensity; n1++; if(gOf(e)!==null){ g1+=e.ground; gc1++; } }
    else if(age<=56){ a2+=e.intensity; n2++; if(gOf(e)!==null){ g2+=e.ground; gc2++; } }
  }); });
  return {
    sinceISO:sinceISO, rows:rows, won:won, lost:lost, half:half,
    avgInt: nInt? sumInt/nInt : null, voci:nInt,
    recent:{int:n1?a1/n1:null, ground:gc1?g1/gc1:null},
    older:{int:n2?a2/n2:null, ground:gc2?g2/gc2:null},
    weeks: weeklyGround().slice(2)
  };
}

function reportInner(){
  var d=reportData(), rs=ritualStats().slice(0,5), tw=triggerWords().slice(0,10);
  var out="";
  out+='<p class="note">Dal '+fmtLong(d.sinceISO)+' al '+fmtLong(todayISO())+' \u00b7 '+d.voci+' voci di diario.</p>';
  out+='<div class="tally">'+
    '<div><b>'+living().length+'</b><span>vive</span></div>'+
    '<div><b>'+freedOnes().length+'</b><span>liberate</span></div>'+

    '<div><b class="lose">\u2212'+d.lost+'</b><span>ceduto</span></div>'+
  '</div>';

  var verdetto;
  if(d.recent.ground==null||d.older.ground==null){
    verdetto="Non ci sono ancora due mesi pieni di terreno da confrontare.";
  } else {
    var diff=d.recent.ground-d.older.ground;
    verdetto = Math.abs(diff)<0.15
      ? "Nel secondo mese il terreno \u00e8 rimasto uguale al primo."
      : (diff>0
        ? "Nel secondo mese hai tenuto il terreno pi\u00f9 spesso che nel primo: la presa complessiva sta calando."
        : "Nel secondo mese hai ceduto pi\u00f9 terreno del primo: qualcosa ha ripreso spazio.");
    if(d.recent.int!=null&&d.older.int!=null){
      var di=d.recent.int-d.older.int;
      verdetto += " La potenza media \u00e8 passata da "+d.older.int.toFixed(1)+" a "+d.recent.int.toFixed(1)+
        (Math.abs(di)<0.4? " (praticamente ferma)." : ".");
    }
  }
  out+='<div class="rubric"><h2>In breve</h2></div><p class="prose">'+verdetto+'</p>';

  out+='<div class="rubric"><h2>Le creature</h2></div><div class="wrapx"><table class="rtable">'+
    '<thead><tr><th>Creatura</th><th class="n">Presa</th><th class="n">Potenza</th><th class="n">Voci</th><th class="n">Terreno</th></tr></thead><tbody>';
  if(!d.rows.length) out+='<tr><td colspan="5">Nessuna voce in questo periodo.</td></tr>';

    out+='<tr><td><span class="nm">'+esc(r.c.freed&&r.c.freed.newName?r.c.freed.newName:r.c.name)+'</span><br>'+
      '<span style="font-size:12.5px;color:var(--ink3)">'+(r.c.freed?"liberata \u00b7 ":"")+
      (r.c.kind==="dievas"?"dievas":"demone")+' \u00b7 '+esc(regionOf(r.c.region).name)+'</span></td>'+
      '<td class="n">'+(r.grip==null?"\u2014":r.grip)+'</td>'+
      '<td class="n">'+(r.avg==null?"\u2014":r.avg.toFixed(1))+'</td>'+
      '<td class="n">'+r.n+'</td>'+
      '<td class="n"><span class="win">+'+r.won+'</span> <span class="lose">\u2212'+r.lost+'</span></td></tr>';
  });
  out+='</tbody></table></div>';

  out+='<div class="rubric"><h2>Settimana per settimana</h2></div><div class="wrapx"><table class="rtable">'+
    '<thead><tr><th>Settimana</th><th class="n">Tenuto</th><th class="n">Ceduto</th><th>Bilancia</th></tr></thead><tbody>';
  d.weeks.forEach(function(wk){
    var bar="";
    for(var i=0;i<wk.won;i++) bar+='<span class="win">\u25B2</span>';
    for(var j=0;j<wk.lost;j++) bar+='<span class="lose">\u25BC</span>';
    out+='<tr><td>'+esc(wk.label)+'</td><td class="n">'+wk.won+'</td><td class="n">'+wk.lost+'</td><td>'+(bar||"\u2014")+'</td></tr>';
  });
  out+='</tbody></table></div>';

  out+='<div class="rubric"><h2>Che cosa ha retto</h2></div>';
  if(rs.length){
    out+='<div class="wrapx"><table class="rtable"><thead><tr><th>Rituale</th><th class="n">Volte</th><th class="n">Efficacia</th></tr></thead><tbody>';
    rs.forEach(function(r){
      out+='<tr><td>'+esc(r.label)+'</td><td class="n">'+r.n+'</td><td class="n">'+Math.round(r.score/r.n*100)+'%</td></tr>';
    });
    out+='</tbody></table></div>';
  } else out+='<p class="note">Nessun rituale annotato in questo periodo.</p>';

  out+='<div class="rubric"><h2>Parole che tornano</h2></div>';
  out+= tw.length
    ? '<p class="prose">'+tw.map(function(x){ return esc(x.w)+" ("+x.n+")"; }).join(" \u00b7 ")+'</p>'
    : '<p class="note">Ancora poche ripetizioni.</p>';
  return out;
}

var INTRO_KEY="bestiario.intro.v1";
function introSeen(){ try{ return localStorage.getItem(INTRO_KEY)==="1"; }catch(e){ return true; } }
function markIntro(){ try{ localStorage.setItem(INTRO_KEY,"1"); }catch(e){} }
function showIntro(){
  var app=document.querySelector(".app"); if(!app) return;
  var steps=[
    {t:"Due nature", k:"dievas", seed:8123,
     d:"Le <b>ansie</b> qui si chiamano <b>dievas</b>, le <b>paure</b> <b>demoni</b>. Dai un nome a quello che ti stringe e prende corpo: una bestia disegnata dal nome stesso, che va ad abitare uno dei sei domini dell’Inferno."},
    {t:"Perché nominarla", k:"demone", seed:41991,
     d:"Finché è «l’ansia», sei tu. Quando ha un nome, una faccia e un territorio, diventa <b>una cosa che ogni tanto arriva</b> — e su una cosa esterna si può tenere il conto. È tutto qui il trucco."},
    {t:"Ogni sera, due tocchi", k:"dievas", seed:70211,
     d:"Il gesto quotidiano è corto: apri la creatura che si è fatta viva e usa la <b>voce rapida</b>. Quanto forte l’hai sentita, e poi la domanda che conta. Trenta secondi. Se una bestia non si è vista, non segnare niente."},
    {t:"La domanda che conta", k:"demone", seed:33517,
     d:"<b>Oggi ha deciso lei che cosa facevi?</b> Se hai fatto la cosa lo stesso, hai <b>tenuto il terreno</b>. Se hai evitato qualcosa, gliel’hai <b>ceduto</b>. È questo — non quanto forte la senti — che dice se sta perdendo forza: da qui nasce la <b>presa</b>, da 1 a 10, che governa quanto è grande sulla mappa."},
    {t:"Quando raccontare", k:"dievas", seed:59003,
     d:"Una o due volte a settimana, quando succede qualcosa che vale il racconto, scrivi la <b>voce lunga</b>: cosa è accaduto, la frase esatta che ti ha detto in testa, come l’hai smontata, che rituale hai provato e se ha retto. A freddo, la sera: scrivere durante il picco la alimenta."},
    {t:"Le tre ante", k:"demone", seed:11777,
     d:"A destra l’<b>Inferno</b>, dove vivono. Al centro il <b>Registro</b>, che tiene i conti e ti dice cosa vede. A sinistra il <b>Paradiso</b>: quando una creatura non decide più che cosa fai, il <b>rito</b> la manda là — col diario intatto, e con la possibilità di riportarla giù."}
  ];
  var i=0;
  var ov=document.createElement("div");
  ov.className="intro";
  app.appendChild(ov);
  function draw(){
    var st=steps[i];
    ov.innerHTML='<div class="step"><canvas width="300" height="300"></canvas>'+
      '<h2>'+st.t+'</h2><p>'+st.d+'</p></div>'+
      '<div class="dots">'+steps.map(function(x,j){ return '<i class="'+(j===i?"on":"")+'"></i>'; }).join("")+'</div>'+
      '<div class="nav">'+(i>0?'<button class="ghost" data-back>Indietro</button>':'<button class="ghost" data-skip>Salta</button>')+
      '<button data-next>'+(i===steps.length-1?(living().length?"Comincia":"Evoca la prima"):"Avanti")+'</button></div>';
    var cv=ov.querySelector("canvas");
    var dpr=Math.min(window.devicePixelRatio||1,2);
    cv.width=150*dpr; cv.height=150*dpr; cv.style.width="150px"; cv.style.height="150px";
    var cc=cv.getContext("2d"); cc.setTransform(dpr,0,0,dpr,0,0);
    cc.translate(75,66);
    drawGrotesque(cc, 44, {id:"i"+i, kind:st.k, seed:st.seed, entries:[], intensity:6}, null);
    var b=ov.querySelector("[data-back]"), sk=ov.querySelector("[data-skip]");
    if(b) b.onclick=function(){ i--; draw(); };
    if(sk) sk.onclick=function(){ markIntro(); ov.remove(); };
    ov.querySelector("[data-next]").onclick=function(){
      if(i===steps.length-1){
        markIntro(); ov.remove();
        if(!living().length){ view="inferno"; render(); setTimeout(function(){ openForm(null); }, 250); }
      }
      else { i++; draw(); }
    };
  }
  draw();
}


/* ===================== download nel browser ===================== */
function downloadBlob(blob, filename){
  try{
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    a.href=url; a.download=filename; a.rel="noopener";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ try{ URL.revokeObjectURL(url); a.remove(); }catch(e){} }, 1500);
    return true;
  }catch(e){ return false; }
}

/* ===================== custodia ===================== */
function stateJSON(){ return JSON.stringify(S).replace(/</g,"\\u003c"); }
function buildDocument(){
  var style=el("app-style").textContent;
  var open="<scr"+"ipt", close="</scr"+"ipt>";
  var blocks="";
  ["app-lang","app-code-it","app-code-en","app-code"].forEach(function(id){
    var e=el(id);
    if(e) blocks+=open+' id="'+id+'">'+e.textContent+close;
  });
  return '<!doctype html><html lang="'+(window.__LANG==="en"?"en":"it")+'"><head><meta charset="utf-8">'+
    '<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">'+

}
function sealVolume(){
  var doc=buildDocument();
  var ok=downloadBlob(new Blob([doc],{type:"text/html"}), "bestiario-"+todayISO()+".html");
  toast(ok
    ? "Copia scaricata: è l'app intera con dentro le tue creature. Si apre anche senza rete."
    : "Download non riuscito. Usa l'esportazione del backup.");
}
function exportBackup(){
  var name="bestiario-"+todayISO()+".json", data=JSON.stringify(S,null,2);
  if(downloadBlob(new Blob([data],{type:"application/json"}), name)) toast("Backup scaricato.");
  else showRaw(data);
}
function showRaw(data){
  sheet('<h2>Backup</h2>',
    '<p class="note">Il download non è disponibile qui. Copia questo testo e conservalo.</p>'+
    '<textarea id="bk" rows="12" readonly style="font-size:12px">'+esc(data)+'</textarea>'+
    '<div class="btnrow"><button class="btn primary" id="bk-copy">Copiare tutto</button></div>',
    function(sh){
      sh.querySelector("#bk-copy").onclick=function(){
        var ta=sh.querySelector("#bk"); ta.select();
        try{ document.execCommand("copy"); toast("Copiato."); }catch(e){ toast("Copia manualmente."); }
      };
    });
}
function importBackup(){
  var inp=document.createElement("input");
  inp.type="file"; inp.accept="application/json,.json";
  inp.onchange=function(){
    var f=inp.files&&inp.files[0]; if(!f) return;
    var fr=new FileReader();
    fr.onload=function(){
      try{
        var d=JSON.parse(fr.result);
        if(!d||!Array.isArray(d.creatures)) throw new Error("formato");
        confirmSheet("Importare "+d.creatures.length+" creature?","I dati attuali di questo dispositivo verranno sostituiti.","Importa",function(){
          S={v:1,creatures:d.creatures,parked:d.parked||[],updated:d.updated||null};
          clearSprites(); save(); closeSheet(); render(); toast("Bestiario importato.");
        });
      }catch(e){ toast("File non valido."); }
    };
    fr.readAsText(f);
  };
  inp.click();
}

/* ===================== avvio ===================== */
/* altezza della tastiera su iOS: la finestra visibile si accorcia, il layout no */
function watchKeyboard(){
  var vv=window.visualViewport;
  if(!vv) return;
  function upd(){
    var kb=Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
    if(kb<80) kb=0;
    document.documentElement.style.setProperty("--kb", kb+"px");
    document.body.classList.toggle("kbopen", kb>0);
  }
  vv.addEventListener("resize", upd);
  vv.addEventListener("scroll", upd);
  upd();
}
document.addEventListener("focusin", function(e){
  var t=e.target;
  if(!t||!/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
  setTimeout(function(){
    try{ t.scrollIntoView({block:"center", behavior:"smooth"}); }catch(err){}
  }, 340);
});
function refit(){
  if(!pcv||view==="registro") return;
  var s=setupCanvas(pcv); pctx=s.ctx; bake=null; redraw();
}
window.addEventListener("resize", refit);
window.addEventListener("orientationchange", function(){ setTimeout(refit,250); });
if(window.visualViewport) window.visualViewport.addEventListener("resize", refit);
watchKeyboard();
document.addEventListener("keydown", function(e){ if(e.key==="Escape") closeSheet(); });

try{ document.title=TITLE; }catch(e){}
loadState();
render();
if(declutter()) save();
if(!introSeen()) setTimeout(showIntro, 350);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){ bake=null; redraw(); });
})();

}

var HELP={
 natura:{t:"Dievas or demon?",d:"<p>A <b>dievas</b> is an anxiety: something that tightens <i>before</i>, while you wait for it to happen. A <b>demon</b> is a fear: something waiting for you, with a definite face.</p><p>The distinction isn’t clinical, it’s yours. Pick whichever sounds right: it only changes the colour of the beast.</p>"},
 nome:{t:"Why give it a name",d:"<p>Naming is the first useful act: it draws a border around what you feel and separates it from you. You aren’t anxious — <b>there’s a thing with a name</b> and every so often it arrives.</p><p>The name also generates the figure: change it and the drawn beast changes.</p>"},
 dominio:{t:"What the domain is for",d:"<p>The territory of the Inferno where it lives. It shows you <b>where the pressure comes from</b>: if over time half the bestiary ends up in the Peaks of Judgement, that’s the theme — not the individual creatures.</p><p>You can always move it by dragging it across the map.</p>"},
 trigger:{t:"What summons it",d:"<p>The situations where it turns up: places, moments, people, times of day. Precision isn’t the point — <b>recurrence</b> is.</p><p>The Ledger cross-checks these against your diary entries and shows you the words that come back most often.</p>"},
 corpo:{t:"How it touches your body",d:"<p>Where you feel it physically: breath, stomach, jaw, sleep. Good for two things: recognising it <b>before</b> it becomes a thought, and noticing that the body settles even while the head keeps going.</p>"},
 presa:{t:"The grip",d:"<p>How much this creature <b>decides on your behalf</b>, from 1 to 10. It’s computed from the last ten entries: give it ground and it climbs, do things anyway and it falls.</p><p>It’s the measure that governs the creature’s size on the map, and the one that tells you when the rite of release makes sense. It appears after the first few entries.</p>"},
 potenza:{t:"Power",d:"<p>How strongly you felt it, from 1 to 10. It’s useful for spotting the spikes and seeing whether they soften over time.</p><p>But it <b>isn’t the goal</b>: you can feel it at full blast and still give it nothing. That’s why it’s the secondary measure here — anxiety doesn’t take orders, behaviour does.</p>"},
 terreno:{t:"The ground",d:"<p>The question that counts: <b>did it decide what you did today?</b></p><p><b>I did it anyway</b> — you did the thing while it was there. Ground held.<br><b>Halfway</b> — you did it, but clipped or postponed.<br><b>It decided</b> — you avoided something. Ground given up.</p><p>Avoidance is anxiety’s fuel: it’s this figure, not the intensity, that tells you whether a creature is losing its force.</p>"},
 vocerapida:{t:"The quick entry",d:"<p>The daily gesture: <b>two taps, in the evening</b>. First how strongly, then whether it decided.</p><p>If you’ve already marked today, the second tap <b>corrects</b> that entry instead of adding a new one: one a day is plenty.</p>"},
 diario:{t:"The long entry",d:"<p>Use it when something happened that’s worth telling: a strong appearance, an avoidance that stings, or something you did and didn’t think you could.</p><p><b>Once or twice a week</b> is the right pace. Every day turns into written rumination.</p><p>Write it <b>cold, in the evening</b>: taking notes during the spike feeds the beast instead of watching it.</p>"},
 cbt:{t:"Questioning the beast",d:"<p>Take the exact sentence it said in your head and put it on trial: what really supports it, what contradicts it, how it reads rewritten honestly.</p><p>It works <b>once</b>. If you take the same thought apart every day it stops being reality testing and becomes compulsive reassurance — and the app will say so.</p>"},
 rituale:{t:"The ritual",d:"<p>What you did to get through it — breathing, going out, calling someone, doing it anyway — and whether it held.</p><p>After a few weeks the Ledger ranks your rituals by real effectiveness: you find out which ones work and which ones you were telling yourself about.</p>"},
 rito:{t:"The rite of release",d:"<p>You perform it when the creature <b>no longer decides what you do</b> — not when you stop feeling it: that condition may never arrive.</p><p>You can release a beast you still feel strongly, as long as you’ve stopped giving it ground. It isn’t deleted: it rises into Paradise with its whole diary, and you can bring it back down if it returns.</p>"},
 presagi:{t:"The omens",d:"<p>Patterns the app spots on its own in your data: the worst day of the week, the heaviest domain, the ritual that holds, a thought taken apart too many times, a creature asleep for three weeks.</p><p>They are observations about numbers, not diagnoses.</p>"},
 calendario:{t:"The calendar",d:"<p>One square per day: it darkens where you wrote, and the colour turns red on high-intensity days.</p><p>Mostly it’s there to show the <b>gaps</b>: the stretches when you stopped looking.</p>"},
 bilancia:{t:"The balance of domains",d:"<p>How much each territory weighs: number of living creatures and total power.</p><p>If one domain dominates the bar, that’s the real theme — and it’s worth working there, rather than one beast at a time.</p>"},
 relazione:{t:"The report",d:"<p>Eight weeks condensed into a single page: ground held and given up, grip per creature, week by week, what held, which words keep coming back.</p><p>It downloads as a printable page. It’s a personal diary, not a clinical document — but it’s exactly the kind of summary that helps if one day you talk it through with a therapist.</p>"},
 costo:{t:"What it costs you",d:"<p>The areas of your life this creature gets its hands on. Every time you give it ground, the cost is charged there.</p><p>It turns a number into a reason: <b>«given up 9 times»</b> says little, <b>«it cost you three dinners, two workouts and one phone call»</b> says everything.</p>"},
 sfida:{t:"Challenges",d:"<p>Recording avoidance lets you see it. <b>Undoing it</b> is another matter: pick something the creature made you avoid, set a date for doing it, and declare up front <b>how bad you expect it to be</b>, from 1 to 10.</p><p>Afterwards you record how it went and how bad it <i>actually</i> was. Almost always the real number is lower than the feared one: that gap, repeated, is what dismantles a fear — far more than reasoning about it.</p><p>One challenge at a time, small enough that you’ll actually do it.</p>"},
 tempesta:{t:"Ground under storm",d:"<p>Having done the thing on a day you felt it at <b>7 or more</b>. It counts double: going when it’s quiet teaches the alarm system nothing, going when it’s screaming does.</p><p>In the row of tiles you’ll find those in gold.</p>"},
 dormiente:{t:"Sleeping creatures",d:"<p>A creature that hasn’t shown up for two months isn’t an active problem any more: it’s a memory taking up room on the map.</p><p>Carrying twelve of them forever starts to look like an identity. If one sleeps, either you release it or you give it another month — the app won’t decide for you, but it will ask.</p>"},
 notte:{t:"Night mode",d:"<p>This is for when it’s happening <b>right now</b> — at night, or in the middle of a spike. In that moment, rating the intensity or dismantling the thought doesn’t help: it feeds it.</p><p>So the app asks you nothing. Write one line, it keeps it and hands it back the next evening, when you can look at it cold. Postponing rumination to a set window is one of the few things that genuinely works on night-time thinking.</p>"},
 custodia:{t:"Keeping the tome",d:"<p>The data lives only in this browser: nobody sees it, but nobody backs it up for you either.</p><p><b>Download the tome</b> and you get an HTML file containing the app and your creatures together: it opens on its own, even offline. Do it every so often.</p>"}

function loadState(){

  try{ var ls=localStorage.getItem(KEY); if(ls) local=JSON.parse(ls); }catch(e){}

  } else if(local&&local.creatures&&local.creatures.length) pick=local;

function byId(id){ for(var i=0;i<S.creatures.length;i++) if(S.creatures[i].id===id) return S.creatures[i]; return null; }

function lastIntensity(c){ return (c.entries&&c.entries.length)? c.entries[c.entries.length-1].intensity : c.intensity; }
function trendOf(c){
  var e=(c.entries||[]).map(function(x){ return x.intensity; });
  if(e.length<2) return 0;
  var n=Math.min(3,Math.floor(e.length/2))||1;
  var f=e.slice(0,n).reduce(function(a,b){return a+b;},0)/n;
  var l=e.slice(-n).reduce(function(a,b){return a+b;},0)/n;
  return l-f;
}
function gOf(e){ return (e&&(e.ground===-1||e.ground===0||e.ground===1))?e.ground:null; }
function groundEntries(c){ return (c.entries||[]).filter(function(e){ return gOf(e)!==null; }); }
function gripOf(c){
  var e=groundEntries(c).slice(-10);
  if(!e.length) return null;
  /* con poche voci la stima resta prudente: le mancanti contano come neutre */
  var sum=e.reduce(function(a,b){ return a+b.ground; },0);
  var den=Math.max(e.length,3);
  return clamp(Math.round(5.5-4.5*(sum/den)),1,10);

function gripOrPower(c){ var g=gripOf(c); return g==null? lastIntensity(c) : g; }
function todayEntry(c){
  var t=todayISO(), es=c.entries||[];

function groundTally(days){

  S.creatures.forEach(function(c){ (c.entries||[]).forEach(function(e){
    if(gOf(e)===null) return;
    if(daysBetween(e.date,todayISO())>days) return;

}
function weeklyGround(){
  var out=[], now=new Date();
  for(var wk=9;wk>=0;wk--){
    var end=new Date(now.getTime()-wk*7*86400000), start=new Date(end.getTime()-6*86400000);
    var won=0, lost=0;
    S.creatures.forEach(function(c){ (c.entries||[]).forEach(function(e){
      if(gOf(e)===null) return;
      var d=new Date(String(e.date).slice(0,10)+"T12:00:00");
      if(d>=start&&d<=end){ if(e.ground>0) won++; else if(e.ground<0) lost++; }
    }); });

function sameThought(c, thought, days){

  (c.entries||[]).forEach(function(e){
    if(daysBetween(e.date,todayISO())>days) return;
    var t=e.cbt&&e.cbt.thought?e.cbt.thought.trim().toLowerCase().slice(0,30):"";
    if(t===k) n++;

  return n;
}
function topRumination(){

  var m={};

    var areas=(c.cost&&c.cost.length)?c.cost:[];

    (c.entries||[]).forEach(function(e){

var tiles={};
function parchmentTile(kind){
  if(tiles[kind]) return tiles[kind];
  var n=200, cv=document.createElement("canvas"); cv.width=n; cv.height=n;
  var c=cv.getContext("2d"), R=rng(kind==="wood"?881:552);
  var base = kind==="wood" ? "#3B2917" : "#E4D3AA";
  c.fillStyle=base; c.fillRect(0,0,n,n);
  var i;
  for(i=0;i<2600;i++){
    var v=R();
    c.fillStyle = kind==="wood"
      ? "rgba("+(v<.5?"20,12,6":"96,72,44")+","+(0.05+R()*0.12).toFixed(3)+")"
      : "rgba("+(v<.5?"120,96,58":"255,250,232")+","+(0.05+R()*0.16).toFixed(3)+")";
    c.fillRect(R()*n, R()*n, 1+ (R()<.15?1:0), 1);
  }
  for(i=0;i<12;i++){
    var y=R()*n;
    c.strokeStyle = kind==="wood" ? "rgba(20,12,6,.16)" : "rgba(140,112,68,.07)";
    c.lineWidth=0.6+R()*1.4;
    c.beginPath(); c.moveTo(0,y);
    for(var x=0;x<=n;x+=10) c.lineTo(x, y+Math.sin(x*0.05+i)*(kind==="wood"?2:5));
    c.stroke();
  }
  for(i=0;i<7;i++){
    var sx=R()*n, sy=R()*n, sr=12+R()*40;
    var g=c.createRadialGradient(sx,sy,0,sx,sy,sr);
    g.addColorStop(0, kind==="wood"?"rgba(18,10,4,.18)":"rgba(158,120,64,.10)");
    g.addColorStop(1,"rgba(0,0,0,0)");
    c.fillStyle=g; c.beginPath(); c.arc(sx,sy,sr,0,6.283); c.fill();
  }
  tiles[kind]=cv.toDataURL("image/png");
  return tiles[kind];
}
function applyTextures(){

    n.style.backgroundImage="url("+url+")";
  });
  document.querySelectorAll(".panelhead,.hinges").forEach(function(n){
    n.style.backgroundImage="url("+parchmentTile("wood")+")";
    n.style.backgroundBlendMode="multiply";
  });
}

/* ===================== grotteschi ===================== */
var PAL = {
  dievas:{ wash:["#6E8A62","#4A6D8C","#8FA07E","#5E7A54"], accent:"#3D5D84" },
  demone:{ wash:["#A8431F","#C4551D","#8A5A22","#7A3418"], accent:"#9E2B15" }
};
function genome(cr){
  var R=rng(cr.seed);
  return {
    body:Math.floor(R()*6), head:Math.floor(R()*6), legs:Math.floor(R()*5),
    arms:Math.floor(R()*6), tail:Math.floor(R()*4), obj:Math.floor(R()*7),
    eyes:(function(){ var e=1; if(R()<0.34) e=2; if(R()<0.10) e=3; return e; })(), tilt:(R()-0.5)*0.24,
    wash:Math.floor(R()*4), flip:R()<0.5, jit:R()*1000
  };
}
/* traccia a mano libera: tremolio deterministico + curva morbida */
function jit(pts,R,amp){
  return pts.map(function(p){ return [p[0]+(R()-.5)*amp*2, p[1]+(R()-.5)*amp*2]; });
}
function smoothPath(c, pts, close){
  var n=pts.length;
  c.beginPath();
  if(n<3){ c.moveTo(pts[0][0],pts[0][1]); for(var k=1;k<n;k++) c.lineTo(pts[k][0],pts[k][1]); return; }
  function mid(a,b){ return [(a[0]+b[0])/2,(a[1]+b[1])/2]; }
  var start = close ? mid(pts[n-1],pts[0]) : pts[0];
  c.moveTo(start[0],start[1]);
  var last = close ? n : n-1;
  for(var i=0;i<last;i++){
    var cur=pts[i%n], nxt=pts[(i+1)%n], m=mid(cur,nxt);
    c.quadraticCurveTo(cur[0],cur[1],m[0],m[1]);
  }
  if(!close) c.lineTo(pts[n-1][0],pts[n-1][1]); else c.closePath();
}
function ellipsePts(cx,cy,rx,ry,n,phase){
  var pts=[];
  for(var i=0;i<=n;i++){ var a=phase+i/n*6.283; pts.push([cx+Math.cos(a)*rx, cy+Math.sin(a)*ry]); }
  return pts;
}
function paint(c, pts, R, fill, ink, amp, lw, bone){
  /* preparazione chiara, velatura fuori registro, poi tratto */
  var jp=jit(pts,R,amp);
  smoothPath(c,jp,true); c.fillStyle=bone||"#EBE1C4"; c.fill();
  c.save();
  c.translate((R()-.5)*amp*0.9,(R()-.5)*amp*0.9);
  smoothPath(c,jp,true); c.globalAlpha=.82; c.fillStyle=fill; c.fill();
  c.restore();
  smoothPath(c,jp,true); c.strokeStyle=ink; c.lineWidth=lw; c.stroke();
}
function hatch(c, x, y, w2, hgt, R, ink, n, lw){
  c.save(); c.strokeStyle=ink; c.lineWidth=lw||0.7; c.globalAlpha=.34;
  for(var i=0;i<n;i++){
    var t=i/(n-1||1), yy=y+t*hgt, bow=Math.sin(t*3.14)*w2*0.25;
    c.beginPath();
    c.moveTo(x, yy);
    c.quadraticCurveTo(x+w2*0.5, yy+bow*0.4, x+w2*(0.6+0.4*Math.sin(t*3.14)), yy+bow*0.2);
    c.stroke();
  }
  c.restore();
}

/* disegna il grottesco entro un riquadro centrato in (0,0), unita = u */
function drawGrotesque(c, u, cr, variant){
  var g=genome(cr), R=rng(cr.seed^0x9e37);
  var pal=PAL[cr.kind==="dievas"?"dievas":"demone"];
  var wash=pal.wash[g.wash], wash2=pal.wash[(g.wash+2)%4], wash3=pal.wash[(g.wash+1)%4];
  var ink="#241809", bone="#EDE1C2";
  if(variant==="pale"){ wash="#CFC6A6"; wash2="#DCD3B4"; wash3="#D3CAAA"; ink="#5C4E36"; bone="#F5EEDA"; }
  var amp=u*0.05, lw=Math.max(0.8,u*0.021);
  var legs=g.legs%4, armk=g.arms%6, obj=g.obj%7;

  /* ombra a terra */
  c.save();
  c.globalAlpha = variant==="pale" ? 0.10 : 0.20;
  c.beginPath(); c.ellipse(0, u*1.12, u*0.46, u*0.09, 0, 0, 6.283);
  c.fillStyle="#0A0603"; c.fill();
  c.restore();

  c.save();
  c.rotate(g.tilt);
  if(g.flip) c.scale(-1,1);

  /* ---------- ali, dietro ---------- */
  if(armk===0){
    [-1,1].forEach(function(sg){
      var pts=[[0,-u*0.15],[sg*u*0.72,-u*0.62],[sg*u*1.02,-u*0.22],[sg*u*0.86,u*0.14],[sg*u*0.52,u*0.02],[0,u*0.14]];
      paint(c,pts,R, variant==="pale"?"#CFC6A6":"#5B4128", ink, amp*0.8, lw*0.85, bone);
      for(var f=1;f<4;f++){
        c.beginPath(); c.moveTo(0,-u*0.08);
        c.quadraticCurveTo(sg*u*0.5,-u*(0.42-f*0.12), sg*u*(0.5+f*0.17), -u*(0.5-f*0.22));
        c.strokeStyle=ink; c.lineWidth=lw*0.6; c.globalAlpha=.7; c.stroke(); c.globalAlpha=1;
      }
    });
  } else if(armk===1){
    [-1,1].forEach(function(sg){
      for(var f=0;f<5;f++){
        var L=u*(0.52+f*0.12);
        c.save(); c.rotate(sg*(0.42+f*0.15));
        var pts=[[0,-u*0.12],[sg*L*0.55,-u*0.3],[sg*L,-u*0.06],[sg*L*0.5,u*0.04]];
        paint(c,pts,R, f%2? wash3 : bone, ink, amp*0.5, lw*0.55, bone);
        c.restore();
      }
    });
  }

  /* ---------- coda, dietro ---------- */
  if(g.tail===0){
    var t1=[[u*0.1,u*0.4],[u*0.72,u*0.6],[u*0.56,u*0.8],[u*0.9,u*0.95],[u*0.22,u*0.66]];
    paint(c,t1,R, wash3, ink, amp*0.7, lw*0.75, bone);
  } else if(g.tail===1){
    c.beginPath(); c.moveTo(u*0.2,u*0.42);
    c.bezierCurveTo(u*0.95,u*0.6, u*1.0,u*0.0, u*0.55,u*0.16);
    c.strokeStyle=ink; c.lineWidth=lw*1.1; c.stroke();
    c.beginPath(); c.arc(u*0.62,u*0.2,u*0.05,0,6.283);
    c.fillStyle=wash3; c.fill(); c.strokeStyle=ink; c.lineWidth=lw*0.6; c.stroke();
  } else if(g.tail===2){
    var t2=[[u*0.14,u*0.42],[u*0.58,u*0.55],[u*0.86,u*0.28],[u*0.5,u*0.3]];
    paint(c,t2,R, variant==="pale"?"#CFC6A6":"#5E7A54", ink, amp*0.6, lw*0.7, bone);
  }

  /* ---------- corpo ---------- */
  var bodyPts;
  if(g.body===0) bodyPts=ellipsePts(0,u*0.10,u*0.44,u*0.56,18,0.3);
  else if(g.body===1) bodyPts=[[-u*0.6,u*0.06],[-u*0.24,-u*0.28],[u*0.2,-u*0.3],[u*0.52,u*0.02],[u*0.34,u*0.44],[-u*0.2,u*0.46],[-u*0.44,u*0.3]];
  else if(g.body===2) bodyPts=[[-u*0.15,-u*0.44],[u*0.15,-u*0.44],[u*0.2,-u*0.2],[u*0.46,u*0.14],[u*0.32,u*0.52],[-u*0.32,u*0.52],[-u*0.46,u*0.14],[-u*0.2,-u*0.2]];
  else if(g.body===3) bodyPts=[[-u*0.2,-u*0.4],[u*0.2,-u*0.4],[u*0.44,u*0.1],[u*0.28,u*0.54],[-u*0.28,u*0.54],[-u*0.44,u*0.1]];
  else if(g.body===4) bodyPts=ellipsePts(0,u*0.12,u*0.52,u*0.44,20,0.9);
  else bodyPts=[[-u*0.4,-u*0.36],[u*0.4,-u*0.36],[u*0.46,u*0.16],[u*0.34,u*0.5],[-u*0.34,u*0.5],[-u*0.46,u*0.16]];
  paint(c, bodyPts, R, wash, ink, amp, lw, bone);
  if(g.body===4){
    for(var s2=0;s2<4;s2++){
      c.beginPath(); c.ellipse(0,u*0.12,u*(0.46-s2*0.1),u*(0.38-s2*0.08),0,3.5,6.05);
      c.strokeStyle=ink; c.lineWidth=lw*0.5; c.globalAlpha=.6; c.stroke(); c.globalAlpha=1;
    }
  }
  if(g.body===5){
    [-0.16,0.16].forEach(function(hy2){
      c.beginPath(); c.moveTo(-u*0.44,u*hy2); c.lineTo(u*0.44,u*hy2);
      c.strokeStyle=ink; c.lineWidth=lw*0.55; c.globalAlpha=.65; c.stroke(); c.globalAlpha=1;
    });
  }
  /* modellato */
  hatch(c, -u*0.40, -u*0.12, u*0.3, u*0.56, R, ink, 8, lw*0.5);
  c.save(); c.globalAlpha=.42;
  c.beginPath(); c.moveTo(-u*0.16,u*0.3); c.quadraticCurveTo(0,u*0.44,u*0.22,u*0.22);
  c.strokeStyle=ink; c.lineWidth=lw*0.65; c.stroke();
  c.restore();
  /* protuberanze sul dorso */
  if(g.body%2===0){
    for(var kb=0;kb<3;kb++){
      var ka=-2.55+kb*0.34;
      var kx=Math.cos(ka)*u*0.42, ky=u*0.1+Math.sin(ka)*u*0.5;
      c.beginPath(); c.arc(kx,ky,u*0.04,0,6.283);
      c.fillStyle=wash2; c.fill(); c.strokeStyle=ink; c.lineWidth=lw*0.6; c.stroke();
    }
  }

  /* ---------- zampe, davanti ---------- */
  var top=u*0.34;
  if(legs===0){ /* zampe d'uccello, lunghe */
    [-0.2,0.22].forEach(function(sx){
      var footY=u*1.12+ (sx<0?0:u*0.03);
      c.beginPath(); c.moveTo(u*sx, top);
      c.quadraticCurveTo(u*sx*1.9, u*0.75, u*sx*1.5, footY);
      c.strokeStyle=ink; c.lineWidth=lw*1.05; c.stroke();
      [-0.14,0.02,0.16].forEach(function(t){
        c.beginPath(); c.moveTo(u*sx*1.5, footY);
        c.quadraticCurveTo(u*sx*1.5+u*t*0.6, footY+u*0.05, u*sx*1.5+u*t, footY+u*0.09);
        c.lineWidth=lw*0.7; c.stroke();
      });
      c.beginPath(); c.arc(u*sx*1.75,u*0.72,u*0.028,0,6.283); c.fillStyle=ink; c.fill();
    });
  } else if(legs===1){ /* gambe umane */
    [-0.18,0.2].forEach(function(sx){
      var pts=[[u*sx-u*0.07,top],[u*sx+u*0.07,top],[u*sx*1.5+u*0.05,u*1.06],[u*sx*1.5-u*0.05,u*1.06]];
      paint(c,pts,R, wash2, ink, amp*0.35, lw*0.8, bone);
      var foot=[[u*sx*1.5-u*0.06,u*1.04],[u*sx*1.5+u*0.05,u*1.04],[u*sx*1.5+u*0.22,u*1.14],[u*sx*1.5-u*0.06,u*1.14]];
      paint(c,foot,R, bone, ink, amp*0.3, lw*0.7, bone);
    });
  } else if(legs===2){ /* trampoli */
    [-0.26,0.26].forEach(function(sx){
      c.beginPath(); c.moveTo(u*sx, top); c.lineTo(u*sx*1.15, u*1.18);
      c.strokeStyle=ink; c.lineWidth=lw*0.75; c.stroke();
      c.beginPath(); c.moveTo(u*sx*1.15-u*0.1, u*1.18); c.lineTo(u*sx*1.15+u*0.1, u*1.18); c.stroke();
      c.beginPath(); c.moveTo(u*sx, u*0.68); c.lineTo(u*sx*1.15+u*(sx<0?-0.16:0.16), u*0.62);
      c.lineWidth=lw*0.55; c.stroke();
    });
  } else { /* radici */
    for(var rr2=-1;rr2<=1;rr2++){
      c.beginPath(); c.moveTo(u*rr2*0.14, top);
      c.bezierCurveTo(u*rr2*0.5, u*0.7, u*rr2*0.44, u*0.95, u*rr2*0.66, u*1.14);
      c.strokeStyle=ink; c.lineWidth=lw*(1.1-Math.abs(rr2)*0.3); c.stroke();
    }
  }

  /* ---------- braccia, davanti ---------- */
  if(armk===2){
    [-1,1].forEach(function(sg){
      c.beginPath(); c.moveTo(sg*u*0.3,-u*0.14);
      c.bezierCurveTo(sg*u*0.86,-u*0.06, sg*u*0.92,u*0.24, sg*u*0.7,u*0.44);
      c.strokeStyle=ink; c.lineWidth=lw*1.15; c.stroke();
      for(var f2=-1;f2<=1;f2++){
        c.beginPath(); c.moveTo(sg*u*0.7,u*0.44);
        c.quadraticCurveTo(sg*u*0.72+f2*u*0.05,u*0.54, sg*u*0.68+f2*u*0.1,u*0.6);
        c.lineWidth=lw*0.65; c.stroke();
      }
    });
  } else if(armk===3){
    [-1,1].forEach(function(sg){
      c.beginPath(); c.moveTo(sg*u*0.26,-u*0.22);
      c.bezierCurveTo(sg*u*0.6,-u*0.5, sg*u*0.86,-u*0.66, sg*u*1.0,-u*0.94);
      c.strokeStyle=ink; c.lineWidth=lw*0.95; c.stroke();
      [0.35,0.62,0.85].forEach(function(t){
        var bx=sg*u*(0.26+t*0.74), by2=-u*(0.22+t*0.72);
        c.beginPath(); c.moveTo(bx,by2);
        c.lineTo(bx+sg*u*0.16, by2-u*0.14);
        c.lineWidth=lw*0.5; c.stroke();
      });
    });
  } else if(armk===4){
    [-1,1].forEach(function(sg){
      var pts=[[sg*u*0.34,-u*0.08],[sg*u*0.84,u*0.06],[sg*u*0.7,u*0.34],[sg*u*0.36,u*0.2]];
      paint(c,pts,R, wash3, ink, amp*0.6, lw*0.7, bone);
      for(var f3=1;f3<3;f3++){
        c.beginPath(); c.moveTo(sg*u*0.38,u*0.02);
        c.lineTo(sg*u*(0.5+f3*0.14), u*(0.1+f3*0.06));
        c.strokeStyle=ink; c.lineWidth=lw*0.45; c.globalAlpha=.7; c.stroke(); c.globalAlpha=1;
      }
    });
  }

  /* ---------- collo e testa ---------- */
  var hx=0, hy=-u*0.72;
  var neck=[[hx-u*0.1,hy+u*0.18],[hx+u*0.1,hy+u*0.18],[u*0.15,-u*0.26],[-u*0.15,-u*0.26]];
  paint(c, neck, R, wash2, ink, amp*0.3, lw*0.85, bone);

  if(g.head===0){
    paint(c, ellipsePts(hx,hy,u*0.24,u*0.22,12,0.5), R, wash2, ink, amp*0.6, lw, bone);
    paint(c, [[hx+u*0.16,hy-u*0.06],[hx+u*0.92,hy+u*0.08],[hx+u*0.16,hy+u*0.16]], R,
          variant==="pale"?"#DCD2B2":"#C9A448", ink, amp*0.45, lw*0.9, bone);
    c.beginPath(); c.moveTo(hx+u*0.18,hy+u*0.05); c.lineTo(hx+u*0.8,hy+u*0.09);
    c.strokeStyle=ink; c.lineWidth=lw*0.6; c.globalAlpha=.7; c.stroke(); c.globalAlpha=1;
  } else if(g.head===1){
    paint(c, ellipsePts(hx,hy,u*0.25,u*0.25,12,0.2), R, wash2, ink, amp*0.6, lw, bone);
    paint(c, [[hx-u*0.3,hy-u*0.16],[hx+u*0.3,hy-u*0.16],[hx+u*0.09,hy-u*0.86],[hx-u*0.04,hy-u*0.86]], R,
          variant==="pale"?"#D5CCAC":"#8C8A7E", ink, amp*0.5, lw*0.9, bone);
  } else if(g.head===2){
    paint(c, [[hx-u*0.26,hy+u*0.26],[hx-u*0.2,hy-u*0.36],[hx+u*0.2,hy-u*0.36],[hx+u*0.26,hy+u*0.26]], R,
          variant==="pale"?"#D2C9A8":"#6B4B2A", ink, amp*0.5, lw, bone);
    c.beginPath(); c.ellipse(hx,hy-u*0.36,u*0.21,u*0.08,0,0,6.283);
    c.fillStyle=variant==="pale"?"#EFE7CB":"#8A6538"; c.fill();
    c.strokeStyle=ink; c.lineWidth=lw*0.7; c.stroke();
    [-1,1].forEach(function(sg){
      c.beginPath(); c.moveTo(hx+sg*u*0.16,hy-u*0.3);
      c.quadraticCurveTo(hx+sg*u*0.4,hy-u*0.5, hx+sg*u*0.5,hy-u*0.72);
      c.strokeStyle=ink; c.lineWidth=lw*0.6; c.stroke();
    });
  } else if(g.head===3){
    paint(c, [[hx-u*0.28,hy+u*0.02],[hx+u*0.06,hy-u*0.3],[hx+u*0.4,hy],[hx+u*0.04,hy+u*0.28]], R, wash2, ink, amp*0.6, lw, bone);
    c.beginPath(); c.moveTo(hx-u*0.1,hy+u*0.1); c.quadraticCurveTo(hx+u*0.16,hy+u*0.18,hx+u*0.38,hy+u*0.02);
    c.strokeStyle=ink; c.lineWidth=lw*0.9; c.stroke();
    for(var tt=0;tt<4;tt++){
      var txp=hx-u*0.04+tt*u*0.1;
      c.beginPath(); c.moveTo(txp,hy+u*0.13); c.lineTo(txp+u*0.02,hy+u*0.06);
      c.lineWidth=lw*0.5; c.stroke();
    }
  } else if(g.head===4){
    paint(c, ellipsePts(hx,hy,u*0.23,u*0.25,12,0), R, wash2, ink, amp*0.6, lw, bone);
    paint(c, [[hx-u*0.32,hy+u*0.24],[hx-u*0.25,hy-u*0.3],[hx+u*0.25,hy-u*0.3],[hx+u*0.32,hy+u*0.24]], R,
          variant==="pale"?"#C8BF9F":"#4A3320", ink, amp*0.6, lw*0.85, bone);
  } else {
    paint(c, ellipsePts(hx,hy,u*0.24,u*0.22,12,0.7), R, wash2, ink, amp*0.6, lw, bone);
    c.beginPath(); c.moveTo(hx+u*0.14,hy+u*0.06);
    c.bezierCurveTo(hx+u*0.72,hy+u*0.06, hx+u*0.58,hy+u*0.62, hx+u*0.18,hy+u*0.54);
    c.strokeStyle=ink; c.lineWidth=lw*1.4; c.stroke();
    c.beginPath(); c.arc(hx+u*0.2,hy+u*0.56,u*0.05,0,6.283);
    c.fillStyle=wash3; c.fill(); c.strokeStyle=ink; c.lineWidth=lw*0.6; c.stroke();
  }

  /* occhi */
  var eyeBase = (g.head===0||g.head===3) ? hx-u*0.04 : hx;
  for(var e2=0;e2<g.eyes;e2++){
    var ex=eyeBase+(e2-(g.eyes-1)/2)*u*0.12, ey=hy-u*0.04;
    c.beginPath(); c.arc(ex,ey,u*0.04,0,6.283);
    c.fillStyle= variant==="pale" ? "#FBF6E6" : "#F6EDD6"; c.fill();
    c.strokeStyle=ink; c.lineWidth=lw*0.85; c.stroke();
    c.beginPath(); c.arc(ex+u*0.008,ey+u*0.006,u*0.016,0,6.283);
    c.fillStyle=ink; c.fill();
    c.beginPath(); c.arc(ex,ey,u*0.045,3.45,5.7);
    c.strokeStyle=ink; c.lineWidth=lw*1.05; c.stroke();
  }
  if(g.head!==0 && g.head!==3 && g.head!==5){
    c.beginPath();
    c.moveTo(hx-u*0.1, hy+u*0.11);
    c.quadraticCurveTo(hx, hy+u*0.18, hx+u*0.12, hy+u*0.1);
    c.strokeStyle=ink; c.lineWidth=lw*1.05; c.stroke();
  }

  /* ---------- oggetto ---------- */
  if(obj===0){
    c.save(); c.rotate(-0.55);
    c.beginPath(); c.moveTo(-u*0.7,-u*0.06); c.lineTo(u*0.72,u*0.14);
    c.strokeStyle=ink; c.lineWidth=lw*0.85; c.stroke();
    c.beginPath(); c.moveTo(u*0.72,u*0.14); c.lineTo(u*0.56,u*0.03); c.lineTo(u*0.58,u*0.24); c.closePath();
    c.fillStyle=ink; c.fill();
    [0,1,2].forEach(function(f){
      c.beginPath(); c.moveTo(-u*(0.7-f*0.08),-u*0.06);
      c.lineTo(-u*(0.8-f*0.08),-u*0.22); c.strokeStyle=ink; c.lineWidth=lw*0.5; c.stroke();
    });
    c.restore();
  } else if(obj===1){
    c.beginPath(); c.moveTo(u*0.26,u*0.06); c.lineTo(u*0.5,u*0.56);
    c.strokeStyle=ink; c.lineWidth=lw*0.6; c.stroke();
    c.beginPath(); c.arc(u*0.52,u*0.64,u*0.08,0,6.283);
    c.strokeStyle=ink; c.lineWidth=lw*0.75; c.stroke();
    c.beginPath(); c.moveTo(u*0.52,u*0.72); c.lineTo(u*0.52,u*0.9); c.lineTo(u*0.62,u*0.9); c.stroke();
  } else if(obj===2){
    c.save(); c.rotate(0.3);
    c.strokeStyle=ink; c.lineWidth=lw*0.55;
    c.beginPath(); c.moveTo(u*0.5,-u*0.9); c.lineTo(u*0.72,u*0.7); c.stroke();
    c.beginPath(); c.moveTo(u*0.72,-u*0.94); c.lineTo(u*0.94,u*0.66); c.stroke();
    for(var lr=0;lr<6;lr++){
      var t3=lr/5;
      c.beginPath();
      c.moveTo(u*(0.5+0.22*t3), -u*0.9+u*1.6*t3);
      c.lineTo(u*(0.72+0.22*t3), -u*0.94+u*1.6*t3);
      c.stroke();
    }
    c.restore();
  } else if(obj===3){
    c.save(); c.translate(u*0.06,-u*0.06); c.rotate(1.0);
    c.beginPath(); c.moveTo(0,0); c.lineTo(0,u*0.42);
    c.strokeStyle=ink; c.lineWidth=lw*1.1; c.stroke();
    paint(c,[[-u*0.06,-u*0.02],[u*0.06,-u*0.02],[0,-u*0.56]],R, variant==="pale"?"#DDD4B6":"#B9BDBA", ink, amp*0.35, lw*0.65, bone);
    c.restore();
  } else if(obj===4){
    c.save(); c.translate(-u*0.5,u*0.3);
    paint(c,[[-u*0.15,u*0.14],[-u*0.09,-u*0.12],[u*0.09,-u*0.12],[u*0.15,u*0.14]],R,
      variant==="pale"?"#D8CFB0":"#B08A32", ink, amp*0.4, lw*0.65, bone);
    c.beginPath(); c.arc(0,u*0.18,u*0.032,0,6.283); c.fillStyle=ink; c.fill();
    c.beginPath(); c.moveTo(0,-u*0.12); c.lineTo(u*0.16,-u*0.34);
    c.strokeStyle=ink; c.lineWidth=lw*0.55; c.stroke();
    c.restore();
  } else if(obj===5){
    c.save(); c.translate(hx, hy-u*0.3);
    paint(c,[[0,-u*0.4],[u*0.13,-u*0.1],[u*0.05,u*0.05],[-u*0.11,-u*0.05],[-u*0.05,-u*0.22]],R,
      variant==="pale"?"#E3DABA":"#D6721E", "#8A3A10", amp*0.45, lw*0.6, bone);
    c.restore();
  }

  /* ---------- piccolo parassita ---------- */
  if(g.jit>640){
    var px2=-u*0.5, py2=-u*0.34;
    c.save(); c.translate(px2,py2); c.rotate(-0.2);
    paint(c, ellipsePts(0,0,u*0.11,u*0.09,10,0.4), R, wash3, ink, amp*0.3, lw*0.6, bone);
    paint(c, ellipsePts(u*0.02,-u*0.13,u*0.055,u*0.055,8,0), R, wash2, ink, amp*0.25, lw*0.55, bone);
    c.beginPath(); c.arc(u*0.03,-u*0.14,u*0.014,0,6.283); c.fillStyle=ink; c.fill();
    [-0.04,0.05].forEach(function(lx2){
      c.beginPath(); c.moveTo(u*lx2,u*0.08); c.lineTo(u*lx2,u*0.18);
      c.strokeStyle=ink; c.lineWidth=lw*0.5; c.stroke();
    });
    c.restore();
  }

  c.restore();
}

/* cache degli sprite */
var sprites={};
function spriteFor(cr, px, variant){
  var key=cr.id+"|"+Math.round(px)+"|"+(variant||"n")+"|"+lastIntensity(cr);
  if(sprites[key]) return sprites[key];
  var dpr=Math.min(window.devicePixelRatio||1,2);
  var cv=document.createElement("canvas");
  cv.width=Math.round(px*dpr); cv.height=Math.round(px*dpr);
  var c=cv.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0);
  c.translate(px/2, px*0.44);
  drawGrotesque(c, px*0.33, cr, variant);
  sprites[key]=cv;
  return cv;
}
function clearSprites(){ sprites={}; }

/* ===================== pannello: Inferno ===================== */
var pcv=null, pctx=null, bake=null, raf=null, t0=Date.now(), hits=[];
var VT={s:1,x:0,y:0};
function resetVT(){ VT.s=1; VT.x=0; VT.y=0; }
function clampVT(w,hh){
  VT.s=clamp(VT.s,1,4);
  VT.x=clamp(VT.x, w-w*VT.s, 0);
  VT.y=clamp(VT.y, hh-hh*VT.s, 0);
}

function setupCanvas(cv){
  var dpr=Math.min(window.devicePixelRatio||1,2);
  var w=cv.clientWidth, hh=cv.clientHeight;
  cv.width=Math.max(1,Math.round(w*dpr)); cv.height=Math.max(1,Math.round(hh*dpr));
  var ctx=cv.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx:ctx,w:w,h:hh};
}
function spacedText(c, text, cx, cy, size, spacing, color, canvasW, weight){
  var maxW=canvasW-16;
  c.save();
  function measure(sz,sp){
    c.font=(weight||"600")+" "+sz+'px "EB Garamond", Georgia, serif';
    var t=0; for(var i=0;i<text.length;i++) t+=c.measureText(text.charAt(i)).width;
    return t+sp*(text.length-1);
  }
  var total=measure(size,spacing);
  if(total>maxW){
    var raw=measure(size,0);
    if(raw<=maxW){ spacing=(maxW-raw)/Math.max(1,text.length-1); total=maxW; }
    else { size=Math.max(7,size*maxW/raw); spacing=0; total=measure(size,0); }
  }
  c.font=(weight||"600")+" "+size+'px "EB Garamond", Georgia, serif';
  var x=clamp(cx,total/2+8,Math.max(total/2+8,canvasW-total/2-8))-total/2;
  c.textAlign="left"; c.fillStyle=color;
  for(var j=0;j<text.length;j++){ var ch=text.charAt(j); c.fillText(ch,x,cy); x+=c.measureText(ch).width+spacing; }
  c.restore();
}

function bakeInferno(w,hh){
  var dpr=Math.min(window.devicePixelRatio||1,2);
  var off=document.createElement("canvas");
  off.width=Math.round(w*dpr); off.height=Math.round(hh*dpr);
  var c=off.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0);
  var R=rng(4471);

  /* cielo notturno con incendio all'orizzonte */
  var sky=c.createLinearGradient(0,0,0,hh);
  sky.addColorStop(0,"#170D07"); sky.addColorStop(.18,"#2A1409");
  sky.addColorStop(.30,"#4A1E0A"); sky.addColorStop(.40,"#1E1108"); sky.addColorStop(1,"#0C0704");
  c.fillStyle=sky; c.fillRect(0,0,w,hh);

  var fire=c.createRadialGradient(w*.62,hh*.30,0,w*.62,hh*.30,w*.75);
  fire.addColorStop(0,"rgba(214,110,26,.42)"); fire.addColorStop(.4,"rgba(160,60,14,.18)");
  fire.addColorStop(1,"rgba(0,0,0,0)");
  c.fillStyle=fire; c.beginPath(); c.arc(w*.62,hh*.30,w*.75,0,6.283); c.fill();

  /* città in fiamme: sagome nere sull'orizzonte */
  var horizon=hh*0.315;
  c.fillStyle="#0B0603";
  for(var b=0;b<26;b++){
    var bw=6+R()*26, bh=10+R()*46, bx=R()*w;
    c.fillRect(bx, horizon-bh, bw, bh+6);
    if(R()<0.3){ /* torre */
      c.beginPath(); c.moveTo(bx+bw/2,horizon-bh-16); c.lineTo(bx,horizon-bh); c.lineTo(bx+bw,horizon-bh); c.closePath(); c.fill();
    }
  }
  /* fumi */
  for(var s=0;s<7;s++){
    var sx=R()*w, sr=20+R()*60;
    var sg=c.createRadialGradient(sx,horizon-40-R()*70,0,sx,horizon-40,sr);
    sg.addColorStop(0,"rgba(60,40,26,.5)"); sg.addColorStop(1,"rgba(0,0,0,0)");
    c.fillStyle=sg; c.beginPath(); c.arc(sx,horizon-50,sr,0,6.283); c.fill();
  }

  /* terra */
  var gr=c.createLinearGradient(0,horizon,0,hh);
  gr.addColorStop(0,"#2A1B0F"); gr.addColorStop(.5,"#1C1208"); gr.addColorStop(1,"#0E0805");
  c.fillStyle=gr; c.fillRect(0,horizon,w,hh-horizon);
  for(var t=0;t<180;t++){
    c.strokeStyle="rgba(206,170,110,"+(0.02+R()*0.05).toFixed(3)+")";
    var tx=R()*w, ty=horizon+R()*(hh-horizon);
    c.beginPath(); c.moveTo(tx,ty); c.lineTo(tx+4+R()*10,ty+1); c.stroke();
  }

  /* lago ghiacciato in basso */
  var lakeTop=hh*0.755;
  c.beginPath(); c.moveTo(0,lakeTop);
  for(var x=0;x<=w;x+=12) c.lineTo(x, lakeTop+Math.sin(x*0.012+1.1)*8+Math.sin(x*0.03)*3);
  c.lineTo(w,hh); c.lineTo(0,hh); c.closePath();
  var lg=c.createLinearGradient(0,lakeTop,0,hh);
  lg.addColorStop(0,"#25302F"); lg.addColorStop(1,"#0B1113");
  c.fillStyle=lg; c.fill();
  c.strokeStyle="rgba(180,196,190,.22)"; c.lineWidth=1; c.stroke();
  for(var cr2=0;cr2<9;cr2++){
    c.beginPath();
    var px=R()*w, py=lakeTop+20+R()*(hh-lakeTop-30);
    c.moveTo(px,py);
    for(var seg=0;seg<4;seg++){ px+=(R()-.5)*70; py+=(R()-.5)*22; c.lineTo(px,py); }
    c.strokeStyle="rgba(190,205,200,.13)"; c.stroke();
  }

  /* elementi delle regioni, a pennello */
  REGIONS.forEach(function(rg){
    var cx=rg.x*w, cy=rg.y*hh, rr=rg.r*Math.min(w,hh)*1.2;
    var Q=rng(seedOf(rg.k));
    c.save();
    c.lineWidth=1.1;
    var ochre="rgba(212,172,110,.5)", dark="rgba(10,6,3,.9)";
    if(rg.t==="peaks"){
      for(var p=0;p<5;p++){
        var px2=cx-rr*.8+p*(rr*1.6/4), ph=30+Q()*34;
        c.beginPath(); c.moveTo(px2-20,cy+rr*.3); c.lineTo(px2,cy+rr*.3-ph); c.lineTo(px2+20,cy+rr*.3);
        c.closePath(); c.fillStyle="rgba(46,32,18,.85)"; c.fill(); c.strokeStyle=ochre; c.stroke();
      }
      c.beginPath(); c.arc(cx+rr*.2, cy-rr*.35, 10, 0, 6.283);
      c.fillStyle="rgba(226,150,40,.5)"; c.fill();
    } else if(rg.t==="forest"){
      for(var f=0;f<12;f++){
        var fx=cx+(Q()-.5)*rr*1.7, fy=cy+(Q()-.5)*rr*1.1, fh=18+Q()*26;
        c.beginPath(); c.moveTo(fx,fy); c.lineTo(fx,fy-fh);
        c.strokeStyle=ochre; c.lineWidth=1.3; c.stroke();
        for(var br=0;br<3;br++){
          var t4=0.4+br*0.22;
          c.beginPath(); c.moveTo(fx,fy-fh*t4);
          c.lineTo(fx+(Q()<.5?-1:1)*(6+Q()*10), fy-fh*t4-6);
          c.lineWidth=0.8; c.stroke();
        }
      }
    } else if(rg.t==="swamp"){
      for(var s3=0;s3<5;s3++){
        var sx2=cx+(Q()-.5)*rr*1.4, sy2=cy+(Q()-.5)*rr*0.9;
        c.beginPath(); c.ellipse(sx2,sy2,14+Q()*26,5+Q()*8,Q()*.6,0,6.283);
        c.fillStyle="rgba(40,48,30,.55)"; c.fill();
        c.strokeStyle="rgba(150,170,120,.28)"; c.stroke();
      }
      for(var rd=0;rd<14;rd++){
        var rx=cx+(Q()-.5)*rr*1.6, ry=cy+(Q()-.5)*rr;
        c.beginPath(); c.moveTo(rx,ry); c.quadraticCurveTo(rx+3,ry-10,rx+7,ry-17);
        c.strokeStyle=ochre; c.lineWidth=0.9; c.stroke();
      }
      /* uovo rotto */
      c.beginPath(); c.ellipse(cx-rr*.1,cy+rr*.15,13,9,0.2,0,6.283);
      c.fillStyle="rgba(226,214,178,.35)"; c.fill(); c.strokeStyle=ochre; c.stroke();
    } else if(rg.t==="ruins"){
      for(var a2=0;a2<4;a2++){
        var ax=cx-rr*.7+a2*(rr*1.4/3), ah=24+Q()*30;
        c.beginPath();
        c.moveTo(ax,cy+rr*.25); c.lineTo(ax,cy+rr*.25-ah);
        c.quadraticCurveTo(ax+11,cy+rr*.25-ah-12, ax+22,cy+rr*.25-ah);
        c.lineTo(ax+22,cy+rr*.25);
        c.strokeStyle=ochre; c.lineWidth=1.2; c.stroke();
      }
      c.beginPath(); c.arc(cx+rr*.45,cy-rr*.1,5,0,6.283); c.fillStyle="rgba(226,214,178,.3)"; c.fill();
    } else if(rg.t==="dunes"){
      for(var d=0;d<6;d++){
        var dy=cy-rr*.4+d*(rr/4);
        c.beginPath();
        for(var dx=-rr;dx<=rr;dx+=10){
          var yy=dy+Math.sin((dx+d*36)*0.021)*(6+Q()*4);
          if(dx===-rr) c.moveTo(cx+dx,yy); else c.lineTo(cx+dx,yy);
        }
        c.strokeStyle="rgba(202,164,102,.28)"; c.lineWidth=0.9; c.stroke();
      }
      /* ossa */
      c.beginPath(); c.moveTo(cx-14,cy+rr*.4); c.lineTo(cx+14,cy+rr*.36);
      c.strokeStyle="rgba(230,220,190,.4)"; c.lineWidth=2; c.stroke();
    } else if(rg.t==="lake"){
      c.beginPath(); c.ellipse(cx,cy,rr*.62,rr*.3,0,0,6.283);
      c.fillStyle="rgba(6,10,12,.75)"; c.fill();
      c.strokeStyle="rgba(190,205,200,.25)"; c.stroke();
    }
    c.restore();
    spacedText(c, rg.name.toUpperCase(), cx, cy-rr*1.02, 10, 2.6, "rgba(214,178,116,.58)", w);
  });

  /* vignettatura da tavola dipinta */
  var vg=c.createRadialGradient(w*.5,hh*.44,Math.min(w,hh)*.3,w*.5,hh*.5,Math.max(w,hh)*.8);
  vg.addColorStop(0,"rgba(0,0,0,0)"); vg.addColorStop(1,"rgba(0,0,0,.75)");
  c.fillStyle=vg; c.fillRect(0,0,w,hh);
  return off;
}

function drawInferno(){
  if(!pcv) return;
  var w=pcv.clientWidth, hh=pcv.clientHeight, c=pctx, phase=(Date.now()-t0)/1000;
  if(!bake || bake.__w!==w || bake.__h!==hh || bake.__k!=="inf"){
    bake=bakeInferno(w,hh); bake.__w=w; bake.__h=hh; bake.__k="inf";
  }
  clampVT(w,hh);
  c.clearRect(0,0,w,hh);
  c.drawImage(bake, VT.x, VT.y, w*VT.s, hh*VT.s);

  hits=[];
  var plates=[];
  var scale=Math.min(w,hh)/380;
  var ordered=living().slice().sort(function(a,b){ return gripOrPower(b)-gripOrPower(a); });
  ordered.forEach(function(cr,i){
    var x=VT.x+cr.x*w*VT.s, y=VT.y+cr.y*hh*VT.s;
    var inten=lastIntensity(cr);
    var grip=gripOf(cr);
    var shown=(grip==null? inten : grip);
    var px=(54+shown*5.4)*scale*VT.s;
    if(x<-px||x>w+px||y<-px||y>hh+px){ return; }
    var bob=reduceMotion?0:Math.sin(phase*0.9+i*1.3)*3;
    var sp=spriteFor(cr,px,null);
    c.drawImage(sp, x-px/2, y-px/2+bob, px, px);
    c.save();
    c.textAlign="center";
    c.font='400 15px "Grenze Gotisch", Georgia, serif';
    var tw=c.measureText(cr.name).width;
    var lx=clamp(x,tw/2+8,Math.max(tw/2+8,w-tw/2-8));
    var below=(y+px*0.46+30)<(hh-6);
    var ly=below? y+px*0.44+16+bob : y-px*0.46-14+bob;
    var plateW=Math.max(tw, 74)+18, plateH=32;
    var plateY=ly-15;
    /* etichette che non si accavallano: le creature piu' grandi hanno la precedenza */
    var rect={x:lx-plateW/2, y:plateY, w:plateW, h:plateH};
    var hidden=false;
    if(VT.s<1.6){
      for(var pi=0;pi<plates.length;pi++){
        var o=plates[pi];
        if(rect.x<o.x+o.w && rect.x+rect.w>o.x && rect.y<o.y+o.h && rect.y+rect.h>o.y){ hidden=true; break; }
      }
    }
    if(hidden){
      c.font='600 10.5px "EB Garamond", serif';
      c.fillStyle= grip==null ? "rgba(196,178,140,.75)"
        : (grip>=7 ? "rgba(226,120,70,.9)" : (grip<=3 ? "rgba(150,196,140,.85)" : "rgba(214,178,116,.85)"));
      c.shadowColor="rgba(0,0,0,.9)"; c.shadowBlur=6;
      c.fillText((grip==null? inten : grip), lx, below? ly-2 : ly+2);
      c.restore();
      hits.push({id:cr.id,x:x,y:y+bob,r:Math.max(px*0.45,26)});
      return;
    }
    plates.push(rect);
    c.fillStyle="rgba(10,6,3,.48)";
    c.beginPath();
    if(c.roundRect) c.roundRect(lx-plateW/2, plateY, plateW, plateH, 3);
    else c.rect(lx-plateW/2, plateY, plateW, plateH);
    c.fill();
    c.fillStyle="rgba(242,228,192,.97)";
    c.fillText(cr.name,lx,ly);
    c.font='600 10.5px "EB Garamond", serif';
    c.fillStyle= grip==null
      ? "rgba(196,178,140,.9)"
      : (grip>=7 ? "rgba(226,120,70,1)" : (grip<=3 ? "rgba(150,196,140,.95)" : "rgba(214,178,116,.95)"));
    c.fillText((grip==null? "power "+inten : "grip "+grip), lx, ly+13);
    c.restore();
    hits.push({id:cr.id,x:x,y:y+bob,r:Math.max(px*0.45,26)});
  });
}

/* ===================== pannello: Paradiso ===================== */
function drawParadiso(){
  if(!pcv) return;
  var w=pcv.clientWidth, hh=pcv.clientHeight, c=pctx, phase=(Date.now()-t0)/1000;
  c.clearRect(0,0,w,hh);
  var g=c.createLinearGradient(0,0,0,hh);
  g.addColorStop(0,"#1C2422"); g.addColorStop(.55,"#151C1C"); g.addColorStop(1,"#090C0D");
  c.fillStyle=g; c.fillRect(0,0,w,hh);

  /* il tunnel di luce */
  var tx=w*0.5, ty=hh*0.19;
  for(var r=13;r>=1;r--){
    var rad=r*Math.min(w,hh)*0.062;
    var a=0.055+ (13-r)*0.02;
    c.beginPath(); c.ellipse(tx,ty+r*3.5,rad*1.02,rad*0.86,0,0,6.283);
    c.strokeStyle="rgba(246,238,214,"+a.toFixed(3)+")"; c.lineWidth=1.6; c.stroke();
  }
  var core=c.createRadialGradient(tx,ty,0,tx,ty,Math.min(w,hh)*0.2);
  core.addColorStop(0,"rgba(255,251,236,.96)"); core.addColorStop(.35,"rgba(248,236,200,.5)");
  core.addColorStop(1,"rgba(240,226,186,0)");
  c.fillStyle=core; c.beginPath(); c.arc(tx,ty,Math.min(w,hh)*0.2,0,6.283); c.fill();
  /* raggi */
  c.save(); c.translate(tx,ty); c.rotate(reduceMotion?0:phase*0.02);
  for(var ry=0;ry<16;ry++){
    c.rotate(6.283/16);
    var gg=c.createLinearGradient(0,0,0,-Math.min(w,hh)*0.55);
    gg.addColorStop(0,"rgba(255,248,224,.10)"); gg.addColorStop(1,"rgba(255,248,224,0)");
    c.fillStyle=gg;
    c.beginPath(); c.moveTo(0,0); c.lineTo(-9,-Math.min(w,hh)*0.55); c.lineTo(9,-Math.min(w,hh)*0.55); c.closePath(); c.fill();
  }
  c.restore();

  /* pulviscolo */
  var R=rng(3313);
  for(var d=0;d<90;d++){
    var dx2=R()*w, dy2=R()*hh;
    var tw2=reduceMotion?1:(0.5+0.5*Math.sin(phase*0.7+d));
    c.beginPath(); c.arc(dx2,dy2,0.6+R()*1.1,0,6.283);
    c.fillStyle="rgba(246,238,214,"+(0.06+R()*0.22*tw2).toFixed(3)+")"; c.fill();
  }

  hits=[];
  var list=freedOnes();
  var scale=Math.min(w,hh)/380;
  var n=list.length;
  list.forEach(function(cr,i){
    /* salita in spirale verso la luce */
    var t=n===1?0.55:(i/(n-1));
    var yy=hh*(0.86 - t*0.52);
    var amp=(1-t)*w*0.30;
    var xx=w*0.5 + Math.sin(i*1.9+1.2)*amp;
    var bob=reduceMotion?0:Math.sin(phase*0.6+i)*4;
    var px=(72+lastIntensity(cr)*1.8)*scale*(0.8+t*0.3);
    var sp=spriteFor(cr,px,"pale");
    c.save(); c.globalAlpha=0.55+t*0.42;
    c.drawImage(sp, xx-px/2, yy-px/2+bob, px, px);
    c.restore();
    c.save(); c.textAlign="center";
    c.shadowColor="rgba(0,0,0,.85)"; c.shadowBlur=9;
    c.font='400 15px "Grenze Gotisch", Georgia, serif';
    c.fillStyle="rgba(246,238,214,.92)";
    var nm=cr.freed.newName||cr.name;
    var nw=c.measureText(nm).width;
    var nx=clamp(xx,nw/2+8,Math.max(nw/2+8,w-nw/2-8));
    c.fillText(nm,nx,yy+px*0.46+15+bob);
    c.font='600 10px "EB Garamond", serif'; c.fillStyle="rgba(200,186,150,.85)";
    c.fillText(fmtDate(cr.freed.date).toUpperCase(), nx, yy+px*0.46+28+bob);
    c.restore();
    hits.push({id:cr.id,x:xx,y:yy+bob,r:Math.max(px*0.5,28)});
  });
}

function loop(){
  if(view==="inferno") drawInferno();
  else if(view==="paradiso") drawParadiso();
  if(!reduceMotion && view!=="registro") raf=requestAnimationFrame(loop);
}
