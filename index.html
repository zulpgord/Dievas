<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#26190D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bestiario">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%95%AF%EF%B8%8F%3C/text%3E%3C/svg%3E">
<title>Bestiario dell'Abisso</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Grenze+Gotisch:wght@400;600;800&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style id="app-style">
/* Trittico dipinto: un solo mondo visivo, tutti i colori dichiarati esplicitamente. */
:root{
  color-scheme: dark;
  --panel:#E4D3AA; --panel2:#D8C398; --panel3:#C9B183;
  --wood:#3B2917; --wood2:#26190D; --wood3:#54402A;
  --ink:#2C1F12; --ink2:#5A4630; --ink3:#8A755A;
  --rubric:#9E2B15; --ember:#C4551D; --gold:#C39B3A;
  --verd:#5E7A54; --lapis:#3D5D84; --bone:#EFE4C8;
  --hell:#140C07; --sky:#22282A;
  --ok:#5E7A54; --warn:#C39B3A; --bad:#9E2B15;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
}
*{box-sizing:border-box}
html{height:100%}
/* iOS: la pagina non scorre mai, scorre solo il contenuto interno */
body{margin:0;padding:0;position:fixed;inset:0;width:100%;height:100%;overflow:hidden;
  -webkit-tap-highlight-color:transparent}
#root{height:100%}
body{
  background:var(--wood2); color:var(--ink);
  font-family:"EB Garamond",Georgia,"Times New Roman",serif;
  font-size:17px; line-height:1.5; -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
  -webkit-text-size-adjust:100%;
}
button,.hinge,.realm,.hbtn{touch-action:manipulation}
.panelhead,.hinges,.hinge,.lbl,.tally span,.stats3 span{-webkit-user-select:none;user-select:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
h1,h2{font-family:"Grenze Gotisch",Georgia,serif;letter-spacing:.01em}
.frak{font-family:"UnifrakturMaguntia","Grenze Gotisch",serif;font-weight:400}
.lbl{font-size:11px;letter-spacing:.19em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.num{font-variant-numeric:tabular-nums}

#root{height:100%}
.app{
  position:relative;height:100%;max-width:540px;margin:0 auto;overflow:hidden;
  display:flex;flex-direction:column;
  background:var(--wood2);
  box-shadow:0 0 0 1px #000, 0 0 80px rgba(0,0,0,.8);
}

/* ---------- cornice del trittico ---------- */
.panelhead{
  position:relative;z-index:5;display:flex;align-items:flex-end;gap:12px;
  padding:calc(10px + var(--sat)) calc(15px + var(--sar)) 10px calc(15px + var(--sal));
  min-height:calc(58px + var(--sat));
  background:linear-gradient(to bottom,var(--wood) 0%,var(--wood2) 100%);
  border-bottom:1px solid #120B05;
  box-shadow:0 2px 10px rgba(0,0,0,.5);
}
.panelhead h1{font-size:22px;line-height:1;color:var(--panel);flex:1}
.panelhead h1 small{display:block;font-family:"EB Garamond",serif;font-size:11.5px;letter-spacing:.16em;
  text-transform:uppercase;color:#9A855F;margin-top:5px;font-weight:500}
.hbtn{
  min-width:46px;height:44px;padding:0 12px;border:1px solid #16100A;border-radius:2px;
  background:linear-gradient(to bottom,var(--wood3),var(--wood));color:var(--panel2);
  display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(224,205,165,.12);
  font-size:19px;line-height:1;
}
.hbtn:hover{color:var(--gold)}
.hbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}

.stage{position:relative;flex:1;min-height:0}
.stage canvas.panel{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ---------- cerniere / tab ---------- */
.hinges{
  position:relative;z-index:5;display:flex;gap:2px;
  padding:6px calc(6px + var(--sar)) calc(8px + var(--sab)) calc(6px + var(--sal));
  background:linear-gradient(to top,var(--wood2),var(--wood));
  border-top:1px solid #120B05;
}
.hinge{
  flex:1;padding:11px 4px 10px;min-height:52px;border:1px solid #16100A;border-radius:2px;
  background:linear-gradient(to bottom,#2E2013,#1D1409);color:#8B7551;
  font-family:"Grenze Gotisch",serif;font-size:15px;letter-spacing:.05em;text-align:center;
}
.hinge b{display:block;font-weight:400}
.hinge i{display:block;font-style:normal;font-family:"EB Garamond",serif;font-size:9.5px;
  letter-spacing:.16em;text-transform:uppercase;color:#6B5A3E;margin-top:2px}
.hinge[aria-selected="true"]{
  background:linear-gradient(to bottom,#6A4E2C,#43301A);color:var(--panel);
  box-shadow:inset 0 1px 0 rgba(240,225,190,.18);
}
.hinge[aria-selected="true"] i{color:#C4A778}
.hinge[aria-selected="true"].par{background:linear-gradient(to bottom,#5B5A3A,#3A3A25);color:#F1E7C6}
.hinge[aria-selected="true"].inf{background:linear-gradient(to bottom,#6E3A1D,#3F2010);color:#F3DCB8}

/* ---------- pergamena ---------- */
.vellum{background-color:var(--panel);background-repeat:repeat;color:var(--ink)}
.scroll{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheetpage{padding:20px calc(18px + var(--sar)) calc(44px + var(--sab)) calc(18px + var(--sal));
  display:flex;flex-direction:column;gap:26px}

.rubric{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.rubric h2{font-size:22px;color:var(--rubric);line-height:1}
.rubric::after{content:"";flex:1;height:1px;background:linear-gradient(to right,rgba(158,43,21,.5),rgba(44,31,18,0))}
.drop{float:left;font-family:"UnifrakturMaguntia",serif;font-size:52px;line-height:.86;color:var(--rubric);
  margin:2px 8px 0 0}
.prose{font-size:16.5px;line-height:1.62}
.prose em{color:var(--ink2)}
.note{font-size:14.5px;color:var(--ink2);font-style:italic;line-height:1.5;margin:0}

.tally{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:rgba(44,31,18,.22);border:1px solid rgba(44,31,18,.28)}
.tally div{background:var(--panel);padding:10px 8px;text-align:center}
.tally b{display:block;font-family:"Grenze Gotisch",serif;font-size:25px;line-height:1.05;font-weight:400;font-variant-numeric:tabular-nums}
.tally span{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);white-space:nowrap}

.omens{display:flex;flex-direction:column;gap:9px}
.omen{display:flex;gap:9px;align-items:flex-start;font-size:16px;line-height:1.45}
.omen::before{content:"\261E";color:var(--rubric);font-size:17px;line-height:1.3;flex:none}

.cal{overflow-x:auto;padding-bottom:6px}
.calgrid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);gap:2px;width:max-content}
.cal i{width:11px;height:11px;display:block;border:1px solid rgba(44,31,18,.14);border-radius:1px}
.callegend{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11px;color:var(--ink3)}
.callegend i{width:11px;height:11px;border:1px solid rgba(44,31,18,.14);display:block}

.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:15px}
.bar .track{grid-column:1/-1;height:9px;background:rgba(44,31,18,.12);border:1px solid rgba(44,31,18,.2);position:relative}
.bar .fill{position:absolute;left:0;top:0;bottom:0}
.bar .n{color:var(--ink2);font-variant-numeric:tabular-nums;font-size:14px}

.rites{display:flex;flex-direction:column;gap:12px}
.rite-row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline}
.rite-row .txt{font-size:16px}
.rite-row .sc{font-size:13px;color:var(--ink2);white-space:nowrap}
.rite-row .track{grid-column:1/-1;height:7px;background:rgba(44,31,18,.12);position:relative;border:1px solid rgba(44,31,18,.2)}
.rite-row .fill{position:absolute;left:0;top:0;bottom:0}

.cloud{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;line-height:1.25}
.cloud span{color:var(--ink);font-family:"Grenze Gotisch",serif;font-weight:400}
.cloud span small{font-size:10px;color:var(--ink3);font-family:"EB Garamond",serif;vertical-align:super}

.trend{width:100%;height:88px;display:block}
.trend .ln{fill:none;stroke:var(--rubric);stroke-width:1.6;stroke-linejoin:round}
.trend .ar{stroke:none}
.trend .gd{stroke:rgba(44,31,18,.2);stroke-width:1}
.trend text{font-size:9px;fill:var(--ink3);font-family:"EB Garamond",serif}

/* ---------- registro: elenco creature ---------- */
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools input[type=text]{flex:1;min-width:130px}
input[type=text],input[type=date],textarea,select{
  width:100%;background:rgba(255,250,235,.5);border:1px solid rgba(44,31,18,.32);border-radius:2px;
  padding:9px 10px;color:var(--ink);font-size:16px;
}
textarea{resize:vertical;min-height:74px;line-height:1.5}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--rubric);background:rgba(255,252,242,.75)}
select{appearance:none;padding-right:26px;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);
  background-position:calc(100% - 15px) 18px,calc(100% - 10px) 18px;background-size:5px 5px;background-repeat:no-repeat}

.roster{display:flex;flex-direction:column;gap:0;border:1px solid rgba(44,31,18,.28)}
.roster-row{display:flex;align-items:center;gap:11px;padding:9px 10px;border-bottom:1px solid rgba(44,31,18,.16);background:rgba(255,250,235,.22)}
.roster-row:last-child{border-bottom:none}
.roster-row canvas{width:46px;height:46px;flex:none}
.roster-row .who{flex:1;min-width:0}
.roster-row .who b{display:block;font-family:"Grenze Gotisch",serif;font-weight:400;font-size:18.5px;line-height:1.15}
.roster-row .who span{font-size:12.5px;color:var(--ink2);display:block;line-height:1.3}
.roster-row .pw{font-family:"Grenze Gotisch",serif;font-size:21px;width:26px;text-align:right;font-variant-numeric:tabular-nums}
.acts{display:flex;gap:3px}
.acts button{width:30px;height:30px;border:1px solid rgba(44,31,18,.28);border-radius:2px;
  display:grid;place-items:center;font-size:14px;color:var(--ink2);background:rgba(255,250,235,.4)}
.acts button:hover{color:var(--rubric);border-color:var(--rubric)}

.chron{display:flex;flex-direction:column}
.chron .mo{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--rubric);margin:14px 0 7px;font-weight:600}
.chron button{display:flex;gap:10px;align-items:baseline;text-align:left;padding:7px 0;border-bottom:1px dotted rgba(44,31,18,.25);width:100%}
.chron .d{font-size:12px;color:var(--ink3);width:44px;flex:none;font-variant-numeric:tabular-nums}
.chron .b{flex:1;min-width:0;font-size:15.5px}
.chron .b b{font-family:"Grenze Gotisch",serif;font-weight:400;font-size:16.5px}
.chron .b i{display:block;font-style:normal;color:var(--ink2);font-size:14px;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.chron .p{font-size:13px;color:var(--ink3);font-variant-numeric:tabular-nums}

/* ---------- fogli (sheet) ---------- */
.scrim{position:absolute;inset:0;z-index:8;background:rgba(10,6,3,.72);animation:fade .2s ease}
.sheet-body{scroll-padding-bottom:90px}
.sheet-body input,.sheet-body textarea,.sheet-body select{scroll-margin-top:14px;scroll-margin-bottom:26px}
.kbbar{position:sticky;bottom:0;z-index:3;display:none;justify-content:flex-end;
  padding:10px 0 2px;margin:-8px -4px -6px;
  background:linear-gradient(to top,var(--panel) 55%,rgba(228,211,170,0))}
.kbbar button{padding:9px 18px;border:1px solid rgba(44,31,18,.4);border-radius:2px;
  background:linear-gradient(to bottom,#8E3418,#6E2611);color:#F3E2BE;font-family:"Grenze Gotisch",serif;font-size:16px}
body.kbopen .kbbar{display:flex}
body.kbopen .sheet-body{padding-bottom:10px}
@keyframes fade{from{opacity:0}}
.sheet{
  position:absolute;left:0;right:0;z-index:9;
  bottom:var(--kb,0px);
  max-height:calc(100% - var(--kb,0px) - var(--sat) - 22px);
  transition:bottom .2s ease, max-height .2s ease;
  display:flex;flex-direction:column;color:var(--ink);
  background-color:var(--panel);
  border-top:3px solid var(--wood3);border-radius:3px 3px 0 0;
  box-shadow:0 -22px 60px rgba(0,0,0,.65);
  animation:rise .28s cubic-bezier(.2,.8,.25,1);
}
@keyframes rise{from{transform:translateY(16px);opacity:0}}
.sheet-head{position:relative;display:flex;align-items:flex-start;gap:12px;padding:20px 17px 12px;
  border-bottom:1px solid rgba(44,31,18,.28);background:rgba(200,175,130,.25);
  touch-action:none;cursor:grab}
.sheet-head::before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);
  width:42px;height:4px;border-radius:3px;background:rgba(44,31,18,.3)}
.sheet-head h2{font-size:25px;line-height:1.1;flex:1}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:16px calc(17px + var(--sar)) calc(28px + var(--sab)) calc(17px + var(--sal));
  display:flex;flex-direction:column;gap:17px}
.sheet-body>*{flex:0 0 auto}
.sheetpage>*{flex:0 0 auto}
.xbtn{width:44px;height:44px;flex:none;border:1px solid rgba(44,31,18,.3);border-radius:2px;
  display:grid;place-items:center;color:var(--ink2);background:rgba(255,250,235,.4)}
.xbtn:active{background:rgba(255,252,242,.9)}
.xbtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}

.field{display:flex;flex-direction:column;gap:5px}
.field .hint{font-size:13px;color:var(--ink3);font-style:italic}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:11px 8px;border:1px solid rgba(44,31,18,.3);border-radius:2px;
  background:rgba(255,250,235,.3);color:var(--ink2);font-family:"Grenze Gotisch",serif;font-size:17px}
.seg button small{display:block;font-family:"EB Garamond",serif;font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink3);margin-top:2px}
.seg button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink2);background:rgba(255,252,242,.8);box-shadow:inset 0 0 0 1px rgba(44,31,18,.16)}
.seg button.k-dievas[aria-pressed="true"]{border-color:var(--verd);box-shadow:inset 0 0 22px rgba(94,122,84,.18)}
.seg button.k-demone[aria-pressed="true"]{border-color:var(--rubric);box-shadow:inset 0 0 22px rgba(158,43,21,.15)}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}

.slider{display:flex;align-items:center;gap:12px}
input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:24px;background:none}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:linear-gradient(90deg,var(--verd),var(--gold),var(--rubric));border:none}
input[type=range]::-moz-range-track{height:3px;background:linear-gradient(90deg,var(--verd),var(--gold),var(--rubric))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:19px;height:19px;margin-top:-8px;border-radius:50%;
  background:var(--panel);border:2px solid var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.4)}
input[type=range]::-moz-range-thumb{width:17px;height:17px;border-radius:50%;background:var(--panel);border:2px solid var(--ink)}
.slider .val{font-family:"Grenze Gotisch",serif;font-size:23px;width:32px;text-align:right;font-variant-numeric:tabular-nums}

.tenner{display:flex;gap:4px}
.tenner button{flex:1;padding:12px 0;border:1px solid rgba(44,31,18,.3);border-radius:2px;
  background:rgba(255,250,235,.35);font-family:"Grenze Gotisch",serif;font-size:17px;font-variant-numeric:tabular-nums}
.tenner button:hover{background:var(--gold);color:var(--wood2)}

.btn{padding:12px 15px;border:1px solid rgba(44,31,18,.4);border-radius:2px;background:rgba(255,250,235,.45);
  font-family:"Grenze Gotisch",serif;font-size:18px;text-align:center;color:var(--ink)}
.btn:hover{background:rgba(255,252,242,.85)}
.btn.primary{background:linear-gradient(to bottom,#8E3418,#6E2611);color:#F3E2BE;border-color:#4E1B0C}
.btn.primary:hover{background:linear-gradient(to bottom,#A03B1B,#7C2A13)}
.btn.gold{background:linear-gradient(to bottom,#C9A648,#9C7C2C);color:#241800;border-color:#6E5619}
.btn.ghost{background:none;color:var(--ink2)}
.btn.danger{background:none;color:var(--rubric);border-color:rgba(158,43,21,.5)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btnrow{display:flex;gap:9px}
.btnrow>*{flex:1}

.kindtag{display:inline-flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.17em;text-transform:uppercase;font-weight:600}
.kindtag i{width:7px;height:7px;border-radius:50%;background:currentColor;font-style:normal}
.k-verd{color:var(--verd)} .k-rub{color:var(--rubric)} .k-gold{color:#8A6A16}
.epithet{font-style:italic;color:var(--ink2);font-size:16px;margin:0}

.portrait{width:100%;max-width:230px;aspect-ratio:1;display:block;margin:0 auto}
.seg.ground button[aria-pressed="true"][data-g="1"]{border-color:var(--verd);color:#3F5A38;box-shadow:inset 0 0 22px rgba(94,122,84,.2)}
.seg.ground button[aria-pressed="true"][data-g="0"]{border-color:var(--gold);box-shadow:inset 0 0 22px rgba(195,155,58,.2)}
.seg.ground button[aria-pressed="true"][data-g="-1"]{border-color:var(--rubric);color:#8C2A15;box-shadow:inset 0 0 22px rgba(158,43,21,.16)}
.seg.ground button{font-size:15px;line-height:1.15}
.ledger{display:flex;gap:3px;flex-wrap:wrap;align-items:center}
.ledger i{width:13px;height:13px;display:block;border:1px solid rgba(44,31,18,.28);font-style:normal}
.ledger .lg{background:var(--verd)} .ledger .lh{background:var(--gold)} .ledger .ll{background:var(--rubric)}
.ledger em{font-style:normal;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);margin-left:6px}
.gbars{display:flex;gap:4px;align-items:stretch;height:104px}
.gcol{flex:1;display:flex;flex-direction:column;min-width:0}
.gcol .half{flex:1;display:flex}
.gcol .half.top{align-items:flex-end}
.gcol .half.bot{align-items:flex-start}
.gcol .half span{display:block;width:100%;border-radius:1px}
.gcol .up{background:linear-gradient(to top,#4E6A45,#7E9A72)}
.gcol .dn{background:linear-gradient(to bottom,#9E2B15,#C4551D)}
.gzero{height:1px;background:rgba(44,31,18,.4)}
.gline{margin-top:8px;font-size:14.5px;display:flex;gap:8px;align-items:baseline}
.gline .tag{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;padding:2px 6px;border:1px solid currentColor;flex:none;font-weight:600}
.gline.g1{color:var(--verd)} .gline.g0{color:#8A6A16} .gline.gm1{color:var(--rubric)}
.gline span:last-child{color:var(--ink)}
/* aree della vita */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips button{padding:8px 12px;border:1px solid rgba(44,31,18,.32);border-radius:2px;
  background:rgba(255,250,235,.35);font-size:15px;color:var(--ink2)}
.chips button[aria-pressed="true"]{background:rgba(255,252,242,.9);color:var(--ink);border-color:var(--ink2);
  box-shadow:inset 0 0 0 1px rgba(44,31,18,.15)}

/* sfide */
.chal{border:1px solid rgba(44,31,18,.3);background:rgba(255,250,235,.35);padding:12px 13px;
  display:flex;flex-direction:column;gap:9px}
.chal+.chal{margin-top:9px}
.chal.done{background:rgba(94,122,84,.13);border-color:rgba(94,122,84,.45)}
.chal.miss{background:rgba(158,43,21,.08);border-color:rgba(158,43,21,.35)}
.chal .when{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.chal .when.late{color:var(--rubric)}
.chal .what{font-size:16.5px;line-height:1.4}
.chal .verdict{display:flex;gap:10px;align-items:baseline;font-size:14.5px;color:var(--ink2)}
.chal .verdict b{font-family:"Grenze Gotisch",serif;font-weight:400;font-size:17px;color:var(--ink)}
.gap{display:inline-flex;align-items:baseline;gap:6px;color:var(--verd);font-weight:600}
.chal .seg button{padding:9px 6px;font-size:15px}

/* notte */
.sheet.night{background-color:#161210;background-image:none;color:#D9CDB5;border-top-color:#2A211B}
.sheet.night .sheet-head{background:rgba(30,24,20,.85);border-bottom-color:#2A211B}
.sheet.night .sheet-head::before{background:rgba(217,205,181,.3)}
.sheet.night h2{color:#E8D9B6}
.sheet.night .xbtn{color:#B5A68C;border-color:#3A2F26;background:rgba(40,32,26,.6)}
.sheet.night .note,.sheet.night .hint{color:#9B8E78}
.sheet.night .lbl{color:#8A7E6A}
.sheet.night textarea{background:rgba(10,8,7,.55);border-color:#3A2F26;color:#E4D9C2}
.sheet.night .btn{background:rgba(48,39,32,.8);border-color:#3A2F26;color:#E4D9C2}
.sheet.night .btn.primary{background:linear-gradient(to bottom,#4A2E1C,#33200F);border-color:#5A3A22;color:#F0DFBC}
.sheet.night .rubric h2{color:#C9A35E;font-size:19px}
.sheet.night .rubric::after{background:linear-gradient(to right,rgba(201,163,94,.4),rgba(0,0,0,0))}
.anchor{border-left:2px solid #4A3A28;padding:9px 0 9px 12px;font-size:15.5px;line-height:1.5;color:#C9BCA2}
.anchor b{display:block;color:#E8D9B6;font-family:"Grenze Gotisch",serif;font-weight:400;font-size:17px;margin-bottom:2px}

/* pensieri parcheggiati */
.parked{border:1px solid rgba(61,93,132,.45);background:rgba(61,93,132,.08);padding:12px 13px;display:flex;flex-direction:column;gap:10px}
.parked .pk{border-bottom:1px dotted rgba(44,31,18,.25);padding-bottom:9px;display:flex;flex-direction:column;gap:7px}
.parked .pk:last-child{border-bottom:none;padding-bottom:0}
.parked .pk time{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.parked .pk p{margin:0;font-size:16px;line-height:1.45}
.parked .pk .row2{display:flex;gap:7px}
.parked .pk .row2 button{flex:1;padding:8px;border:1px solid rgba(44,31,18,.3);border-radius:2px;
  background:rgba(255,250,235,.5);font-size:14px}

/* fisarmonica */
.acc{border-bottom:1px solid rgba(44,31,18,.2);padding-bottom:4px}
.acc>summary{list-style:none;cursor:pointer}
.acc>summary::-webkit-details-marker{display:none}
.acc .rubric{margin-bottom:0}
.acc .rubric h2{font-size:21px}
.acc[open] .rubric{margin-bottom:10px}
.acc .rubric{position:relative;padding-right:20px}
.acc .caret{position:absolute;right:0;top:3px;font-size:13px;color:var(--ink3)}
.acc[open] .caret{transform:rotate(180deg)}
.acc .body{padding-top:2px}

/* rassegna serale */
.rass{display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center}
.rass canvas{width:150px;height:150px}
.rass .nm{font-family:"Grenze Gotisch",serif;font-size:27px;line-height:1.1}
.rass .sub{font-size:14.5px;color:var(--ink2);font-style:italic;margin:0}
.rass .dots{display:flex;gap:6px}
.rass .dots i{width:7px;height:7px;border-radius:50%;background:rgba(44,31,18,.22);display:block}
.rass .dots i.on{background:var(--rubric)}
.rass .dots i.ok{background:var(--verd)}
.rass-full{width:100%;display:flex;flex-direction:column;gap:10px}
.storm{color:#8A6A16}
.ledger i.st{background:var(--gold);box-shadow:0 0 0 1px rgba(44,31,18,.3) inset}

/* dormiente */
.sleepbox{border:1px solid rgba(61,93,132,.45);background:rgba(61,93,132,.08);padding:12px 13px;
  display:flex;flex-direction:column;gap:9px}
.sleepbox>b{font-family:"Grenze Gotisch",serif;font-weight:400;font-size:19px;color:var(--lapis);display:block}
.sleepbox p{margin:0;font-size:15.5px;line-height:1.5}

/* bollino di aiuto */
.q{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;margin-left:7px;
  border:1px solid rgba(44,31,18,.4);border-radius:50%;font-size:11.5px;line-height:1;color:var(--ink2);
  background:rgba(255,250,235,.5);vertical-align:middle;font-family:"EB Garamond",serif;font-weight:600;
  flex:none;padding:0}
.q:active,.q:hover{background:var(--gold);color:var(--wood2);border-color:var(--gold)}
.rubric .q{margin-left:2px}
.panelhead .q{width:26px;height:26px;font-size:15px;border-color:#54402A;background:rgba(84,64,42,.5);color:var(--panel2)}

.tipscrim{position:absolute;inset:0;z-index:12;background:rgba(10,6,3,.55);animation:fade .15s ease}
.tip{position:absolute;left:12px;right:12px;bottom:calc(16px + var(--sab));z-index:13;
  max-height:70%;overflow-y:auto;background-color:var(--panel);border:1px solid var(--wood3);
  border-radius:3px;box-shadow:0 -14px 44px rgba(0,0,0,.6);padding:16px 17px 18px;
  animation:rise .2s cubic-bezier(.2,.8,.25,1)}
.tip h3{margin:0 0 8px;font-family:"Grenze Gotisch",serif;font-weight:400;font-size:21px;color:var(--rubric)}
.tip p{margin:0 0 10px;font-size:16px;line-height:1.55}
.tip p:last-of-type{margin-bottom:0}
.tip b{color:var(--ink)}
.tip .close{margin-top:14px;width:100%;padding:11px;border:1px solid rgba(44,31,18,.35);border-radius:2px;
  font-family:"Grenze Gotisch",serif;font-size:16px;background:rgba(255,250,235,.5)}

.firststep{border:1px solid rgba(158,43,21,.45);background:rgba(255,250,235,.45);padding:13px 14px;
  display:flex;flex-direction:column;gap:9px}
.firststep>b{font-family:"Grenze Gotisch",serif;font-weight:400;font-size:19px;color:var(--rubric);display:block}
.firststep p b,.firststep li b{font-weight:600;color:var(--ink)}
.firststep p{margin:0;font-size:15.5px;line-height:1.5}
.firststep ol{margin:0;padding-left:20px;font-size:15.5px;line-height:1.6}
.firststep ol li{margin-bottom:4px}

.howto{display:flex;flex-direction:column;gap:14px}
.step-n{display:flex;gap:12px;align-items:flex-start}
.step-n .num{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--rubric);color:var(--rubric);
  display:grid;place-items:center;font-family:"Grenze Gotisch",serif;font-size:15px;margin-top:2px}
.step-n div p{margin:0;font-size:15.5px;line-height:1.5}
.step-n>div>b{font-family:"Grenze Gotisch",serif;font-weight:400;font-size:18px;display:block;margin-bottom:2px;color:var(--ink)}
.step-n p b{font-weight:600;font-size:inherit;font-family:inherit;display:inline;color:var(--ink)}
.rhythm{width:100%;border-collapse:collapse;font-size:15px}
.rhythm td{padding:7px 10px 7px 0;border-bottom:1px solid rgba(44,31,18,.16);vertical-align:top}
.rhythm td:first-child{white-space:nowrap;color:var(--rubric);font-family:"Grenze Gotisch",serif;font-size:16.5px}

.rtable{width:100%;border-collapse:collapse;font-size:14.5px}
.rtable th{text-align:left;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);
  font-weight:600;padding:6px 9px 6px 0;border-bottom:1px solid rgba(44,31,18,.32)}
.rtable td{padding:7px 9px 7px 0;border-bottom:1px solid rgba(44,31,18,.14);vertical-align:top}
.rtable td.n,.rtable th.n{text-align:right;font-variant-numeric:tabular-nums;padding-right:0}
.rtable .nm{font-family:"Grenze Gotisch",serif;font-size:16.5px}
.wrapx{overflow-x:auto}
.win{color:var(--verd)} .lose{color:var(--rubric)}

.intro{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;
  background:var(--wood2);color:var(--panel);
  padding:calc(28px + var(--sat)) 26px calc(24px + var(--sab))}
.intro .step{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px}
.intro h2{font-family:"UnifrakturMaguntia",serif;font-weight:400;font-size:34px;line-height:1.15;color:var(--gold)}
.intro p{margin:0;font-size:17.5px;line-height:1.6;color:#DCC9A4}
.intro p b{color:var(--panel)}
.intro .step{align-items:stretch}
.intro .guide{position:relative;align-self:center;width:170px;height:170px}
.intro .guide .glow{position:absolute;left:50%;top:6%;width:120px;height:120px;margin-left:-60px;border-radius:50%;
  background:radial-gradient(circle,rgba(232,150,60,.35) 0%,rgba(232,150,60,0) 70%);animation:flicker 2.6s infinite ease-in-out}
.intro .guide .body{position:absolute;inset:0;transform-origin:50% 90%;animation:bob 2.8s infinite ease-in-out}
.intro .guide canvas{display:block;width:170px;height:170px;transform-origin:50% 90%}
.intro .guide.talk canvas{animation:talk .32s infinite ease-in-out}
.intro .guide.pose-wave .body{animation:bob 2.8s infinite ease-in-out,wave 1.4s 2 ease-in-out}
.intro .guide.pose-think .body{animation:bob 3.4s infinite ease-in-out,tilt 3.4s infinite ease-in-out}
.intro .guide.pose-nod .body{animation:nod 1.1s 3 ease-in-out,bob 2.8s 3.3s infinite ease-in-out}
.intro .guide.pose-lean .body{animation:lean 2.2s infinite ease-in-out}
.intro .guide.pose-hop .body{animation:hop 1.3s infinite cubic-bezier(.3,0,.5,1)}
.intro .guide.pose-sleep .body{animation:snooze 4s infinite ease-in-out}
.intro .guide.pose-sleep .glow{animation:flicker 4s infinite ease-in-out;opacity:.5}
.intro .bubble{position:relative;background:rgba(228,211,170,.07);border:1px solid rgba(195,155,58,.35);border-radius:14px;padding:14px 16px 16px;cursor:pointer}
.intro .bubble::before{content:"";position:absolute;left:50%;top:-9px;width:16px;height:16px;margin-left:-8px;transform:rotate(45deg);
  background:#2B1E12;border-left:1px solid rgba(195,155,58,.35);border-top:1px solid rgba(195,155,58,.35)}
.intro .bubble.in{animation:rise .3s ease-out}
.intro .bubble h2{margin:0 0 6px;font-size:30px}
.intro .bubble .w{opacity:0;animation:wordin .18s forwards}
@keyframes wordin{to{opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes talk{0%,100%{transform:scale(1,1)}50%{transform:scale(1.035,.965)}}
@keyframes wave{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
@keyframes tilt{0%,100%{transform:rotate(0) translateY(0)}50%{transform:rotate(-5deg) translateY(-4px)}}
@keyframes nod{0%,100%{transform:translateY(0)}40%{transform:translateY(5px) rotate(2deg)}}
@keyframes lean{0%,100%{transform:rotate(0)}50%{transform:rotate(6deg) translateX(4px)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}10%{transform:translateY(0) scale(1.06,.94)}45%{transform:translateY(-22px) scale(.97,1.03)}80%{transform:translateY(0) scale(1.04,.96)}}
@keyframes snooze{0%,100%{transform:rotate(-3deg) translateY(2px)}50%{transform:rotate(3deg) translateY(-2px)}}
@keyframes flicker{0%,100%{opacity:.85;transform:scale(1)}30%{opacity:.6;transform:scale(.94)}60%{opacity:1;transform:scale(1.05)}}
.intro .dots{display:flex;gap:7px;justify-content:center;margin-bottom:16px}
.intro .dots i{width:7px;height:7px;border-radius:50%;background:#54402A;display:block}
.intro .dots i.on{background:var(--gold)}
.intro .nav{display:flex;gap:10px}
.intro .nav button{flex:1;padding:14px;border:1px solid #16100A;border-radius:2px;
  font-family:"Grenze Gotisch",serif;font-size:18px;background:linear-gradient(to bottom,#6A4E2C,#43301A);color:var(--panel)}
.intro .nav button.ghost{background:none;color:#9A855F;flex:0 0 auto;padding:14px 18px}

.warnbox{border-left:3px solid var(--rubric);padding:8px 0 8px 11px;font-size:14.5px;color:var(--ink2);font-style:italic}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(44,31,18,.24);border:1px solid rgba(44,31,18,.3)}
.stats3 div{background:rgba(255,250,235,.4);padding:10px;display:flex;flex-direction:column;gap:2px}
.stats3 b{font-family:"Grenze Gotisch",serif;font-size:21px;font-weight:400;line-height:1;font-variant-numeric:tabular-nums}
.stats3 span{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:15.5px}
.dl dt{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);padding-top:4px;font-weight:600}
.dl dd{margin:0;white-space:pre-wrap}

.entries{display:flex;flex-direction:column;border-left:1px solid rgba(44,31,18,.3);margin-left:5px}
.entry{position:relative;padding:0 0 18px 18px}
.entry:last-child{padding-bottom:2px}
.entry::before{content:"";position:absolute;left:-4.5px;top:7px;width:8px;height:8px;border-radius:50%;
  background:var(--panel);border:1px solid var(--ink2)}
.entry.hi::before{background:var(--rubric);border-color:var(--rubric)}
.entry.lo::before{background:var(--verd);border-color:var(--verd)}
.entry-head{display:flex;align-items:baseline;gap:10px;margin-bottom:3px}
.entry-head time{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.entry-head .pw{font-size:11.5px;color:var(--ink3);margin-left:auto;font-variant-numeric:tabular-nums}
.entry p{margin:0 0 6px;font-size:16px;white-space:pre-wrap}
.cbt{border-left:2px solid rgba(158,43,21,.35);padding-left:10px;margin:8px 0 0;display:flex;flex-direction:column;gap:6px}
.cbt div{font-size:15px}
.cbt b{display:block;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--rubric);font-weight:600}
.ritual{margin-top:8px;font-size:15px;display:flex;gap:8px;align-items:baseline}
.ritual .out{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;padding:2px 6px;border:1px solid currentColor;flex:none;font-weight:600}
.out.o1{color:var(--ok)} .out.o2{color:#8A6A16} .out.o3{color:var(--ink3)}

.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:88px;z-index:30;
  background:var(--wood);border:1px solid #16100A;padding:9px 15px;color:var(--panel);
  font-size:14.5px;box-shadow:0 8px 26px rgba(0,0,0,.6);animation:fade .2s;max-width:88%;text-align:center}
.sosbox{border:1px solid rgba(158,43,21,.45);background:rgba(158,43,21,.08);padding:12px 14px;color:inherit}
.sosbox>b{display:block;font-family:"Grenze Gotisch",serif;font-weight:400;font-size:17px;color:var(--rubric);margin-top:6px}
.sosbox>b:first-child{margin-top:0}
.sosbox p{margin:4px 0 8px}
.sosbox a{color:var(--rubric);font-weight:600}
.sheet.night .sosbox>b,.sheet.night .sosbox a{color:#E9A27A}
.sos-link{background:none;border:0;color:inherit;text-decoration:underline;font:inherit;padding:4px;cursor:pointer}
.gadopts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.gadopts button{padding:8px 6px;font-size:14px;line-height:1.2;border:1px solid rgba(44,31,18,.3);background:rgba(255,250,235,.35);color:var(--ink2)}
.gadopts button[aria-pressed="true"]{background:var(--rubric);border-color:#5E180B;color:#F6E9CC}
.field.gad .lbl{text-transform:none;letter-spacing:0;font-size:15.5px;color:var(--ink)}
.tm-hist{display:flex;align-items:flex-end;gap:6px;height:90px;margin:10px 0 6px}
.tm-col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.tm-col span{display:block;width:70%;min-height:3px}
.tm-col i{font-style:normal;font-size:11px;color:var(--ink3);margin-top:3px;white-space:nowrap}
.duedot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--rubric);vertical-align:middle;margin-left:4px}
input[type=time]{font:inherit;font-size:18px;padding:8px 10px;border:1px solid rgba(44,31,18,.3);background:rgba(255,250,235,.5);color:var(--ink)}
html.plain *{font-family:"EB Garamond",Georgia,serif!important}
html.plain h1,html.plain h2,html.plain .frak{font-weight:600}
.bkbar{position:absolute;left:12px;right:12px;top:10px;z-index:6;display:flex;align-items:center;gap:10px;
  background:var(--wood);border:1px solid #16100A;padding:9px 10px 9px 13px;color:var(--panel);
  font-size:14.5px;line-height:1.3;box-shadow:0 8px 26px rgba(0,0,0,.6);animation:fade .2s}
.bkbar p{margin:0;flex:1}
.bkbar button{flex:none;padding:7px 11px;font-size:14px;color:var(--panel);background:transparent;border:1px solid rgba(228,211,170,.35)}
.bkbar button.go{background:var(--rubric);border-color:#5E180B;color:#F6E9CC}
.menu{display:flex;flex-direction:column;border:1px solid rgba(44,31,18,.3)}
.menu button{padding:12px 13px;text-align:left;border-bottom:1px solid rgba(44,31,18,.18);background:rgba(255,250,235,.3);font-size:16.5px}
.menu button:last-child{border-bottom:none}
.menu button small{display:block;font-size:13px;color:var(--ink2);font-style:italic}

.rite{position:absolute;inset:0;z-index:20;background:rgba(8,5,3,.94);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;padding:28px;text-align:center}
.rite canvas{position:absolute;inset:0;width:100%;height:100%}
.rite p{position:relative;font-family:"UnifrakturMaguntia",serif;font-size:30px;line-height:1.25;margin:0;color:#F0DFB4}
.rite small{position:relative;color:#B8A272;font-style:italic;font-size:16px}

.pill{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;z-index:4;
  padding:11px 20px;border:1px solid #4A4230;border-radius:22px;
  background:linear-gradient(to bottom,rgba(58,42,24,.95),rgba(30,20,10,.95));
  color:#E8D5AC;font-family:"Grenze Gotisch",serif;font-size:17px;letter-spacing:.03em;
  box-shadow:0 6px 20px rgba(0,0,0,.55);display:flex;align-items:center;gap:8px}
.pill i{font-style:normal;font-family:"EB Garamond",serif;font-size:12.5px;font-weight:600;
  background:var(--rubric);color:#F3E2BE;border-radius:10px;padding:1px 7px}
.empty{position:absolute;left:0;right:0;bottom:22%;text-align:center;padding:0 32px;pointer-events:none;
  display:flex;flex-direction:column;align-items:center}
.empty p{margin:0;font-style:italic;font-size:16.5px;line-height:1.6;color:#C6AF83;text-shadow:0 2px 8px rgba(0,0,0,.9)}
.empty .lbl{color:#9A855F;margin-bottom:8px}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
.hbtn.lang{font-family:"Grenze Gotisch",serif;font-size:13px;letter-spacing:.04em}
</style>

document.documentElement.lang=window.__LANG;

var HELP={
 natura:{t:L("Dievas o demone?","Dievas or demon?"),d:L("<p><b>Dievas</b> è un’ansia: qualcosa che ti stringe <i>prima</i>, mentre aspetti che accada. <b>Demone</b> è una paura: qualcosa che ti aspetta al varco, con una faccia precisa.</p><p>La differenza non è clinica, è tua. Scegli quella che ti suona giusta: cambia solo il colore della bestia.</p>","<p>A <b>dievas</b> is an anxiety: something that tightens <i>before</i>, while you wait for it to happen. A <b>demon</b> is a fear: something waiting for you, with a definite face.</p><p>The distinction isn’t clinical, it’s yours. Pick whichever sounds right: it only changes the colour of the beast.</p>")},
 nome:{t:L("Perché darle un nome","Why give it a name"),d:L("<p>Nominare è il primo atto utile: mette un confine attorno a quello che senti e lo separa da te. Non sei ansioso, <b>c’è una cosa che si chiama così</b> e ogni tanto arriva.</p><p>Il nome genera anche la figura: cambiandolo, cambia la bestia disegnata.</p>","<p>Naming is the first useful act: it draws a border around what you feel and separates it from you. You aren’t anxious — <b>there’s a thing with a name</b> and every so often it arrives.</p><p>The name also generates the figure: change it and the drawn beast changes.</p>")},
 dominio:{t:L("A che serve il dominio","What the domain is for"),d:L("<p>È il territorio dell’Inferno in cui vive. Serve a vedere <b>da dove arriva la pressione</b>: se col tempo mezzo bestiario finisce nelle Vette del Giudizio, quello è il tema, non le singole creature.</p><p>Puoi sempre spostarla trascinandola sulla mappa.</p>","<p>The territory of the Inferno where it lives. It shows you <b>where the pressure comes from</b>: if over time half the bestiary ends up in the Peaks of Judgement, that’s the theme — not the individual creatures.</p><p>You can always move it by dragging it across the map.</p>")},
 trigger:{t:L("Ciò che la evoca","What summons it"),d:L("<p>Le situazioni in cui compare: luoghi, momenti, persone, orari. Non serve precisione, servono <b>ricorrenze</b>.</p><p>Il Registro le incrocia con le voci di diario e ti mostra le parole che tornano più spesso.</p>","<p>The situations where it turns up: places, moments, people, times of day. Precision isn’t the point — <b>recurrence</b> is.</p><p>The Ledger cross-checks these against your diary entries and shows you the words that come back most often.</p>")},
 corpo:{t:L("Come ti tocca il corpo","How it touches your body"),d:L("<p>Dove la senti fisicamente: respiro, stomaco, mascella, sonno. Serve a due cose: riconoscerla <b>prima</b> che diventi un pensiero, e accorgerti che il corpo si calma anche quando la testa continua.</p>","<p>Where you feel it physically: breath, stomach, jaw, sleep. Good for two things: recognising it <b>before</b> it becomes a thought, and noticing that the body settles even while the head keeps going.</p>")},
 presa:{t:L("La presa","The grip"),d:L("<p>Quanto questa creatura <b>decide al posto tuo</b>, da 1 a 10. Si calcola sulle ultime dieci voci: se le cedi terreno sale, se fai le cose lo stesso scende.</p><p>È la misura che governa la sua dimensione sulla mappa, e quella che dice quando il rito di liberazione ha senso. Compare dopo le prime voci.</p>","<p>How much this creature <b>decides on your behalf</b>, from 1 to 10. It’s computed from the last ten entries: give it ground and it climbs, do things anyway and it falls.</p><p>It’s the measure that governs the creature’s size on the map, and the one that tells you when the rite of release makes sense. It appears after the first few entries.</p>")},
 potenza:{t:L("La potenza","Power"),d:L("<p>Quanto forte l’hai sentita, da 1 a 10. Serve a riconoscere i picchi e a vedere se col tempo si smorzano.</p><p>Ma <b>non è l’obiettivo</b>: puoi sentirla fortissima e non lasciarle niente. Per questo qui è la misura secondaria — l’ansia non risponde agli ordini, il comportamento sì.</p>","<p>How strongly you felt it, from 1 to 10. It’s useful for spotting the spikes and seeing whether they soften over time.</p><p>But it <b>isn’t the goal</b>: you can feel it at full blast and still give it nothing. That’s why it’s the secondary measure here — anxiety doesn’t take orders, behaviour does.</p>")},
 terreno:{t:L("Il terreno","The ground"),d:L("<p>La domanda che conta: <b>oggi ha deciso lei che cosa facevi?</b></p><p><b>Ho fatto lo stesso</b> — hai fatto la cosa mentre c’era. Terreno tenuto.<br><b>A metà</b> — l’hai fatta, ma monca o rimandata.<br><b>Ha deciso lei</b> — hai evitato qualcosa. Terreno ceduto.</p><p>L’evitamento è il carburante dell’ansia: è questo dato, non l’intensità, che dice se una creatura sta perdendo forza.</p>","<p>The question that counts: <b>did it decide what you did today?</b></p><p><b>I did it anyway</b> — you did the thing while it was there. Ground held.<br><b>Halfway</b> — you did it, but clipped or postponed.<br><b>It decided</b> — you avoided something. Ground given up.</p><p>Avoidance is anxiety’s fuel: it’s this figure, not the intensity, that tells you whether a creature is losing its force.</p>")},
 vocerapida:{t:L("La voce rapida","The quick entry"),d:L("<p>Il gesto quotidiano: <b>due tocchi, la sera</b>. Prima quanto forte, poi se ha deciso lei.</p><p>Se hai già segnato oggi, il secondo tocco <b>corregge</b> la voce invece di aggiungerne una nuova: una al giorno basta e avanza.</p>","<p>The daily gesture: <b>two taps, in the evening</b>. First how strongly, then whether it decided.</p><p>If you’ve already marked today, the second tap <b>corrects</b> that entry instead of adding a new one: one a day is plenty.</p>")},
 diario:{t:L("La voce lunga","The long entry"),d:L("<p>Serve quando è successo qualcosa che vale il racconto: una comparsa forte, una cosa evitata che ti brucia, una che hai fatto e non credevi.</p><p><b>Una o due volte a settimana</b> è il ritmo giusto. Ogni giorno diventa ruminazione scritta.</p><p>Scrivila <b>a freddo, la sera</b>: annotare durante il picco alimenta la bestia invece di guardarla.</p>","<p>Use it when something happened that’s worth telling: a strong appearance, an avoidance that stings, or something you did and didn’t think you could.</p><p><b>Once or twice a week</b> is the right pace. Every day turns into written rumination.</p><p>Write it <b>cold, in the evening</b>: taking notes during the spike feeds the beast instead of watching it.</p>")},
 cbt:{t:L("Interrogare la bestia","Questioning the beast"),d:L("<p>Prendi la frase esatta che ti ha detto in testa e mettila alla prova: cosa la sostiene davvero, cosa la smentisce, come suona riscritta con onestà.</p><p>Funziona <b>una volta</b>. Se rismonti lo stesso pensiero ogni giorno non è più esame di realtà, è rassicurazione compulsiva — e l’app te lo dice.</p>","<p>Take the exact sentence it said in your head and put it on trial: what really supports it, what contradicts it, how it reads rewritten honestly.</p><p>It works <b>once</b>. If you take the same thought apart every day it stops being reality testing and becomes compulsive reassurance — and the app will say so.</p>")},
 rituale:{t:L("Il rituale","The ritual"),d:L("<p>Che cosa hai fatto per attraversarla — respirazione, uscire, chiamare qualcuno, farla comunque — e se ha retto.</p><p>Dopo qualche settimana il Registro ordina i rituali per efficacia reale: scopri quali funzionano davvero e quali ti raccontavi.</p>","<p>What you did to get through it — breathing, going out, calling someone, doing it anyway — and whether it held.</p><p>After a few weeks the Ledger ranks your rituals by real effectiveness: you find out which ones work and which ones you were telling yourself about.</p>")},
 rito:{t:L("Il rito di liberazione","The rite of release"),d:L("<p>Si compie quando la creatura <b>non decide più che cosa fai</b>, non quando non la senti più: quella condizione può non arrivare mai.</p><p>Puoi liberare una bestia che senti ancora forte, se hai smesso di cederle terreno. Non viene cancellata: sale nel Paradiso con tutto il diario, e puoi riportarla giù se tornasse.</p>","<p>You perform it when the creature <b>no longer decides what you do</b> — not when you stop feeling it: that condition may never arrive.</p><p>You can release a beast you still feel strongly, as long as you’ve stopped giving it ground. It isn’t deleted: it rises into Paradise with its whole diary, and you can bring it back down if it returns.</p>")},
 presagi:{t:L("I presagi","The omens"),d:L("<p>Schemi che l’app nota da sola nei tuoi dati: il giorno della settimana peggiore, il dominio più pesante, il rituale che regge, un pensiero rismontato troppe volte, una creatura che dorme da tre settimane.</p><p>Sono osservazioni sui numeri, non diagnosi.</p>","<p>Patterns the app spots on its own in your data: the worst day of the week, the heaviest domain, the ritual that holds, a thought taken apart too many times, a creature asleep for three weeks.</p><p>They are observations about numbers, not diagnoses.</p>")},
 calendario:{t:L("Il calendario","The calendar"),d:L("<p>Un quadretto per giorno: si scurisce dove hai scritto, e il colore vira al rosso nei giorni di intensità alta.</p><p>Serve soprattutto a vedere <b>i vuoti</b>: i periodi in cui hai smesso di guardare.</p>","<p>One square per day: it darkens where you wrote, and the colour turns red on high-intensity days.</p><p>Mostly it’s there to show the <b>gaps</b>: the stretches when you stopped looking.</p>")},
 bilancia:{t:L("La bilancia dei domini","The balance of domains"),d:L("<p>Quanto pesa ogni territorio: numero di creature vive e potenza totale.</p><p>Se un dominio domina la barra, il tema vero è quello — e conviene lavorarci lì, non su una bestia alla volta.</p>","<p>How much each territory weighs: number of living creatures and total power.</p><p>If one domain dominates the bar, that’s the real theme — and it’s worth working there, rather than one beast at a time.</p>")},
 relazione:{t:L("La relazione","The report"),d:L("<p>Otto settimane condensate in una pagina: terreno tenuto e ceduto, presa per creatura, settimana per settimana, cosa ha retto, quali parole tornano.</p><p>Si scarica come pagina da stampare. È un diario personale, non un documento clinico — ma è esattamente il tipo di riepilogo che serve se un giorno ne parli con un terapeuta.</p>","<p>Eight weeks condensed into a single page: ground held and given up, grip per creature, week by week, what held, which words keep coming back.</p><p>It downloads as a printable page. It’s a personal diary, not a clinical document — but it’s exactly the kind of summary that helps if one day you talk it through with a therapist.</p>")},
 valori:{t:L("Che cosa faresti se non ci fosse","What you would do if it weren\u2019t there"),d:L("<p>La domanda che sposta lo sguardo dalla paura a <b>quello che ti sta togliendo</b>. Non serve una risposta solenne: una cena, una telefonata, un viaggio, dire di no a qualcuno.</p><p>Te la ricordo quando lanci una sfida: affrontarla non serve a dimostrare niente, serve a riprenderti quella cosa.</p>","<p>The question that shifts your eyes from the fear to <b>what it is taking from you</b>. It needn\u2019t be a solemn answer: a dinner, a phone call, a trip, saying no to someone.</p><p>I remind you of it when you set a challenge: facing it isn\u2019t about proving anything, it\u2019s about taking that thing back.</p>")},
 termometro:{t:L("Il termometro","The thermometer"),d:L("<p>Sette domande standard (il <b>GAD-7</b>) sull\u2019ansia in generale nelle ultime due settimane. Punteggio da 0 a 21: sotto 5 minima, 5\u20139 lieve, 10\u201314 moderata, 15 e oltre grave.</p><p>Le creature dicono <i>dove</i> l\u2019ansia ti prende; il termometro dice se, nel complesso, sta calando. Una volta al mese basta. Non è una diagnosi.</p>","<p>Seven standard questions (the <b>GAD-7</b>) about anxiety in general over the last two weeks. Score from 0 to 21: under 5 minimal, 5\u20139 mild, 10\u201314 moderate, 15 and over severe.</p><p>The creatures say <i>where</i> anxiety grabs you; the thermometer says whether, overall, it\u2019s coming down. Once a month is enough. It isn\u2019t a diagnosis.</p>")},
 costo:{t:L("Che cosa ti costa","What it costs you"),d:L("<p>Le aree della tua vita su cui questa creatura mette le mani. Ogni volta che le cedi terreno, il conto si segna lì.</p><p>Serve a trasformare un numero in un motivo: <b>«ceduto 9 volte»</b> dice poco, <b>«ti è costata tre cene, due palestre e una telefonata»</b> dice tutto.</p>","<p>The areas of your life this creature gets its hands on. Every time you give it ground, the cost is charged there.</p><p>It turns a number into a reason: <b>«given up 9 times»</b> says little, <b>«it cost you three dinners, two workouts and one phone call»</b> says everything.</p>")},
 sfida:{t:L("Le sfide","Challenges"),d:L("<p>Registrare l’evitamento serve a vederlo. <b>Disfarlo</b> è un’altra cosa: scegli una cosa che la creatura ti ha fatto evitare, fissa quando la fai, e dichiara prima <b>quanto temi che sia brutta</b>, da 1 a 10.</p><p>Dopo segni com’è andata e quanto è stata brutta <i>davvero</i>. Quasi sempre il numero reale è più basso di quello temuto: è questa distanza, ripetuta, che smonta una paura — molto più del ragionarci sopra.</p><p>Una sfida per volta, piccola abbastanza da farla.</p>","<p>Recording avoidance lets you see it. <b>Undoing it</b> is another matter: pick something the creature made you avoid, set a date for doing it, and declare up front <b>how bad you expect it to be</b>, from 1 to 10.</p><p>Afterwards you record how it went and how bad it <i>actually</i> was. Almost always the real number is lower than the feared one: that gap, repeated, is what dismantles a fear — far more than reasoning about it.</p><p>One challenge at a time, small enough that you’ll actually do it.</p>")},
 tempesta:{t:L("Terreno sotto tempesta","Ground under storm"),d:L("<p>Aver fatto la cosa in un giorno in cui la sentivi <b>7 o più</b>. Vale il doppio: andarci quando è tranquillo non insegna niente al sistema di allarme, andarci quando urla sì.</p><p>Nel registro delle tessere lo trovi in oro.</p>","<p>Having done the thing on a day you felt it at <b>7 or more</b>. It counts double: going when it’s quiet teaches the alarm system nothing, going when it’s screaming does.</p><p>In the row of tiles you’ll find those in gold.</p>")},
 dormiente:{t:L("Creature dormienti","Sleeping creatures"),d:L("<p>Una creatura che non si fa viva da due mesi non è più un problema attivo: è un ricordo che occupa posto sulla mappa.</p><p>Tenerne dodici addosso per sempre finisce per somigliare a un’identità. Se dorme, o la liberi o le dai un altro mese — l’app non decide al posto tuo, ma te lo chiede.</p>","<p>A creature that hasn’t shown up for two months isn’t an active problem any more: it’s a memory taking up room on the map.</p><p>Carrying twelve of them forever starts to look like an identity. If one sleeps, either you release it or you give it another month — the app won’t decide for you, but it will ask.</p>")},
 notte:{t:L("Il modo notte","Night mode"),d:L("<p>Serve quando succede <b>adesso</b>, di notte o nel mezzo di un picco. In quel momento valutare l’intensità o smontare il pensiero non aiuta: lo alimenta.</p><p>Quindi l’app non ti chiede niente. Scrivi una riga, lei se la tiene e te la ripropone la sera dopo, quando puoi guardarla a mente fredda. Rimandare il rimuginio a una finestra stabilita è una delle poche cose che funzionano davvero sul pensiero notturno.</p>","<p>This is for when it’s happening <b>right now</b> — at night, or in the middle of a spike. In that moment, rating the intensity or dismantling the thought doesn’t help: it feeds it.</p><p>So the app asks you nothing. Write one line, it keeps it and hands it back the next evening, when you can look at it cold. Postponing rumination to a set window is one of the few things that genuinely works on night-time thinking.</p>")},
 custodia:{t:L("Custodia del tomo","Keeping the tome"),d:L("<p>I dati vivono solo in questo browser: nessuno li vede, ma nessuno li salva al posto tuo.</p><p><b>Scaricare il tomo</b> ti dà un file HTML che contiene l’app e le tue creature insieme: si riapre da solo, anche senza rete. Fallo ogni tanto.</p>","<p>The data lives only in this browser: nobody sees it, but nobody backs it up for you either.</p><p><b>Download the tome</b> and you get an HTML file containing the app and your creatures together: it opens on its own, even offline. Do it every so often.</p>")}
};
function hq(k){ return '<button class="q" data-help="'+k+L('" aria-label="Spiegazione">?</button>','" aria-label="Explanation">?</button>'); }
function openTip(k){
  var h=HELP[k]; if(!h) return;
  var app=document.querySelector(".app"); if(!app) return;
  var old=app.querySelector(".tip"), olds=app.querySelector(".tipscrim");
  if(old) old.remove(); if(olds) olds.remove();
  var sc=h_el('<div class="tipscrim"></div>');
  var tp=h_el('<div class="tip" role="dialog"><h3>'+h.t+'</h3>'+h.d+L('<button class="close">Ho capito</button></div>','<button class="close">Got it</button></div>'));
  function close(){ sc.remove(); tp.remove(); }
  sc.onclick=close; tp.querySelector(".close").onclick=close;
  app.appendChild(sc); app.appendChild(tp);
}
document.addEventListener("click", function(e){
  var b=e.target.closest?e.target.closest("[data-help]"):null;
  if(!b) return;
  e.preventDefault(); e.stopPropagation();
  openTip(b.dataset.help);
}, true);

/* ===================== utilità ===================== */
function el(id){ return document.getElementById(id); }
function h(html){ var d=document.createElement("div"); d.innerHTML=html; return d.firstElementChild; }
function h_el(html){ return h(html); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function uid(){ return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function todayISO(){ var d=new Date(), o=d.getTimezoneOffset();
  return new Date(d.getTime()-o*60000).toISOString().slice(0,10); }
function dISO(d){ var o=d.getTimezoneOffset(); return new Date(d.getTime()-o*60000).toISOString().slice(0,10); }
function fmtDate(iso){ if(!iso) return "";
  var p=String(iso).slice(0,10).split("-");
  return p[2].replace(/^0/,"")+" "+MESI3[parseInt(p[1],10)-1]+" "+p[0]; }
function fmtLong(iso){ if(!iso) return "";
  var p=String(iso).slice(0,10).split("-");
  return p[2].replace(/^0/,"")+" "+MESI[parseInt(p[1],10)-1]+" "+p[0]; }
function daysBetween(a,b){ return Math.max(0, Math.round((new Date(b)-new Date(a))/86400000)); }
function seedOf(str){ var x=2166136261>>>0; for(var i=0;i<str.length;i++){ x^=str.charCodeAt(i); x=Math.imul(x,16777619)>>>0; } return x>>>0; }
function rng(seed){ var s=seed>>>0; return function(){ s|=0; s=s+0x6D2B79F5|0;
  var t=Math.imul(s^s>>>15,1|s); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function regionOf(k){ for(var i=0;i<REGIONS.length;i++) if(REGIONS[i].k===k) return REGIONS[i]; return REGIONS[0]; }
var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
